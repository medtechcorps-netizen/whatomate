name: Rollback Production Orphan

run-name: Roll back one reconciled production orphan while retaining its exact main lock

on:
  workflow_dispatch:
    inputs:
      rollback_evidence_json:
        description: Exact control SHA plus committed reconciliation, rollback target, recovery, and rollout authorities
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_REPOSITORY: medtechcorps-netizen/whatomate
  WORKFLOW_PATH: .github/workflows/rollback-production-orphan.yml
  RECONCILE_WORKFLOW_PATH: .github/workflows/reconcile-production-orphan.yml
  CANARY_WORKFLOW_PATH: .github/workflows/verify-production-crm-canary.yml
  RECOVERY_WORKFLOW_PATH: .github/workflows/verify-production-recovery-readiness.yml
  CONTROLLER_PATH: release/deployment/rollback_production_change.py
  COMMON_PATH: release/deployment/verify_production_release.py
  POLICY_PATH: release/deployment/production-release-policy.json
  SCHEMA_PATH: release/deployment/production-change.schema.json
  INTENT_SCHEMA_PATH: release/deployment/production-mutation-intent.schema.json
  LOCK_PROOF_SCHEMA_PATH: release/deployment/production-main-lock-proof.schema.json
  INTENT_PREDICATE: https://rereply.app/attestations/production-mutation-intent/v2
  LOCK_PROOF_PREDICATE: https://rereply.app/attestations/production-main-lock-proof/v1
  RECONCILIATION_PREDICATE: https://rereply.app/attestations/production-orphan-reconciliation/v1
  ORPHAN_ROLLBACK_PREDICATE: https://rereply.app/attestations/production-orphan-rollback-receipt/v1
  PINNED_JQ_VERSION: "1.8.2"
  PINNED_JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
  PINNED_JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
  PINNED_GH_VERSION: "2.98.0"
  PINNED_GH_URL: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
  PINNED_GH_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de

jobs:
  authority:
    name: Authenticate exact production orphan rollback authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      control_sha: ${{ steps.guard.outputs.control_sha }}
      current_run_id: ${{ steps.github.outputs.current_run_id }}
      current_name: ${{ steps.github.outputs.current_name }}
      target_run_id: ${{ steps.github.outputs.target_run_id }}
      target_name: ${{ steps.github.outputs.target_name }}
      recovery_run_id: ${{ steps.github.outputs.recovery_run_id }}
      recovery_name: ${{ steps.github.outputs.recovery_name }}
    steps:
      - name: Require exact protected-main attempt-one orphan rollback authority
        id: guard
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch && "$REPOSITORY" == "$RELEASE_REPOSITORY" ]]
          [[ "$DISPATCH_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$RUN_ATTEMPT" == 1 && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$WORKFLOW_REF" == "$RELEASE_REPOSITORY/$WORKFLOW_PATH@refs/heads/main" ]]
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'control_sha=%s\n' "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out exact protected orphan rollback controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.guard.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Authenticate immutable orphan rollback artifacts
        id: github
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ steps.guard.outputs.control_sha }}
          RAW: ${{ inputs.rollback_evidence_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const value=JSON.parse(process.env.RAW);
            const top=['control_sha','current_state','recovery','rollout_plan_sha256','target_state'];
            if(JSON.stringify(Object.keys(value).sort())!==JSON.stringify(top) || value.control_sha!==process.env.CONTROL_SHA || !/^[0-9a-f]{64}$/.test(value.rollout_plan_sha256)) throw new Error('orphan rollback descriptor differs');
            if(value.current_state.kind!=='reconciliation-receipt') throw new Error('orphan rollback requires a reconciliation receipt');
            const {owner,repo}=context.repo;
            const main=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if(main.data.object.sha!==process.env.CONTROL_SHA) throw new Error('main changed');
            async function artifact(binding,kind,workflow,name,expectedJobs,expectedArtifacts) {
              const keys=kind==='current'?['artifact_digest','artifact_id','kind','run_attempt','run_id','sha256']:['artifact_digest','artifact_id','run_attempt','run_id','sha256'];
              if(JSON.stringify(Object.keys(binding).sort())!==JSON.stringify(keys) || binding.run_attempt!==1 || !/^[1-9][0-9]{0,14}$/.test(String(binding.run_id)) || !/^[1-9][0-9]{0,14}$/.test(String(binding.artifact_id)) || !/^sha256:[0-9a-f]{64}$/.test(binding.artifact_digest) || !/^[0-9a-f]{64}$/.test(binding.sha256)) throw new Error(`${kind} binding differs`);
              const latest=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(binding.run_id)});
              const exact=await github.rest.actions.getWorkflowRunAttempt({owner,repo,run_id:Number(binding.run_id),attempt_number:1});
              for(const run of [latest.data,exact.data]) if(run.run_attempt!==1 || run.head_sha!==process.env.CONTROL_SHA || run.head_branch!=='main' || run.event!=='workflow_dispatch' || run.path!==workflow || run.status!=='completed' || run.conclusion!=='success') throw new Error(`${kind} run differs`);
              const jobs=await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',{owner,repo,run_id:Number(binding.run_id),attempt_number:1,per_page:100});
              if(JSON.stringify(jobs.map(job=>job.name).sort())!==JSON.stringify([...expectedJobs].sort()) || jobs.some(job=>job.status!=='completed' || job.conclusion!=='success')) throw new Error(`${kind} job inventory differs`);
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:Number(binding.run_id),per_page:100});
              if(JSON.stringify(artifacts.map(item=>item.name).sort())!==JSON.stringify([...expectedArtifacts].sort())) throw new Error(`${kind} artifact inventory differs`);
              const selected=artifacts.filter(item=>item.id===Number(binding.artifact_id));
              if(selected.length!==1 || selected[0].name!==name || selected[0].digest!==binding.artifact_digest || selected[0].expired || selected[0].workflow_run.id!==Number(binding.run_id)) throw new Error(`${kind} artifact differs`);
              return name;
            }
            const canaryJobs=['Authenticate exact change receipt authority','Run content-free production and synthetic canaries','Exact production phase gate'];
            const recoveryJobs=['Authenticate exact production recovery authority','Observe exact production recovery state','Exact production recovery readiness gate'];
            const reconciliationJobs=['Authenticate and attest the single-operator lock assertion','Classify exact production orphan with GET-only capability','Exact production orphan reconciliation gate'];
            const currentName=await artifact(value.current_state,'current',process.env.RECONCILE_WORKFLOW_PATH,`production-orphan-reconciliation-${value.current_state.run_id}-1`,reconciliationJobs,[`production-main-lock-assertion-${value.current_state.run_id}-1`,`unsigned-production-orphan-reconciliation-${value.current_state.run_id}-1`,`production-orphan-reconciliation-${value.current_state.run_id}-1`]);
            const targetName=await artifact(value.target_state,'target',process.env.CANARY_WORKFLOW_PATH,`production-phase-state-${value.target_state.run_id}-1`,canaryJobs,[`production-crm-canary-${value.target_state.run_id}-1`,`production-phase-state-${value.target_state.run_id}-1`]);
            const recoveryName=await artifact(value.recovery,'recovery',process.env.RECOVERY_WORKFLOW_PATH,`production-recovery-readiness-${value.recovery.run_id}-1`,recoveryJobs,[`unsigned-production-recovery-readiness-${value.recovery.run_id}-1`,`production-recovery-readiness-${value.recovery.run_id}-1`]);
            core.setOutput('current_run_id',String(value.current_state.run_id)); core.setOutput('current_name',currentName);
            core.setOutput('target_run_id',String(value.target_state.run_id)); core.setOutput('target_name',targetName);
            core.setOutput('recovery_run_id',String(value.recovery.run_id)); core.setOutput('recovery_name',recoveryName);

  intent:
    name: Prepare and attest exact production orphan rollback mutation intent
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      intent_name: ${{ steps.prepare.outputs.intent_name }}
      intent_sha256: ${{ steps.prepare.outputs.intent_sha256 }}
      intent_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      intent_artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
    steps:
      - name: Check out exact protected orphan rollback controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Download exact committed reconciliation authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.current_name }}
          path: ${{ runner.temp }}/current
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.current_run_id }}

      - name: Download exact target phase state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.target_name }}
          path: ${{ runner.temp }}/target-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.target_run_id }}

      - name: Download fresh recovery readiness
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.recovery_name }}
          path: ${{ runner.temp }}/recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.recovery_run_id }}

      - name: Install pinned orphan rollback intent authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]

      - name: Authenticate exact orphan rollback inputs before signing intent
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          RAW: ${{ inputs.rollback_evidence_json }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B -c '
          import os,pathlib,sys
          sys.path.insert(0,"control/release/deployment")
          import verify_production_release as c, rollback_production_change as r
          value=c.loads_strict(os.environ["RAW"])
          if value.pop("control_sha",None)!=os.environ["CONTROL_SHA"]: c.fail("control SHA differs")
          r.validate_request(value)
          if value["current_state"]["kind"]!="reconciliation-receipt": c.fail("orphan rollback current kind differs")
          pathlib.Path(os.environ["RUNNER_TEMP"]+"/rollback-evidence.json").write_bytes(c.canonical_file_bytes(value))'
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          verify_subject() {
            local directory="$1" stem="$2" expected_sha="$3" signer_path="$4" predicate="$5" label="$6"
            local subject="$directory/$stem.json" sidecar="$directory/$stem.sha256"
            [[ "$(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort)" == "$stem.json"$'\n'"$stem.sha256" ]]
            [[ -z "$(find "$directory" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
            [[ "$(cat "$sidecar")" == "$expected_sha" && "$(sha256sum "$subject" | awk '{print $1}')" == "$expected_sha" ]]
            flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$signer_path" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
            "$gh_bin" attestation verify "$subject" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/$label-provenance.json"
            "$gh_bin" attestation verify "$subject" "${flags[@]}" --predicate-type "$predicate" > "$RUNNER_TEMP/$label-policy.json"
            "$jq_bin" -e --slurpfile expected "$subject" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/$label-policy.json" > /dev/null
          }
          verify_subject "$RUNNER_TEMP/current" production-orphan-reconciliation "$("$jq_bin" -er '.current_state.sha256' "$RUNNER_TEMP/rollback-evidence.json")" "$RECONCILE_WORKFLOW_PATH" "$RECONCILIATION_PREDICATE" current
          verify_subject "$RUNNER_TEMP/target-state" production-phase-state "$("$jq_bin" -er '.target_state.sha256' "$RUNNER_TEMP/rollback-evidence.json")" "$CANARY_WORKFLOW_PATH" https://rereply.app/attestations/production-phase-state/v1 target
          verify_subject "$RUNNER_TEMP/recovery" production-recovery-readiness "$("$jq_bin" -er '.recovery.sha256' "$RUNNER_TEMP/rollback-evidence.json")" "$RECOVERY_WORKFLOW_PATH" https://rereply.app/attestations/production-recovery-readiness/v1 recovery

      - name: Prepare exact sanitized orphan rollback mutation intent without credentials
        id: prepare
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_SHA" == "$CONTROL_SHA" ]]
          /usr/bin/python3 -I -S -B - <<'PY'
          import copy,os,pathlib,sys
          sys.path.insert(0,'control/release/deployment')
          import verify_production_release as common
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          current=common.validate_reconciliation_receipt(common.load_json(root/'current'/'production-orphan-reconciliation.json','reconciliation receipt'))
          lock=copy.deepcopy(current['intent']['lock'])
          if lock['strategy']=='acquire':
              lock['strategy']='inherit'
              lock['expected_pre_lock']['lock_branch']=True
              lock['owner_intent_sha256']=current['intent']['binding']['sha256']
          elif lock['strategy']!='inherit':
              common.fail('reconciliation lock strategy differs')
          (root/'lock-authority.json').write_bytes(common.canonical_file_bytes(lock))
          (root/'route-contract.sha256').write_text(current['canary']['route_contract_sha256']+'\n',encoding='ascii')
          PY
          controller_sha="$(sha256sum "control/$CONTROLLER_PATH" | awk '{print $1}')"
          policy_sha="$(sha256sum "control/$POLICY_PATH" | awk '{print $1}')"
          schema_sha="$(sha256sum "control/$SCHEMA_PATH" | awk '{print $1}')"
          intent_schema_sha="$(sha256sum "control/$INTENT_SCHEMA_PATH" | awk '{print $1}')"
          /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" prepare-intent \
            --evidence-request "$RUNNER_TEMP/rollback-evidence.json" \
            --current-state "$RUNNER_TEMP/current/production-orphan-reconciliation.json" \
            --target-state "$RUNNER_TEMP/target-state/production-phase-state.json" \
            --recovery "$RUNNER_TEMP/recovery/production-recovery-readiness.json" \
            --release-policy-sha256 "$policy_sha" --change-schema-sha256 "$schema_sha" \
            --mutation-intent-schema-sha256 "$intent_schema_sha" --controller-sha256 "$controller_sha" \
            --workflow-path "$WORKFLOW_PATH" --workflow-sha "$CONTROL_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt 1 --runner-temp "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/production-mutation-intent.json" --lock-authority "$RUNNER_TEMP/lock-authority.json" \
            --route-contract-sha256 "$(cat "$RUNNER_TEMP/route-contract.sha256")"
          intent_sha="$(sha256sum "$RUNNER_TEMP/production-mutation-intent.json" | awk '{print $1}')"
          printf '%s\n' "$intent_sha" > "$RUNNER_TEMP/production-mutation-intent.sha256"
          printf 'intent_name=production-mutation-intent-orphan-rollback-%s-1\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'intent_sha256=%s\n' "$intent_sha" >> "$GITHUB_OUTPUT"

      - name: Attest production orphan rollback mutation intent provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/production-mutation-intent.json

      - name: Attest exact production orphan rollback mutation intent policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/production-mutation-intent.json
          predicate-type: ${{ env.INTENT_PREDICATE }}
          predicate-path: ${{ runner.temp }}/production-mutation-intent.json

      - name: Upload exact production orphan rollback mutation intent
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prepare.outputs.intent_name }}
          path: |
            ${{ runner.temp }}/production-mutation-intent.json
            ${{ runner.temp }}/production-mutation-intent.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Canonicalize orphan rollback mutation-intent artifact digest
        id: digest
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact_digest=sha256:%s\n' "$RAW_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  lock_proof:
    name: Attest exact production orphan rollback main lock proof
    needs: [authority, intent]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-apply
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      proof_name: ${{ steps.prepare.outputs.proof_name }}
      proof_sha256: ${{ steps.prepare.outputs.proof_sha256 }}
      proof_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      proof_artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
      rule_id: ${{ steps.prepare.outputs.rule_id }}
    steps:
      - name: Check out exact protected orphan rollback controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Install pinned orphan rollback lock-proof authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"

      - name: Download exact signed orphan rollback mutation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.intent.outputs.intent_artifact_id }}
          path: ${{ runner.temp }}/mutation-intent

      - name: Recheck inherited lock and build exact orphan rollback proof
        id: prepare
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_PRODUCTION_BRANCH_READ_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_READ_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          INTENT_ARTIFACT_DIGEST: ${{ needs.intent.outputs.intent_artifact_digest }}
          INTENT_ARTIFACT_ID: ${{ needs.intent.outputs.intent_artifact_id }}
          INTENT_ARTIFACT_NAME: ${{ needs.intent.outputs.intent_name }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          branch_read_token="$GH_PRODUCTION_BRANCH_READ_TOKEN"
          github_read_token="$GITHUB_READ_TOKEN"
          unset GH_PRODUCTION_BRANCH_READ_TOKEN GITHUB_READ_TOKEN GH_TOKEN GITHUB_TOKEN
          [[ -n "$branch_read_token" && -n "$github_read_token" ]]
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          intent="$RUNNER_TEMP/mutation-intent/production-mutation-intent.json"
          [[ "$(find "$RUNNER_TEMP/mutation-intent" -maxdepth 1 -type f -printf '%f\n' | sort)" == $'production-mutation-intent.json\nproduction-mutation-intent.sha256' ]]
          [[ -z "$(find "$RUNNER_TEMP/mutation-intent" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(cat "$RUNNER_TEMP/mutation-intent/production-mutation-intent.sha256")" == "$INTENT_SHA256" && "$(sha256sum "$intent" | awk '{print $1}')" == "$INTENT_SHA256" ]]
          artifact="$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$INTENT_ARTIFACT_ID")"
          "$jq_bin" -e --arg name "$INTENT_ARTIFACT_NAME" --arg digest "$INTENT_ARTIFACT_DIGEST" --argjson run_id "$GITHUB_RUN_ID" '.name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' <<< "$artifact" > /dev/null
          flags=(--repo "$GITHUB_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$WORKFLOW_PATH" --signer-digest "$CONTROL_SHA" --source-ref refs/heads/main --source-digest "$CONTROL_SHA" --deny-self-hosted-runners --format json)
          GH_TOKEN="$github_read_token" "$gh_bin" attestation verify "$intent" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/proof-intent-provenance.json"
          GH_TOKEN="$github_read_token" "$gh_bin" attestation verify "$intent" "${flags[@]}" --predicate-type "$INTENT_PREDICATE" > "$RUNNER_TEMP/proof-intent-policy.json"
