          mkdir -m 0700 "$anonymous_home" "$anonymous_config"
          /usr/bin/python3 -I -S -B - <<'PY' > "$anonymous_root/subjects.txt"
          import json,pathlib,re
          value=json.loads((pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'target-state'/'production-phase-state.json').read_text(encoding='utf-8'))
          images=value.get('provider_state',{}).get('images')
          expected=['gmail-relay','meta-relay','web']
          if not isinstance(images,list) or sorted(item.get('component') for item in images if isinstance(item,dict))!=expected:
              raise SystemExit('orphan rollback target image tuple differs')
          subjects=[]
          for item in sorted(images,key=lambda record:record['component']):
              component=item['component']; repository=f'ghcr.io/medtechcorps-netizen/rereply-release-{component}'
              digest=item.get('digest'); subject=item.get('subject')
              if set(item)!={'component','repository','digest','subject'} or item.get('repository')!=repository:
