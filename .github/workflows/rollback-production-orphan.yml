          INTENT_ARTIFACT_DIGEST="$INTENT_ARTIFACT_DIGEST" INTENT_ARTIFACT_ID="$INTENT_ARTIFACT_ID" INTENT_ARTIFACT_NAME="$INTENT_ARTIFACT_NAME" INTENT_SHA256="$INTENT_SHA256" RULE_ID="$rule_id" RULE_IDENTITY_SHA256="$rule_identity_sha256" /usr/bin/python3 -I -S -B - <<'PY'
          import os,pathlib,sys
