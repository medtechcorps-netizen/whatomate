          sys.path.insert(0,"control/release/deployment")
          import rollback_production_change as controller
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          arguments=["execute","--target",target,"--evidence-request",str(root/"rollback-evidence.json"),"--current-state",str(root/"current"/"production-orphan-reconciliation.json"),"--target-state",str(root/"target-state"/"production-phase-state.json"),"--recovery",str(root/"recovery"/"production-recovery-readiness.json"),"--release-policy-sha256",hashlib.sha256(pathlib.Path("control/release/deployment/production-release-policy.json").read_bytes()).hexdigest(),"--change-schema-sha256",hashlib.sha256(pathlib.Path("control/release/deployment/production-change.schema.json").read_bytes()).hexdigest(),"--mutation-intent-schema-sha256",hashlib.sha256(pathlib.Path("control/release/deployment/production-mutation-intent.schema.json").read_bytes()).hexdigest(),"--controller-sha256",hashlib.sha256(pathlib.Path("control/release/deployment/rollback_production_change.py").read_bytes()).hexdigest(),"--workflow-path",os.environ["WORKFLOW_PATH"],"--workflow-sha",os.environ["CONTROL_SHA"],"--workflow-run-id",os.environ["GITHUB_RUN_ID"],"--workflow-run-attempt","1","--runner-temp",str(root),"--output",str(root/"production-orphan-rollback-receipt.json"),"--mutation-intent",str(root/"mutation-intent"/"production-mutation-intent.json"),"--mutation-intent-authority",str(root/"mutation-intent-authority.json"),"--main-lock-proof",str(root/"main-lock-proof"/"production-main-lock-proof.json"),"--main-lock-proof-authority",str(root/"main-lock-proof-authority.json")]
          raise SystemExit(controller.run_cli(arguments))'
          unset DO_PRODUCTION_APPLY_TOKEN DO_PRODUCTION_TARGET_JSON
          provider_token= target_json=
          [[ "$(read_api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$CONTROL_SHA" ]]
          post_lock="$(GH_TOKEN="$branch_read_token" "$gh_bin" api graphql -f "query=$query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg id "$rule_id" --arg sha "$CONTROL_SHA" '.data.repository.ref.target.oid == $sha and .data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == true and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$post_lock" > /dev/null
          cleanup_secrets
          trap - EXIT

      - name: Create exact sanitized orphan rollback sidecar
        id: name
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum production-orphan-rollback-receipt.json | awk '{print $1}' > production-orphan-rollback-receipt.sha256
          printf 'internal_name=unsigned-production-orphan-rollback-%s-1\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned orphan rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.internal_name }}
          path: |
            ${{ runner.temp }}/production-orphan-rollback-receipt.json
            ${{ runner.temp }}/production-orphan-rollback-receipt.sha256
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Exact production orphan rollback receipt gate
    needs: [authority, intent, lock_proof, rollback]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-apply
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact protected orphan rollback controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Download unsigned exact orphan rollback receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.rollback.outputs.internal_name }}
          path: ${{ runner.temp }}/receipt

      - name: Recheck exact protected main and inherited lock before attestation
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          CURRENT_RUN_ID: ${{ needs.authority.outputs.current_run_id }}
          TARGET_RUN_ID: ${{ needs.authority.outputs.target_run_id }}
          RECOVERY_RUN_ID: ${{ needs.authority.outputs.recovery_run_id }}
          INTENT_ARTIFACT_ID: ${{ needs.intent.outputs.intent_artifact_id }}
          INTENT_ARTIFACT_DIGEST: ${{ needs.intent.outputs.intent_artifact_digest }}
          INTENT_ARTIFACT_NAME: ${{ needs.intent.outputs.intent_name }}
          PROOF_ARTIFACT_ID: ${{ needs.lock_proof.outputs.proof_artifact_id }}
          PROOF_ARTIFACT_DIGEST: ${{ needs.lock_proof.outputs.proof_artifact_digest }}
          PROOF_ARTIFACT_NAME: ${{ needs.lock_proof.outputs.proof_name }}
          RULE_ID: ${{ needs.lock_proof.outputs.rule_id }}
        with:
          github-token: ${{ secrets.GH_PRODUCTION_BRANCH_READ_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const main=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const current=await github.rest.actions.getWorkflowRun({owner,repo,run_id:context.runId});
            if(main.data.object.sha!==process.env.CONTROL_SHA || current.data.run_attempt!==1 || current.data.head_sha!==process.env.CONTROL_SHA || current.data.head_branch!=='main' || current.data.event!=='workflow_dispatch') throw new Error('orphan rollback gate authority changed');
            for(const runId of [process.env.CURRENT_RUN_ID,process.env.TARGET_RUN_ID,process.env.RECOVERY_RUN_ID]) {
              const latest=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(runId)});
              const exact=await github.rest.actions.getWorkflowRunAttempt({owner,repo,run_id:Number(runId),attempt_number:1});
              for(const run of [latest.data,exact.data]) if(run.run_attempt!==1 || run.head_sha!==process.env.CONTROL_SHA || run.head_branch!=='main' || run.event!=='workflow_dispatch' || run.status!=='completed' || run.conclusion!=='success') throw new Error('orphan rollback upstream changed');
            }
            const jobs=await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',{owner,repo,run_id:context.runId,attempt_number:1,per_page:100});
            const required=['Authenticate exact production orphan rollback authority','Prepare and attest exact production orphan rollback mutation intent','Attest exact production orphan rollback main lock proof','Roll back exact production orphan'];
            for(const name of required) {
              const job=jobs.find(item=>item.name===name);
              if(!job || job.status!=='completed' || job.conclusion!=='success') throw new Error(`orphan rollback prerequisite differs: ${name}`);
            }
            for(const [id,name,digest] of [[process.env.INTENT_ARTIFACT_ID,process.env.INTENT_ARTIFACT_NAME,process.env.INTENT_ARTIFACT_DIGEST],[process.env.PROOF_ARTIFACT_ID,process.env.PROOF_ARTIFACT_NAME,process.env.PROOF_ARTIFACT_DIGEST]]) {
              const artifact=await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(id)});
              if(artifact.data.name!==name || artifact.data.digest!==digest || artifact.data.expired || artifact.data.workflow_run.id!==context.runId) throw new Error('orphan rollback artifact changed');
            }
            const query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}}}}';
            const result=await github.graphql(query,{owner,name:repo});
            const connection=result.repository.branchProtectionRules;
            const rules=connection.nodes.filter(rule=>rule.pattern==='main');
            if(connection.pageInfo.hasNextPage || rules.length!==1 || rules[0].id!==process.env.RULE_ID || rules[0].lockBranch!==true || rules[0].isAdminEnforced!==true || rules[0].lockAllowsFetchAndMerge!==false) throw new Error('inherited lock changed before attestation');

      - name: Validate exact orphan rollback receipt
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_SHA" == "$CONTROL_SHA" ]]
          cd "$RUNNER_TEMP/receipt"
          [[ "$(find . -maxdepth 1 -type f -printf '%f\n' | sort)" == $'production-orphan-rollback-receipt.json\nproduction-orphan-rollback-receipt.sha256' ]]
          [[ -z "$(find . -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(cat production-orphan-rollback-receipt.sha256)" == "$(sha256sum production-orphan-rollback-receipt.json | awk '{print $1}')" ]]
          /usr/bin/python3 -I -S -B -c 'import pathlib,sys; sys.path.insert(0,"control/release/deployment"); import rollback_production_change as r, verify_production_release as v; p=pathlib.Path("'"$RUNNER_TEMP"'/receipt/production-orphan-rollback-receipt.json"); r.validate_orphan_rollback_receipt(v.load_json(p,"orphan rollback receipt"))'

      - name: Attest orphan rollback provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/receipt/production-orphan-rollback-receipt.json

      - name: Attest exact orphan rollback policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/receipt/production-orphan-rollback-receipt.json
          predicate-type: ${{ env.ORPHAN_ROLLBACK_PREDICATE }}
          predicate-path: ${{ runner.temp }}/receipt/production-orphan-rollback-receipt.json

      - name: Upload signed exact orphan rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-orphan-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/receipt/production-orphan-rollback-receipt.json
            ${{ runner.temp }}/receipt/production-orphan-rollback-receipt.sha256
          if-no-files-found: error
          retention-days: 30
