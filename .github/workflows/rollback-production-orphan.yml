              if not isinstance(digest,str) or re.fullmatch(r'sha256:[0-9a-f]{64}',digest) is None or subject!=f'{repository}@{digest}':
                  raise SystemExit('orphan rollback image subject differs')
              subjects.append(subject)
          if len(set(subjects))!=3: raise SystemExit('orphan rollback image subjects are not unique')
          print(*subjects,sep='\n')
          PY
          mapfile -t target_images < "$anonymous_root/subjects.txt"
          [[ "${#target_images[@]}" -eq 3 ]]
          for image in "${target_images[@]}"; do
            [[ "$image" =~ ^ghcr\.io/medtechcorps-netizen/rereply-release-(web|meta-relay|gmail-relay)@sha256:[0-9a-f]{64}$ ]]
            env -i DOCKER_CONFIG="$anonymous_config" HOME="$anonymous_home" LANG=C.UTF-8 PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/docker pull --platform linux/amd64 "$image"
          done
          if [[ -f "$anonymous_config/config.json" ]]; then
            "$RUNNER_TEMP/release-tools/jq" -e '((.auths // {}) | length) == 0 and ((.credHelpers // {}) | length) == 0 and ((.credsStore // "") == "")' "$anonymous_config/config.json" > /dev/null
          fi

      - name: Roll back with one inherited-lock app-update capability
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
