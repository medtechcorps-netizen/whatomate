          if proof['mutation_intent']!=intent_authority: common.fail('orphan rollback proof intent authority differs')
          (root/'mutation-intent-authority.json').write_bytes(common.canonical_file_bytes(intent_authority))
          (root/'main-lock-proof-authority.json').write_bytes(common.canonical_file_bytes(proof_authority))
          PY
          export DO_PRODUCTION_APPLY_TOKEN="$provider_token"
