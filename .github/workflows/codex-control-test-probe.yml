name: Codex Control Test Probe

# Temporary probe: runs the production-control suites against one exact revision
# and reports the result, so a control-plane change can be evidenced in CI
# without waiting on the product test jobs. Remove after use.
on:
  push:

permissions:
  contents: read

jobs:
  control-suites:
    name: Control suites at the pinned revision
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5aca6a3118cef9c10f6de1e93281a55d8e02424d
          # The control suites read pinned release blobs out of history, so the
          # probe needs the same full checkout the repository's own gate uses.
          fetch-depth: 0
          persist-credentials: false
      - name: Report the revision
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum release/deployment/production-app-contract.json
      - name: Produce the production control suites
        run: |
          set -euo pipefail
          # The runtime suites assert the workflow's pinned jq, so the probe
          # must install that exact binary instead of the runner's distro jq.
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64 -o "$RUNNER_TEMP/jq"
          echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  $RUNNER_TEMP/jq" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/jq"
          "$RUNNER_TEMP/jq" --version
          export RELEASE_TEST_JQ="$RUNNER_TEMP/jq"
          export RELEASE_TEST_BASH="/usr/bin/bash"
          python3 -m py_compile \
            release/deployment/verify_production_plan.py \
            release/deployment/test_verify_production_plan.py
          python3 -m unittest discover -s release/deployment -p 'test_*.py'
          python3 -B -m unittest discover -s release/canary -p 'test_*.py'
