name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-shard:
    name: e2e-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: whatomate_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create test config
        run: |
          cat > config.toml << 'EOF'
          [app]
          name = "ReReply"
          environment = "test"
          debug = true
          # CI-only deterministic fixture key for this disposable test database.
          encryption_key = "synthetic-e2e-key-not-for-production" # gitleaks:allow

          [server]
          host = "0.0.0.0"
          port = 8080
          read_timeout = 30
          write_timeout = 30
          base_path = ""

          [database]
          host = "localhost"
          port = 5432
          user = "test"
          password = "test"
          name = "whatomate_test"
          ssl_mode = "disable"
          max_open_conns = 25
          max_idle_conns = 5
          conn_max_lifetime = 300

          [redis]
          host = "localhost"
          port = 6379
          username = ""
          password = ""
          db = 0
          tls = false

          [jwt]
          secret = "test-secret-key-for-ci"
          access_expiry_mins = 60
          refresh_expiry_days = 7

          [storage]
          type = "local"
          local_path = "./uploads"

          [whatsapp]
          base_url = "http://127.0.0.1:9"
          EOF

      # Build frontend FIRST so it can be embedded in the backend
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Copy frontend to embed directory
        run: |
          rm -rf internal/frontend/dist/*
          cp -r frontend/dist/* internal/frontend/dist/

      - name: Build backend
        run: go build -o rereply ./cmd/whatomate

      - name: Start backend with migrations
        run: |
          ./rereply server -migrate > backend.log 2>&1 &
          backend_pid=$!

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://localhost:8080/health > /dev/null; then
              echo "Backend became healthy after $((attempt * 2)) seconds"
              exit 0
            fi

            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "Backend exited before becoming healthy"
              cat backend.log
              exit 1
            fi

            sleep 2
          done

          echo "Backend did not become healthy within 180 seconds"
          cat backend.log
          exit 1
        env:
          WHATOMATE_CONFIG: config.toml

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: cd frontend && npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          BASE_URL: http://localhost:8080
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/whatomate_test
          E2E_SEED_WHATSAPP_ACCOUNTS: "1"
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  e2e:
    name: e2e
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: Verify all E2E shards passed
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$SHARD_RESULT" = "success"
