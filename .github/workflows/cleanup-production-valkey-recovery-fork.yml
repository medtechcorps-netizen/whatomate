name: Cleanup Production Valkey Recovery Fork

run-name: Cleanup exact ${{ inputs.phase }} Valkey recovery fork

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact rollout phase whose provider-native recovery fork is removed
        required: true
        type: choice
        options:
          - baseline
          - bridge
          - backend
          - ui
      cleanup_evidence_json:
        description: Canonical exact terminal, never-started, no-mutation, or quarantined-create cleanup authority
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_REPOSITORY: medtechcorps-netizen/whatomate
  WORKFLOW_PATH: .github/workflows/cleanup-production-valkey-recovery-fork.yml
  PREPARE_WORKFLOW_PATH: .github/workflows/prepare-production-valkey-recovery-fork.yml
  RECOVERY_WORKFLOW_PATH: .github/workflows/verify-production-recovery-readiness.yml
  CANARY_WORKFLOW_PATH: .github/workflows/verify-production-crm-canary.yml
  RECONCILIATION_WORKFLOW_PATH: .github/workflows/reconcile-production-orphan.yml
  APPLY_WORKFLOW_PATH: .github/workflows/apply-production-phase.yml
  ROLLBACK_WORKFLOW_PATH: .github/workflows/rollback-production-phase.yml
  ORPHAN_ROLLBACK_WORKFLOW_PATH: .github/workflows/rollback-production-orphan.yml
  CONTROLLER_PATH: release/deployment/provider_native_valkey_recovery.py
  CONTRACT_PATH: release/deployment/production-app-contract.json
  INTENT_PREDICATE: https://rereply.app/attestations/production-valkey-recovery-fork-create-intent/v2
  RECEIPT_PREDICATE: https://rereply.app/attestations/production-valkey-recovery-fork-create-receipt/v2
  RECOVERY_PREDICATE: https://rereply.app/attestations/production-recovery-readiness/v2
  PHASE_STATE_PREDICATE: https://rereply.app/attestations/production-phase-state/v1
  RECONCILIATION_PREDICATE: https://rereply.app/attestations/production-orphan-reconciliation/v1
  DELETE_PREDICATE: https://rereply.app/attestations/production-valkey-recovery-fork-delete-receipt/v2
  PINNED_JQ_VERSION: "1.8.2"
  PINNED_JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
  PINNED_JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
  PINNED_GH_VERSION: "2.98.0"
  PINNED_GH_URL: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
  PINNED_GH_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de

jobs:
  authority:
    name: Authenticate exact Valkey recovery cleanup authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      authority_artifact_id: ${{ steps.github.outputs.authority_artifact_id }}
      authority_control_sha: ${{ steps.github.outputs.authority_control_sha }}
      authority_kind: ${{ steps.github.outputs.authority_kind }}
      authority_sha256: ${{ steps.github.outputs.authority_sha256 }}
      canary_artifact_id: ${{ steps.github.outputs.canary_artifact_id }}
      canary_run_id: ${{ steps.github.outputs.canary_run_id }}
      canary_sha256: ${{ steps.github.outputs.canary_sha256 }}
      cleanup_evidence_sha256: ${{ steps.github.outputs.cleanup_evidence_sha256 }}
      cleanup_mode: ${{ steps.github.outputs.cleanup_mode }}
      control_sha: ${{ steps.guard.outputs.control_sha }}
      phase: ${{ steps.github.outputs.phase }}
      prepare_run_id: ${{ steps.github.outputs.prepare_run_id }}
      reconciliation_artifact_id: ${{ steps.github.outputs.reconciliation_artifact_id }}
      reconciliation_run_id: ${{ steps.github.outputs.reconciliation_run_id }}
      reconciliation_sha256: ${{ steps.github.outputs.reconciliation_sha256 }}
      recovery_artifact_id: ${{ steps.github.outputs.recovery_artifact_id }}
      recovery_run_id: ${{ steps.github.outputs.recovery_run_id }}
      recovery_sha256: ${{ steps.github.outputs.recovery_sha256 }}
    steps:
      - name: Require exact protected-main attempt-one authority
        id: guard
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch && "$REPOSITORY" == "$RELEASE_REPOSITORY" ]]
          [[ "$DISPATCH_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$RUN_ATTEMPT" == 1 && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$WORKFLOW_REF" == "$RELEASE_REPOSITORY/$WORKFLOW_PATH@refs/heads/main" ]]
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'control_sha=%s\n' "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate exact cleanup evidence
        id: github
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          APPLY_WORKFLOW_PATH: ${{ env.APPLY_WORKFLOW_PATH }}
          CONTROL_SHA: ${{ steps.guard.outputs.control_sha }}
          ORPHAN_ROLLBACK_WORKFLOW_PATH: ${{ env.ORPHAN_ROLLBACK_WORKFLOW_PATH }}
          PHASE: ${{ inputs.phase }}
          RAW: ${{ inputs.cleanup_evidence_json }}
          RECONCILIATION_WORKFLOW_PATH: ${{ env.RECONCILIATION_WORKFLOW_PATH }}
          ROLLBACK_WORKFLOW_PATH: ${{ env.ROLLBACK_WORKFLOW_PATH }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto=require('crypto');
            const value=JSON.parse(process.env.RAW);
            const canonical=(item)=>Array.isArray(item)?item.map(canonical):(item!==null&&typeof item==='object'?Object.fromEntries(Object.keys(item).sort().map(key=>[key,canonical(item[key])])):item);
            const canonicalRaw=JSON.stringify(canonical(value));
            if(process.env.RAW!==canonicalRaw) throw new Error('cleanup descriptor is not canonical compact JSON');
            const exact=['authority','authority_control_sha','canary','confirmation','control_sha','mode','phase','reconciliation','recovery'];
            if(JSON.stringify(Object.keys(value).sort())!==JSON.stringify(exact)) throw new Error('cleanup descriptor keys differ');
            if(value.control_sha!==process.env.CONTROL_SHA || !/^[0-9a-f]{40}$/.test(value.authority_control_sha) || value.phase!==process.env.PHASE || !['baseline','bridge','backend','ui'].includes(value.phase) || !['terminal','never-started','no-mutation','quarantine'].includes(value.mode) || typeof value.confirmation!=='string') throw new Error('cleanup descriptor authority differs');
            const descriptor=(item,label)=>{
              if(!item || JSON.stringify(Object.keys(item).sort())!==JSON.stringify(['artifact_digest','artifact_id','run_attempt','run_id','sha256'])) throw new Error(`${label} keys differ`);
              if(typeof item.run_id!=='string' || typeof item.artifact_id!=='string' || item.run_attempt!==1 || !/^[1-9][0-9]{0,14}$/.test(item.run_id) || !/^[1-9][0-9]{0,14}$/.test(item.artifact_id) || !/^sha256:[0-9a-f]{64}$/.test(item.artifact_digest) || !/^[0-9a-f]{64}$/.test(item.sha256)) throw new Error(`${label} format differs`);
              return item;
            };
            if(!['create-receipt','create-intent'].includes(value.authority.kind) || JSON.stringify(Object.keys(value.authority).sort())!==JSON.stringify(['artifact_digest','artifact_id','kind','run_attempt','run_id','sha256'])) throw new Error('create authority differs');
            const create=descriptor(Object.fromEntries(Object.entries(value.authority).filter(([key])=>key!=='kind')),'create authority');
            const receiptMode=value.authority.kind==='create-receipt';
            const terminal=value.mode==='terminal';
            const neverStarted=value.mode==='never-started';
            const noMutation=value.mode==='no-mutation';
            const quarantine=value.mode==='quarantine';
            if((terminal||neverStarted||noMutation)!==receiptMode || quarantine===receiptMode) throw new Error('cleanup mode/create authority differs');
            if(terminal && !(value.recovery&&value.canary&&value.reconciliation===null&&value.confirmation==='')) throw new Error('terminal cleanup authority differs');
            if(neverStarted && !((value.recovery===null||typeof value.recovery==='object')&&value.canary===null&&value.reconciliation===null&&value.confirmation===`DELETE UNUSED RECOVERY FORK ${create.run_id}`)) throw new Error('never-started cleanup authority differs');
            if(noMutation && !(value.recovery&&value.canary===null&&value.reconciliation&&value.confirmation===`DELETE RECOVERY FORK AFTER NO MUTATION ${value.reconciliation.run_id}`)) throw new Error('no-mutation cleanup authority differs');
            if(quarantine && !(value.recovery===null&&value.canary===null&&value.reconciliation===null&&value.confirmation===`DELETE QUARANTINED RECOVERY FORK ${create.run_id}`)) throw new Error('quarantine cleanup authority differs');
            const recovery=(terminal||noMutation||(neverStarted&&value.recovery!==null))?descriptor(value.recovery,'recovery authority'):null;
            const canary=terminal?descriptor(value.canary,'canary authority'):null;
            const reconciliation=noMutation?descriptor(value.reconciliation,'reconciliation authority'):null;
            const {owner,repo}=context.repo;
            const main=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if(main.data.object.sha!==process.env.CONTROL_SHA) throw new Error('main changed');
            const ancestry=await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:`${value.authority_control_sha}...${process.env.CONTROL_SHA}`});
            if(!['ahead','identical'].includes(ancestry.data.status) || ancestry.data.base_commit.sha!==value.authority_control_sha || ancestry.data.merge_base_commit.sha!==value.authority_control_sha || ancestry.data.behind_by!==0) throw new Error('cleanup authority control is not an ancestor of current protected main');
            const runExact=async(item,path,label,expectedSha)=>{
              const latest=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(item.run_id)});
              const attempt=await github.rest.actions.getWorkflowRunAttempt({owner,repo,run_id:Number(item.run_id),attempt_number:1});
              for(const run of [latest.data,attempt.data]) if(run.run_attempt!==1 || run.head_sha!==expectedSha || run.head_branch!=='main' || run.event!=='workflow_dispatch' || run.status!=='completed' || run.path!==path) throw new Error(`${label} run differs`);
              return latest.data;
            };
            const createRun=await runExact(create,process.env.PREPARE_WORKFLOW_PATH,'create',value.authority_control_sha);
            if(receiptMode ? createRun.conclusion!=='success' : createRun.conclusion==='success') throw new Error('create run conclusion differs');
            const createArtifact=await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(create.artifact_id)});
            const createName=receiptMode?`production-valkey-recovery-fork-create-${create.run_id}-1`:`production-valkey-recovery-fork-create-intent-${create.run_id}-1`;
            if(createArtifact.data.name!==createName || createArtifact.data.digest!==create.artifact_digest || createArtifact.data.expired || createArtifact.data.size_in_bytes<=0 || createArtifact.data.size_in_bytes>1048576 || createArtifact.data.workflow_run.id!==Number(create.run_id) || createArtifact.data.workflow_run.head_sha!==value.authority_control_sha || createArtifact.data.workflow_run.head_branch!=='main') throw new Error('create artifact differs');
            if(receiptMode){
              const jobs=await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/1/jobs',{owner,repo,run_id:Number(create.run_id),per_page:100});
              const expected=['Authenticate exact production Valkey recovery fork authority','Prepare and attest exact production Valkey recovery fork intent','Create exact production Valkey recovery fork','Exact production Valkey recovery fork gate'];
              if(JSON.stringify(jobs.map(job=>job.name).sort())!==JSON.stringify(expected.sort()) || jobs.some(job=>job.status!=='completed' || job.conclusion!=='success')) throw new Error('create job inventory differs');
              if(terminal||noMutation||(neverStarted&&recovery!==null)){
                const recoveryRun=await runExact(recovery,process.env.RECOVERY_WORKFLOW_PATH,'recovery',value.authority_control_sha);
                if(recoveryRun.conclusion!=='success') throw new Error('recovery run conclusion differs');
                const recoveryArtifact=await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(recovery.artifact_id)});
                if(recoveryArtifact.data.name!==`production-recovery-readiness-${recovery.run_id}-1` || recoveryArtifact.data.digest!==recovery.artifact_digest || recoveryArtifact.data.expired || recoveryArtifact.data.size_in_bytes<=0 || recoveryArtifact.data.size_in_bytes>1048576 || recoveryArtifact.data.workflow_run.id!==Number(recovery.run_id) || recoveryArtifact.data.workflow_run.head_sha!==value.authority_control_sha || recoveryArtifact.data.workflow_run.head_branch!=='main') throw new Error('recovery artifact differs');
              }
              if(terminal){
                const canaryRun=await runExact(canary,process.env.CANARY_WORKFLOW_PATH,'canary',value.authority_control_sha);
                if(canaryRun.conclusion!=='success') throw new Error('terminal run conclusion differs');
                const canaryArtifact=await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(canary.artifact_id)});
                if(canaryArtifact.data.name!==`production-phase-state-${canary.run_id}-1` || canaryArtifact.data.digest!==canary.artifact_digest || canaryArtifact.data.expired || canaryArtifact.data.size_in_bytes<=0 || canaryArtifact.data.size_in_bytes>1048576 || canaryArtifact.data.workflow_run.id!==Number(canary.run_id) || canaryArtifact.data.workflow_run.head_sha!==value.authority_control_sha || canaryArtifact.data.workflow_run.head_branch!=='main') throw new Error('canary artifact differs');
              }
              if(noMutation){
                const reconciliationRun=await runExact(reconciliation,process.env.RECONCILIATION_WORKFLOW_PATH,'reconciliation',value.authority_control_sha);
                if(reconciliationRun.conclusion!=='success') throw new Error('reconciliation run conclusion differs');
                const reconciliationArtifact=await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(reconciliation.artifact_id)});
                if(reconciliationArtifact.data.name!==`production-orphan-reconciliation-${reconciliation.run_id}-1` || reconciliationArtifact.data.digest!==reconciliation.artifact_digest || reconciliationArtifact.data.expired || reconciliationArtifact.data.size_in_bytes<=0 || reconciliationArtifact.data.size_in_bytes>1048576 || reconciliationArtifact.data.workflow_run.id!==Number(reconciliation.run_id) || reconciliationArtifact.data.workflow_run.head_sha!==value.authority_control_sha || reconciliationArtifact.data.workflow_run.head_branch!=='main') throw new Error('reconciliation artifact differs');
              }
              if(neverStarted){
                const mutationPaths=[process.env.APPLY_WORKFLOW_PATH,process.env.ROLLBACK_WORKFLOW_PATH,process.env.ORPHAN_ROLLBACK_WORKFLOW_PATH,process.env.RECONCILIATION_WORKFLOW_PATH];
                for(const path of mutationPaths){
                  const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{owner,repo,workflow_id:path,branch:'main',event:'workflow_dispatch',created:`>=${createRun.created_at}`,per_page:100});
                  if(runs.some(run=>Date.parse(run.created_at)>=Date.parse(createRun.created_at))) throw new Error(`never-started cleanup found a later ${path} run`);
                }
                const recoveryRuns=await github.paginate(github.rest.actions.listWorkflowRuns,{owner,repo,workflow_id:process.env.RECOVERY_WORKFLOW_PATH,branch:'main',event:'workflow_dispatch',created:`>=${createRun.created_at}`,per_page:100});
                const laterRecovery=recoveryRuns.filter(run=>Date.parse(run.created_at)>=Date.parse(createRun.created_at));
                if(laterRecovery.some(run=>run.status!=='completed')) throw new Error('never-started cleanup found nonterminal recovery evidence');
                const matchingRecovery=laterRecovery.filter(run=>run.head_sha===value.authority_control_sha);
                const successfulRecovery=matchingRecovery.filter(run=>run.conclusion==='success');
                if(recovery===null ? successfulRecovery.length!==0 : (successfulRecovery.length!==1 || String(successfulRecovery[0].id)!==String(recovery.run_id))) throw new Error('never-started cleanup recovery authority differs');
              }
            }
            core.setOutput('authority_artifact_id',String(create.artifact_id));
            core.setOutput('authority_control_sha',value.authority_control_sha);
            core.setOutput('authority_kind',value.authority.kind);
            core.setOutput('authority_sha256',create.sha256);
            core.setOutput('canary_artifact_id',terminal?String(canary.artifact_id):'');
            core.setOutput('canary_run_id',terminal?String(canary.run_id):'');
            core.setOutput('canary_sha256',terminal?canary.sha256:'');
            core.setOutput('cleanup_evidence_sha256',crypto.createHash('sha256').update(Buffer.from(canonicalRaw+'\n','utf8')).digest('hex'));
            core.setOutput('cleanup_mode',value.mode);
            core.setOutput('phase',value.phase);
            core.setOutput('prepare_run_id',String(create.run_id));
            core.setOutput('reconciliation_artifact_id',noMutation?String(reconciliation.artifact_id):'');
            core.setOutput('reconciliation_run_id',noMutation?String(reconciliation.run_id):'');
            core.setOutput('reconciliation_sha256',noMutation?reconciliation.sha256:'');
            core.setOutput('recovery_artifact_id',recovery?String(recovery.artifact_id):'');
            core.setOutput('recovery_run_id',recovery?String(recovery.run_id):'');
            core.setOutput('recovery_sha256',recovery?recovery.sha256:'');

  cleanup:
    name: Delete or reconcile exact production Valkey recovery fork
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: rereply-production-recovery-cleanup
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      internal_name: ${{ steps.names.outputs.internal_name }}
      receipt_sha256: ${{ steps.names.outputs.receipt_sha256 }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Check out exact cleanup authority controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.authority_control_sha }}
          fetch-depth: 1
          path: authority-control
          persist-credentials: false

      - name: Download exact fork create authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.authority.outputs.authority_artifact_id }}
          path: ${{ runner.temp }}/create-authority
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.prepare_run_id }}

      - name: Download exact terminal recovery evidence
        if: needs.authority.outputs.recovery_artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.authority.outputs.recovery_artifact_id }}
          path: ${{ runner.temp }}/recovery
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.recovery_run_id }}

      - name: Download exact terminal phase state
        if: needs.authority.outputs.cleanup_mode == 'terminal'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.authority.outputs.canary_artifact_id }}
          path: ${{ runner.temp }}/phase-state
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.canary_run_id }}

      - name: Download exact no-mutation reconciliation
        if: needs.authority.outputs.cleanup_mode == 'no-mutation'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.authority.outputs.reconciliation_artifact_id }}
          path: ${{ runner.temp }}/reconciliation
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.reconciliation_run_id }}

      - name: Install pinned cleanup-authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/recovery-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/recovery-gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/recovery-gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/recovery-gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"

      - name: Verify signed cleanup authorities before delete capability
        env:
          AUTHORITY_KIND: ${{ needs.authority.outputs.authority_kind }}
          AUTHORITY_CONTROL_SHA: ${{ needs.authority.outputs.authority_control_sha }}
          AUTHORITY_SHA256: ${{ needs.authority.outputs.authority_sha256 }}
          CANARY_SHA256: ${{ needs.authority.outputs.canary_sha256 }}
          CLEANUP_EVIDENCE_JSON: ${{ inputs.cleanup_evidence_json }}
          CLEANUP_MODE: ${{ needs.authority.outputs.cleanup_mode }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ needs.authority.outputs.phase }}
          RECONCILIATION_SHA256: ${{ needs.authority.outputs.reconciliation_sha256 }}
          RECOVERY_SHA256: ${{ needs.authority.outputs.recovery_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$AUTHORITY_KIND" == create-receipt ]]; then
            create="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-receipt.json"
            create_sidecar="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-receipt.sha256"
            create_predicate="$RECEIPT_PREDICATE"
          else
            create="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-intent.json"
            create_sidecar="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-intent.sha256"
            create_predicate="$INTENT_PREDICATE"
          fi
          [[ "$(cat "$create_sidecar")" == "$AUTHORITY_SHA256" && "$(sha256sum "$create" | awk '{print $1}')" == "$AUTHORITY_SHA256" ]]
          signer="$RELEASE_REPOSITORY/$PREPARE_WORKFLOW_PATH"
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$signer" --signer-digest "$AUTHORITY_CONTROL_SHA" --source-digest "$AUTHORITY_CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$create" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/create-provenance.json"
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$create" "${flags[@]}" --predicate-type "$create_predicate" > "$RUNNER_TEMP/create-policy.json"
          "$RUNNER_TEMP/recovery-tools/jq" -e --slurpfile expected "$create" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/create-policy.json" > /dev/null
          if [[ -n "$RECOVERY_SHA256" ]]; then
            recovery="$RUNNER_TEMP/recovery/production-recovery-readiness.json"
            [[ "$(cat "$RUNNER_TEMP/recovery/production-recovery-readiness.sha256")" == "$RECOVERY_SHA256" && "$(sha256sum "$recovery" | awk '{print $1}')" == "$RECOVERY_SHA256" ]]
            recovery_flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$RECOVERY_WORKFLOW_PATH" --signer-digest "$AUTHORITY_CONTROL_SHA" --source-digest "$AUTHORITY_CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
            "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$recovery" "${recovery_flags[@]}" --predicate-type "$RECOVERY_PREDICATE" > "$RUNNER_TEMP/recovery-policy.json"
            "$RUNNER_TEMP/recovery-tools/jq" -e --slurpfile expected "$recovery" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/recovery-policy.json" > /dev/null
            /usr/bin/python3 -I -S -B -c 'import datetime,os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import apply_production_change as a, verify_production_release as v; recovery=v.load_json(pathlib.Path(os.environ["RUNNER_TEMP"]+"/recovery/production-recovery-readiness.json"),"recovery",canonical=True); issued=v.require_timestamp(recovery["issued_at"],"recovery issued_at"); expires=v.require_timestamp(recovery["expires_at"],"recovery expires_at"); a.validate_recovery(recovery,os.environ["RECOVERY_SHA256"],issued); now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0); assert now>=expires; assert recovery["authorities"]["valkey_fork"]["sha256"]==os.environ["AUTHORITY_SHA256"] and recovery["authorities"]["valkey_fork"]["receipt_sha256"]==os.environ["AUTHORITY_SHA256"]'
          fi
          if [[ "$CLEANUP_MODE" == terminal ]]; then
            state="$RUNNER_TEMP/phase-state/production-phase-state.json"
            [[ "$(cat "$RUNNER_TEMP/phase-state/production-phase-state.sha256")" == "$CANARY_SHA256" && "$(sha256sum "$state" | awk '{print $1}')" == "$CANARY_SHA256" ]]
            canary_flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$CANARY_WORKFLOW_PATH" --signer-digest "$AUTHORITY_CONTROL_SHA" --source-digest "$AUTHORITY_CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
            "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$state" "${canary_flags[@]}" --predicate-type "$PHASE_STATE_PREDICATE" > "$RUNNER_TEMP/canary-policy.json"
            "$RUNNER_TEMP/recovery-tools/jq" -e --slurpfile expected "$state" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/canary-policy.json" > /dev/null
            /usr/bin/python3 -I -S -B -c 'import os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import verify_production_release as v; state=v.load_json(pathlib.Path(os.environ["RUNNER_TEMP"]+"/phase-state/production-phase-state.json"),"phase state",canonical=True); v.validate_phase_state(state); assert state["lineage"]["phase"]==os.environ["PHASE"] and state["evidence"]["recovery_sha256"]==os.environ["RECOVERY_SHA256"]'
          fi
          if [[ "$CLEANUP_MODE" == no-mutation ]]; then
            reconciliation="$RUNNER_TEMP/reconciliation/production-orphan-reconciliation.json"
            [[ "$(cat "$RUNNER_TEMP/reconciliation/production-orphan-reconciliation.sha256")" == "$RECONCILIATION_SHA256" && "$(sha256sum "$reconciliation" | awk '{print $1}')" == "$RECONCILIATION_SHA256" ]]
            reconciliation_flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$RECONCILIATION_WORKFLOW_PATH" --signer-digest "$AUTHORITY_CONTROL_SHA" --source-digest "$AUTHORITY_CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
            "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$reconciliation" "${reconciliation_flags[@]}" --predicate-type "$RECONCILIATION_PREDICATE" > "$RUNNER_TEMP/reconciliation-policy.json"
            "$RUNNER_TEMP/recovery-tools/jq" -e --slurpfile expected "$reconciliation" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/reconciliation-policy.json" > /dev/null
            /usr/bin/python3 -I -S -B -c 'import os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import verify_production_release as v; receipt=v.load_json(pathlib.Path(os.environ["RUNNER_TEMP"]+"/reconciliation/production-orphan-reconciliation.json"),"reconciliation",canonical=True); receipt=v.validate_reconciliation_receipt(receipt); recovery=receipt["authorities"]["upstream"]["recovery"]; descriptor=v.loads_strict(os.environ["CLEANUP_EVIDENCE_JSON"])["recovery"]; expected={"run_id":descriptor["run_id"],"run_attempt":descriptor["run_attempt"],"artifact_id":descriptor["artifact_id"],"artifact_name":"production-recovery-readiness-{}-1".format(descriptor["run_id"]),"artifact_digest":descriptor["artifact_digest"],"sha256":descriptor["sha256"]}; assert receipt["control"]["workflow_sha"]==os.environ["AUTHORITY_CONTROL_SHA"] and receipt["lineage"]["phase"]==os.environ["PHASE"] and receipt["classification"]["outcome"]=="no-mutation" and receipt["classification"]["original_receipt_present"] is False and recovery==expected'
          fi

      - name: Recheck exact protected main before cleanup mutation
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const main=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            const current=await github.rest.actions.getWorkflowRun({owner,repo,run_id:context.runId});
            if(main.data.object.sha!==process.env.CONTROL_SHA || current.data.run_attempt!==1 || current.data.head_sha!==process.env.CONTROL_SHA || current.data.event!=='workflow_dispatch') throw new Error('cleanup authority changed');

      - name: Delete or reconcile one exact provider-native recovery fork
        id: names
        env:
          AUTHORITY_KIND: ${{ needs.authority.outputs.authority_kind }}
          AUTHORITY_CONTROL_SHA: ${{ needs.authority.outputs.authority_control_sha }}
          AUTHORITY_SHA256: ${{ needs.authority.outputs.authority_sha256 }}
          CLEANUP_EVIDENCE_JSON: ${{ inputs.cleanup_evidence_json }}
          CLEANUP_EVIDENCE_SHA256: ${{ needs.authority.outputs.cleanup_evidence_sha256 }}
          CLEANUP_MODE: ${{ needs.authority.outputs.cleanup_mode }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          DO_PRODUCTION_DATABASE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_DATABASE_READ_TOKEN }}
          DO_PRODUCTION_DATABASE_DELETE_TOKEN: ${{ secrets.DO_PRODUCTION_DATABASE_DELETE_TOKEN }}
          PHASE: ${{ needs.authority.outputs.phase }}
          TARGET_JSON: ${{ secrets.DO_PRODUCTION_DATABASE_TARGET_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$DO_PRODUCTION_DATABASE_READ_TOKEN" && -n "$DO_PRODUCTION_DATABASE_DELETE_TOKEN" && -n "$TARGET_JSON" ]]
          if [[ "$AUTHORITY_KIND" == create-receipt ]]; then
            create="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-receipt.json"
            authority_args=(--receipt "$create" --receipt-sha256 "$AUTHORITY_SHA256")
          else
            create="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-intent.json"
            authority_args=(--intent "$create" --intent-sha256 "$AUTHORITY_SHA256")
          fi
          mkdir -m 0700 "$RUNNER_TEMP/cleanup-receipt"
          authority_contract_sha="$(sha256sum "authority-control/$CONTRACT_PATH" | awk '{print $1}')"
          controller_sha="$(sha256sum "control/$CONTROLLER_PATH" | awk '{print $1}')"
          authority_controller_sha="$(sha256sum "authority-control/$CONTROLLER_PATH" | awk '{print $1}')"
          rollout_sha="$(/usr/bin/python3 -I -S -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["control"]["rollout_plan_sha256"])' "$create")"
          export AUTHORITY_CONTROL_SHA CONTROL_SHA PHASE authority_contract_sha authority_controller_sha controller_sha rollout_sha
          /usr/bin/python3 -I -S -B -c 'import json,os,pathlib; value={"workflow_sha":os.environ["CONTROL_SHA"],"authority_workflow_sha":os.environ["AUTHORITY_CONTROL_SHA"],"workflow_path":".github/workflows/cleanup-production-valkey-recovery-fork.yml","run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"runner_environment":"github-hosted","rollout_plan_sha256":os.environ["rollout_sha"],"contract_sha256":os.environ["authority_contract_sha"],"controller_sha256":os.environ["controller_sha"],"authority_controller_sha256":os.environ["authority_controller_sha"]}; pathlib.Path(os.environ["RUNNER_TEMP"]+"/cleanup-control.json").write_text(json.dumps(value,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")'
          printf '%s\n' "$CLEANUP_EVIDENCE_JSON" > "$RUNNER_TEMP/cleanup-evidence.json"
          [[ "$(sha256sum "$RUNNER_TEMP/cleanup-evidence.json" | awk '{print $1}')" == "$CLEANUP_EVIDENCE_SHA256" ]]
          TARGET_JSON="$TARGET_JSON" /usr/bin/python3 -I -S -B -c 'import os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import verify_production_release as v; value=v.loads_strict(os.environ.pop("TARGET_JSON")); pathlib.Path(os.environ["RUNNER_TEMP"]+"/cleanup-target.json").write_bytes(v.canonical_file_bytes(value))'
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$RUNNER_TEMP" DO_PRODUCTION_DATABASE_READ_TOKEN="$DO_PRODUCTION_DATABASE_READ_TOKEN" DO_PRODUCTION_DATABASE_DELETE_TOKEN="$DO_PRODUCTION_DATABASE_DELETE_TOKEN" /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" delete-or-reconcile --target "$RUNNER_TEMP/cleanup-target.json" --control "$RUNNER_TEMP/cleanup-control.json" --phase "$PHASE" --contract "authority-control/$CONTRACT_PATH" --cleanup-mode "$CLEANUP_MODE" --cleanup-evidence "$RUNNER_TEMP/cleanup-evidence.json" "${authority_args[@]}" --output "$RUNNER_TEMP/production-valkey-recovery-fork-delete-receipt.json" --runner-temp "$RUNNER_TEMP"
          unset DO_PRODUCTION_DATABASE_READ_TOKEN DO_PRODUCTION_DATABASE_DELETE_TOKEN TARGET_JSON CLEANUP_EVIDENCE_JSON
          mv "$RUNNER_TEMP/production-valkey-recovery-fork-delete-receipt.json" "$RUNNER_TEMP/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json"
          receipt_sha="$(sha256sum "$RUNNER_TEMP/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json" | awk '{print $1}')"
          printf '%s\n' "$receipt_sha" > "$RUNNER_TEMP/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.sha256"
          printf 'receipt_sha256=%s\n' "$receipt_sha" >> "$GITHUB_OUTPUT"
          printf 'internal_name=unsigned-production-valkey-recovery-fork-delete-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned cleanup receipt
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.names.outputs.internal_name }}
          path: ${{ runner.temp }}/cleanup-receipt
          if-no-files-found: error
          retention-days: 2

      - name: Canonicalize unsigned cleanup artifact digest
        id: digest
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact_digest=sha256:%s\n' "$RAW_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  gate:
    name: Exact production Valkey recovery cleanup gate
    needs: [authority, cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-recovery-cleanup
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Check out exact cleanup authority controls for final binding
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.authority_control_sha }}
          fetch-depth: 1
          path: authority-control
          persist-credentials: false

      - name: Download exact unsigned cleanup receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.cleanup.outputs.artifact_id }}
          path: ${{ runner.temp }}/cleanup-receipt
          merge-multiple: true

      - name: Download exact cleanup create authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.authority.outputs.authority_artifact_id }}
          path: ${{ runner.temp }}/create-authority
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.prepare_run_id }}

      - name: Validate exact sanitized cleanup receipt
        env:
          AUTHORITY_KIND: ${{ needs.authority.outputs.authority_kind }}
          AUTHORITY_CONTROL_SHA: ${{ needs.authority.outputs.authority_control_sha }}
          AUTHORITY_SHA256: ${{ needs.authority.outputs.authority_sha256 }}
          CLEANUP_EVIDENCE_JSON: ${{ inputs.cleanup_evidence_json }}
          CLEANUP_EVIDENCE_SHA256: ${{ needs.authority.outputs.cleanup_evidence_sha256 }}
          CLEANUP_MODE: ${{ needs.authority.outputs.cleanup_mode }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          DO_PRODUCTION_DATABASE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_DATABASE_READ_TOKEN }}
          PHASE: ${{ needs.authority.outputs.phase }}
          RECEIPT_SHA256: ${{ needs.cleanup.outputs.receipt_sha256 }}
          TARGET_JSON: ${{ secrets.DO_PRODUCTION_DATABASE_TARGET_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$DO_PRODUCTION_DATABASE_READ_TOKEN" && -n "$TARGET_JSON" ]]
          subject="$RUNNER_TEMP/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json"
          [[ "$(find "$RUNNER_TEMP/cleanup-receipt" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-valkey-recovery-fork-delete-receipt.json production-valkey-recovery-fork-delete-receipt.sha256 " ]]
          [[ "$(cat "$RUNNER_TEMP/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.sha256")" == "$RECEIPT_SHA256" && "$(sha256sum "$subject" | awk '{print $1}')" == "$RECEIPT_SHA256" ]]
          if [[ "$AUTHORITY_KIND" == create-receipt ]]; then
            create="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-receipt.json"
            authority_args=(--create-receipt "$create" --create-receipt-sha256 "$AUTHORITY_SHA256")
          else
            create="$RUNNER_TEMP/create-authority/production-valkey-recovery-fork-create-intent.json"
            authority_args=(--create-intent "$create" --create-intent-sha256 "$AUTHORITY_SHA256")
          fi
          authority_contract_sha="$(sha256sum "authority-control/$CONTRACT_PATH" | awk '{print $1}')"
          controller_sha="$(sha256sum "control/$CONTROLLER_PATH" | awk '{print $1}')"
          authority_controller_sha="$(sha256sum "authority-control/$CONTROLLER_PATH" | awk '{print $1}')"
          rollout_sha="$(/usr/bin/python3 -I -S -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["control"]["rollout_plan_sha256"])' "$create")"
          export AUTHORITY_CONTROL_SHA CONTROL_SHA PHASE authority_contract_sha authority_controller_sha controller_sha rollout_sha
          /usr/bin/python3 -I -S -B -c 'import json,os,pathlib; value={"workflow_sha":os.environ["CONTROL_SHA"],"authority_workflow_sha":os.environ["AUTHORITY_CONTROL_SHA"],"workflow_path":".github/workflows/cleanup-production-valkey-recovery-fork.yml","run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"runner_environment":"github-hosted","rollout_plan_sha256":os.environ["rollout_sha"],"contract_sha256":os.environ["authority_contract_sha"],"controller_sha256":os.environ["controller_sha"],"authority_controller_sha256":os.environ["authority_controller_sha"]}; pathlib.Path(os.environ["RUNNER_TEMP"]+"/cleanup-gate-control.json").write_text(json.dumps(value,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")'
          printf '%s\n' "$CLEANUP_EVIDENCE_JSON" > "$RUNNER_TEMP/cleanup-gate-evidence.json"
          [[ "$(sha256sum "$RUNNER_TEMP/cleanup-gate-evidence.json" | awk '{print $1}')" == "$CLEANUP_EVIDENCE_SHA256" ]]
          TARGET_JSON="$TARGET_JSON" /usr/bin/python3 -I -S -B -c 'import os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import verify_production_release as v; value=v.loads_strict(os.environ.pop("TARGET_JSON")); pathlib.Path(os.environ["RUNNER_TEMP"]+"/cleanup-gate-target.json").write_bytes(v.canonical_file_bytes(value))'
          mkdir -m 0700 "$RUNNER_TEMP/validated-cleanup-receipt"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$RUNNER_TEMP" DO_PRODUCTION_DATABASE_READ_TOKEN="$DO_PRODUCTION_DATABASE_READ_TOKEN" /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" validate-delete-receipt --target "$RUNNER_TEMP/cleanup-gate-target.json" --control "$RUNNER_TEMP/cleanup-gate-control.json" --phase "$PHASE" --contract "authority-control/$CONTRACT_PATH" --delete-receipt "$subject" --delete-receipt-sha256 "$RECEIPT_SHA256" --cleanup-mode "$CLEANUP_MODE" --cleanup-evidence "$RUNNER_TEMP/cleanup-gate-evidence.json" "${authority_args[@]}" --output "$RUNNER_TEMP/production-valkey-recovery-fork-delete-receipt.json" --runner-temp "$RUNNER_TEMP"
          unset DO_PRODUCTION_DATABASE_READ_TOKEN TARGET_JSON CLEANUP_EVIDENCE_JSON
          mv "$RUNNER_TEMP/production-valkey-recovery-fork-delete-receipt.json" "$RUNNER_TEMP/validated-cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json"
          cmp --silent "$subject" "$RUNNER_TEMP/validated-cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json"
          [[ "$(sha256sum "$RUNNER_TEMP/validated-cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json" | awk '{print $1}')" == "$RECEIPT_SHA256" ]]

      - name: Require exact cleanup job and artifact inventory
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          ARTIFACT_DIGEST: ${{ needs.cleanup.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.cleanup.outputs.artifact_id }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const main=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if(main.data.object.sha!==process.env.CONTROL_SHA) throw new Error('main changed before cleanup attestation');
            const jobs=await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/1/jobs',{owner,repo,run_id:context.runId,per_page:100});
            const expected=['Authenticate exact Valkey recovery cleanup authority','Delete or reconcile exact production Valkey recovery fork','Exact production Valkey recovery cleanup gate'];
            if(JSON.stringify(jobs.map(job=>job.name).sort())!==JSON.stringify(expected.sort())) throw new Error('cleanup job inventory differs');
            for(const job of jobs){if(job.name==='Exact production Valkey recovery cleanup gate'){if(job.status!=='in_progress') throw new Error('cleanup gate state differs');}else if(job.status!=='completed'||job.conclusion!=='success') throw new Error('cleanup prerequisite job differs');}
            const artifacts=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:context.runId,per_page:100});
            if(artifacts.data.total_count!==1 || artifacts.data.artifacts.length!==1) throw new Error('cleanup artifact inventory differs');
            const artifact=artifacts.data.artifacts[0];
            if(String(artifact.id)!==process.env.ARTIFACT_ID || artifact.name!==`unsigned-production-valkey-recovery-fork-delete-${context.runId}-1` || artifact.digest!==process.env.ARTIFACT_DIGEST || artifact.expired || artifact.size_in_bytes<=0 || artifact.size_in_bytes>1048576 || artifact.workflow_run.id!==context.runId || artifact.workflow_run.head_sha!==process.env.CONTROL_SHA || artifact.workflow_run.head_branch!=='main') throw new Error('cleanup artifact binding differs');

      - name: Attest cleanup receipt provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json

      - name: Attest exact cleanup receipt policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json
          predicate-type: ${{ env.DELETE_PREDICATE }}
          predicate-path: ${{ runner.temp }}/cleanup-receipt/production-valkey-recovery-fork-delete-receipt.json

      - name: Upload exact signed cleanup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-valkey-recovery-fork-delete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cleanup-receipt
          if-no-files-found: error
          retention-days: 30
