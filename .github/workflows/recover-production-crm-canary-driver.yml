name: Recover Existing Production CRM Canary Driver
run-name: ${{ inputs.mode == 'recover' && 'Recover' || 'Check' }} existing CRM driver ${{ fromJSON(inputs.recovery_authorization_json).operation_id }} ${{ fromJSON(inputs.recovery_authorization_json).binding_sha256 }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inspection, or separately authorized one-shot recovery of the existing driver
        required: true
        type: choice
        default: check
        options:
          - check
          - recover
      origin_authorization_json:
        description: Exact original public packet, historical evidence only; never reusable CREATE authority
        required: true
        type: string
      recovery_authorization_json:
        description: Fresh canonical public recovery authority with exact current evidence and effect limits
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: rereply-production
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CONTROL_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  REF_PROTECTED: ${{ github.ref_protected }}
  RECOVERY_MODE: ${{ inputs.mode }}
  ORIGIN_AUTHORIZATION_JSON: ${{ inputs.origin_authorization_json }}
  RECOVERY_AUTHORIZATION_JSON: ${{ inputs.recovery_authorization_json }}

jobs:
  authority:
    name: Verify exact existing-driver recovery authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Validate public authority without private credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/run_existing_crm_canary_driver_recovery.py validate --control-root control

  check:
    name: Check existing CRM driver without writes
    needs: authority
    if: ${{ inputs.mode == 'check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: rereply-production-crm-fixture
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Rehydrate and inspect only inside the protected boundary
        env:
          GH_TOKEN: ${{ secrets.GH_DRIVER_BOOTSTRAP_READ_TOKEN }}
          CRM_CANARY_FIXTURE_INPUT_JSON: ${{ secrets.CRM_CANARY_FIXTURE_INPUT_JSON }}
          CRM_CANARY_DRIVER_BOOTSTRAP_JSON: ${{ secrets.CRM_CANARY_DRIVER_BOOTSTRAP_JSON }}
          DO_DRIVER_BOOTSTRAP_READ_TOKEN: ${{ secrets.DO_DRIVER_BOOTSTRAP_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/run_existing_crm_canary_driver_recovery.py check --control-root control

  recover:
    name: Recover exact existing CRM driver once
    needs: authority
    if: ${{ inputs.mode == 'recover' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: rereply-production-crm-fixture
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Consume one existing-app update and gated descriptor finalization
        env:
          GH_TOKEN: ${{ secrets.GH_DRIVER_BOOTSTRAP_READ_TOKEN }}
          CRM_CANARY_FIXTURE_INPUT_JSON: ${{ secrets.CRM_CANARY_FIXTURE_INPUT_JSON }}
          CRM_CANARY_DRIVER_BOOTSTRAP_JSON: ${{ secrets.CRM_CANARY_DRIVER_BOOTSTRAP_JSON }}
          DO_DRIVER_BOOTSTRAP_READ_TOKEN: ${{ secrets.DO_DRIVER_BOOTSTRAP_READ_TOKEN }}
          DO_DRIVER_RECOVERY_UPDATE_TOKEN: ${{ secrets.DO_DRIVER_RECOVERY_UPDATE_TOKEN }}
          GH_CANARY_ENVIRONMENT_WRITE_TOKEN: ${{ secrets.GH_CANARY_ENVIRONMENT_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/run_existing_crm_canary_driver_recovery.py recover --control-root control --output-dir "$RUNNER_TEMP/driver-recovery-receipt"
      - name: Attest content-free existing-driver recovery provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/driver-recovery-receipt/receipt.json
      - name: Attest exact existing-driver recovery policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/driver-recovery-receipt/receipt.json
          predicate-type: https://rereply.app/attestations/crm-canary-driver-existing-recovery/v1
          predicate-path: ${{ runner.temp }}/driver-recovery-receipt/receipt.json
      - name: Upload only the public existing-driver recovery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-canary-driver-existing-recovery-${{ github.run_id }}-1
          path: ${{ runner.temp }}/driver-recovery-receipt
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          compression-level: 0
          retention-days: 90

  gate:
    name: Exact existing CRM driver recovery gate
    needs: [authority, check, recover]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require exactly the selected recovery mode
        env:
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          RECOVER_RESULT: ${{ needs.recover.result }}
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_RESULT" == success ]]
          if [[ "$RECOVERY_MODE" == check ]]; then
            [[ "$CHECK_RESULT" == success && "$RECOVER_RESULT" == skipped ]]
          elif [[ "$RECOVERY_MODE" == recover ]]; then
            [[ "$CHECK_RESULT" == skipped && "$RECOVER_RESULT" == success ]]
          else
            exit 1
          fi
