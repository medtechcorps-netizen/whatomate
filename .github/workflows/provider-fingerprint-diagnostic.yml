name: Provider Fingerprint Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    environment: rereply-production-crm-fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Print sanitized provider fingerprint
        env:
          DO_PRODUCTION_FIXTURE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_FIXTURE_READ_TOKEN }}
          PROVIDER_FINGERPRINT_APP_ID: 54bc0d92-73e9-4f8b-86cd-c3fd96e06beb
          PROVIDER_FINGERPRINT_DEFAULT_INGRESS: https://omnitech-3rilx.ondigitalocean.app
        run: |
          python3 -I -S -B release/deployment/provider_fingerprint_diagnostic.py
