name: Repair Production CRM Canary Driver Logins
run-name: ${{ inputs.mode == 'apply' && 'Apply' || 'Plan' }} CRM canary driver login repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan, or one apply of exactly the two corrected login values
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      origin_authorization_json:
        description: Exact original public driver bootstrap packet, historical lineage only
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: rereply-production
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CONTROL_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  REF_PROTECTED: ${{ github.ref_protected }}
  REPAIR_MODE: ${{ inputs.mode }}
  ORIGIN_AUTHORIZATION_JSON: ${{ inputs.origin_authorization_json }}

jobs:
  plan:
    name: Plan exact CRM canary driver login repair without writes
    if: ${{ inputs.mode == 'plan' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: rereply-production-crm-fixture
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Prove the exact two-value login change inside the protected boundary
        env:
          GH_TOKEN: ${{ secrets.GH_DRIVER_BOOTSTRAP_READ_TOKEN }}
          CRM_CANARY_FIXTURE_INPUT_JSON: ${{ secrets.CRM_CANARY_FIXTURE_INPUT_JSON }}
          CRM_CANARY_DRIVER_BOOTSTRAP_JSON: ${{ secrets.CRM_CANARY_DRIVER_BOOTSTRAP_JSON }}
          DO_DRIVER_BOOTSTRAP_READ_TOKEN: ${{ secrets.DO_DRIVER_BOOTSTRAP_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/repair_crm_canary_driver_logins.py plan --control-root control

  apply:
    name: Apply exact CRM canary driver login repair once
    if: ${{ inputs.mode == 'apply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: rereply-production-crm-fixture
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Apply the two corrected login values, await health, install canary configuration
        env:
          GH_TOKEN: ${{ secrets.GH_DRIVER_BOOTSTRAP_READ_TOKEN }}
          CRM_CANARY_FIXTURE_INPUT_JSON: ${{ secrets.CRM_CANARY_FIXTURE_INPUT_JSON }}
          CRM_CANARY_DRIVER_BOOTSTRAP_JSON: ${{ secrets.CRM_CANARY_DRIVER_BOOTSTRAP_JSON }}
          DO_DRIVER_BOOTSTRAP_READ_TOKEN: ${{ secrets.DO_DRIVER_BOOTSTRAP_READ_TOKEN }}
          DO_DRIVER_RECOVERY_UPDATE_TOKEN: ${{ secrets.DO_DRIVER_RECOVERY_UPDATE_TOKEN }}
          GH_CANARY_ENVIRONMENT_WRITE_TOKEN: ${{ secrets.GH_CANARY_ENVIRONMENT_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/repair_crm_canary_driver_logins.py apply --control-root control --output-dir "$RUNNER_TEMP/driver-login-repair-receipt"
      - name: Attest content-free driver login repair provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/driver-login-repair-receipt/receipt.json
      - name: Attest exact driver login repair policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/driver-login-repair-receipt/receipt.json
          predicate-type: https://rereply.app/attestations/crm-canary-driver-login-repair/v1
          predicate-path: ${{ runner.temp }}/driver-login-repair-receipt/receipt.json
      - name: Upload only the public driver login repair receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-canary-driver-login-repair-${{ github.run_id }}-1
          path: ${{ runner.temp }}/driver-login-repair-receipt
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          compression-level: 0
          retention-days: 90
