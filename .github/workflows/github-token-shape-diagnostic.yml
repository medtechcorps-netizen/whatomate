name: GitHub Token Shape Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    environment: rereply-production-crm-fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Print token and deployment shape
        env:
          DO_PRODUCTION_FIXTURE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_FIXTURE_READ_TOKEN }}
          GITHUB_TOKEN_SHAPE_APP_ID: 54bc0d92-73e9-4f8b-86cd-c3fd96e06beb
        run: |
          python3 -I -S -B release/deployment/github_token_shape_diagnostic.py
