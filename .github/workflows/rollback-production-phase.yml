          sys.path.insert(0,'control/release/deployment'); import verify_production_release as common
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          request={'operation':'rollback','main_sha':os.environ['CONTROL_SHA'],'rule_id':os.environ['RULE_ID'],'rule_identity_sha256':os.environ['RULE_IDENTITY_SHA256'],'pre_lock':{'lock_branch':False,'is_admin_enforced':True,'lock_allows_fetch_and_merge':False},'post_lock':{'lock_branch':True,'is_admin_enforced':True,'lock_allows_fetch_and_merge':False},'http_methods_used':['POST'],'graphql_operations_used':['query','mutation','query'],'mutation_request_count':1,'outcome':os.environ['LOCK_OUTCOME'],'read_confirmed':True}
          authority={'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'artifact_id':os.environ['INTENT_ARTIFACT_ID'],'artifact_name':os.environ['INTENT_ARTIFACT_NAME'],'artifact_digest':os.environ['INTENT_ARTIFACT_DIGEST'],'sha256':os.environ['INTENT_SHA256']}
          (root/'main-lock-proof-request.json').write_bytes(common.canonical_file_bytes(request)); (root/'mutation-intent-authority.json').write_bytes(common.canonical_file_bytes(authority))
          PY
          /usr/bin/python3 -I -S -B "control/$COMMON_PATH" build-main-lock-proof --request "$RUNNER_TEMP/main-lock-proof-request.json" --mutation-intent "$intent" --mutation-intent-authority "$RUNNER_TEMP/mutation-intent-authority.json" --workflow-path "$WORKFLOW_PATH" --workflow-sha "$CONTROL_SHA" --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt 1 --runner-temp "$RUNNER_TEMP" --output "$RUNNER_TEMP/production-main-lock-proof.json"
          proof_sha="$(sha256sum "$RUNNER_TEMP/production-main-lock-proof.json" | awk '{print $1}')"; printf '%s\n' "$proof_sha" > "$RUNNER_TEMP/production-main-lock-proof.sha256"
          printf 'proof_name=production-main-lock-proof-rollback-%s-1\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"; printf 'proof_sha256=%s\n' "$proof_sha" >> "$GITHUB_OUTPUT"
          branch_read_token= github_read_token=
      - name: Attest production rollback main lock proof provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/production-main-lock-proof.json
      - name: Attest exact production rollback main lock proof policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/production-main-lock-proof.json
          predicate-type: ${{ env.LOCK_PROOF_PREDICATE }}
          predicate-path: ${{ runner.temp }}/production-main-lock-proof.json
      - name: Upload exact production rollback main lock proof
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prepare.outputs.proof_name }}
          path: |
            ${{ runner.temp }}/production-main-lock-proof.json
            ${{ runner.temp }}/production-main-lock-proof.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Canonicalize rollback main-lock-proof artifact digest
        id: digest
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact_digest=sha256:%s\n' "$RAW_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  rollback:
    name: Roll back exact production phase
    needs: [authority, prelock, intent, lock, lock_proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: rereply-production-apply
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      internal_name: ${{ steps.name.outputs.internal_name }}
      lock_name: ${{ needs.prelock.outputs.root_marker_name }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false
      - name: Download exact current authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.current_name }}
          path: ${{ runner.temp }}/current
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.current_run_id }}
      - name: Download exact target phase state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.target_name }}
          path: ${{ runner.temp }}/target-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.target_run_id }}
      - name: Download fresh recovery readiness
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.recovery_name }}
          path: ${{ runner.temp }}/recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.recovery_run_id }}
      - name: Download exact signed rollback mutation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.intent.outputs.intent_artifact_id }}
          path: ${{ runner.temp }}/mutation-intent
      - name: Download exact signed rollback main lock proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.lock_proof.outputs.proof_artifact_id }}
          path: ${{ runner.temp }}/main-lock-proof
      - name: Normalize exact rollback request before capability use
        env:
          RAW: ${{ inputs.rollback_evidence_json }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B -c '
          import os,sys,pathlib
          sys.path.insert(0,"control/release/deployment")
          import verify_production_release as c, rollback_production_change as r
          v=c.loads_strict(os.environ["RAW"])
          if v.pop("control_sha",None)!=os.environ["CONTROL_SHA"]: c.fail("control SHA differs")
          r.validate_request(v)
          pathlib.Path(os.environ["RUNNER_TEMP"]+"/rollback-evidence.json").write_bytes(c.canonical_file_bytes(v))'
      - name: Install pinned rollback authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"
      - name: Verify signed rollback authorities before capability use
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          CURRENT_KIND: ${{ needs.authority.outputs.current_kind }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(command -v gh)" == "$RUNNER_TEMP/release-tools/gh" ]]
          [[ "$(command -v jq)" == "$RUNNER_TEMP/release-tools/jq" ]]
          [[ "$(sha256sum "$(command -v jq)" | awk '{print $1}')" == "$PINNED_JQ_SHA256" ]]
          verify_subject() {
            local directory="$1" stem="$2" expected_sha="$3" workflow="$4" predicate="$5" label="$6"
            local subject="$directory/$stem.json" sidecar="$directory/$stem.sha256"
            [[ "$(find "$directory" -type f | wc -l)" -eq 2 ]]
            [[ -z "$(find "$directory" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
            [[ -f "$subject" && -f "$sidecar" ]]
            [[ "$(cat "$sidecar")" == "$expected_sha" ]]
            [[ "$(sha256sum "$subject" | awk '{print $1}')" == "$expected_sha" ]]
            local signer="$RELEASE_REPOSITORY/$workflow"
            local flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$signer" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
            gh attestation verify "$subject" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/$label-provenance.json"
            gh attestation verify "$subject" "${flags[@]}" --predicate-type "$predicate" > "$RUNNER_TEMP/$label-policy.json"
            jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/$label-provenance.json" > /dev/null
            jq -e --slurpfile expected "$subject" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/$label-policy.json" > /dev/null
          }
          current_sha="$(jq -er '.current_state.sha256' "$RUNNER_TEMP/rollback-evidence.json")"
          if [[ "$CURRENT_KIND" == phase-state ]]; then
            verify_subject "$RUNNER_TEMP/current" production-phase-state "$current_sha" "$CANARY_WORKFLOW_PATH" https://rereply.app/attestations/production-phase-state/v1 current
          else
            verify_subject "$RUNNER_TEMP/current" production-phase-apply-receipt "$current_sha" "$APPLY_WORKFLOW_PATH" https://rereply.app/attestations/production-phase-apply-receipt/v1 current
          fi
          verify_subject "$RUNNER_TEMP/target-state" production-phase-state "$(jq -er '.target_state.sha256' "$RUNNER_TEMP/rollback-evidence.json")" "$CANARY_WORKFLOW_PATH" https://rereply.app/attestations/production-phase-state/v1 target
          verify_subject "$RUNNER_TEMP/recovery" production-recovery-readiness "$(jq -er '.recovery.sha256' "$RUNNER_TEMP/rollback-evidence.json")" "$RECOVERY_WORKFLOW_PATH" https://rereply.app/attestations/production-recovery-readiness/v1 recovery
      - name: Verify exact rollback mutation-intent and main-lock-proof attestations
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          PROOF_SHA256: ${{ needs.lock_proof.outputs.proof_sha256 }}
        run: |
          set -euo pipefail
          gh_bin="$RUNNER_TEMP/release-tools/gh"; jq_bin="$RUNNER_TEMP/release-tools/jq"
          intent="$RUNNER_TEMP/mutation-intent/production-mutation-intent.json"; proof="$RUNNER_TEMP/main-lock-proof/production-main-lock-proof.json"
          [[ "$(find "$RUNNER_TEMP/mutation-intent" -maxdepth 1 -type f -printf '%f\n' | sort)" == $'production-mutation-intent.json\nproduction-mutation-intent.sha256' ]]
          [[ "$(find "$RUNNER_TEMP/main-lock-proof" -maxdepth 1 -type f -printf '%f\n' | sort)" == $'production-main-lock-proof.json\nproduction-main-lock-proof.sha256' ]]
          [[ -z "$(find "$RUNNER_TEMP/mutation-intent" "$RUNNER_TEMP/main-lock-proof" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(cat "$RUNNER_TEMP/mutation-intent/production-mutation-intent.sha256")" == "$INTENT_SHA256" && "$(sha256sum "$intent" | awk '{print $1}')" == "$INTENT_SHA256" ]]
          [[ "$(cat "$RUNNER_TEMP/main-lock-proof/production-main-lock-proof.sha256")" == "$PROOF_SHA256" && "$(sha256sum "$proof" | awk '{print $1}')" == "$PROOF_SHA256" ]]
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$WORKFLOW_PATH" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          "$gh_bin" attestation verify "$intent" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/rollback-intent-provenance.json"
          "$gh_bin" attestation verify "$intent" "${flags[@]}" --predicate-type "$INTENT_PREDICATE" > "$RUNNER_TEMP/rollback-intent-policy.json"
          "$gh_bin" attestation verify "$proof" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/rollback-proof-provenance.json"
          "$gh_bin" attestation verify "$proof" "${flags[@]}" --predicate-type "$LOCK_PROOF_PREDICATE" > "$RUNNER_TEMP/rollback-proof-policy.json"
          "$jq_bin" -e --slurpfile expected "$intent" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/rollback-intent-policy.json" > /dev/null
          "$jq_bin" -e --slurpfile expected "$proof" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/rollback-proof-policy.json" > /dev/null
      - name: Recheck exact protected main before capability use
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          CURRENT_RUN_ID: ${{ needs.authority.outputs.current_run_id }}
          RECOVERY_RUN_ID: ${{ needs.authority.outputs.recovery_run_id }}
          TARGET_RUN_ID: ${{ needs.authority.outputs.target_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const main = await github.rest.git.getRef({owner, repo, ref:'heads/main'});
            const current = await github.rest.actions.getWorkflowRun({owner, repo, run_id:context.runId});
            if (main.data.object.sha !== process.env.CONTROL_SHA || current.data.run_attempt !== 1 || current.data.head_sha !== process.env.CONTROL_SHA || current.data.event !== 'workflow_dispatch') throw new Error('rollback capability authority changed');
            for(const runId of [process.env.CURRENT_RUN_ID,process.env.TARGET_RUN_ID,process.env.RECOVERY_RUN_ID]) {
              const run=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(runId)});
               if(run.data.run_attempt!==1 || run.data.head_sha!==process.env.CONTROL_SHA || run.data.status!=='completed' || run.data.conclusion!=='success') throw new Error('rollback upstream authority changed');
             }

      - name: Require fresh anonymous pullability of the exact rollback tuple
        run: |
          set -euo pipefail
          unset DO_PRODUCTION_APPLY_TOKEN DO_PRODUCTION_TARGET_JSON
          unset DIGITALOCEAN_ACCESS_TOKEN DO_ACCESS_TOKEN DO_TOKEN
          unset GH_TOKEN GITHUB_TOKEN CR_PAT REGISTRY_AUTH_FILE DOCKER_AUTH_CONFIG

          anonymous_root="$RUNNER_TEMP/rereply-anonymous-rollback-pull"
          anonymous_home="$anonymous_root/home"
          anonymous_config="$anonymous_root/docker"
          [[ ! -e "$anonymous_root" ]]
          install -d -m 0700 "$anonymous_root" "$anonymous_home" "$anonymous_config"

          /usr/bin/python3 -I -S -B - <<'PY' > "$anonymous_root/subjects.txt"
          import json, os, pathlib, re
          state = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'target-state' / 'production-phase-state.json').read_text(encoding='utf-8'))
          images = state.get('provider_state', {}).get('images')
          expected = ['gmail-relay', 'meta-relay', 'web']
          if not isinstance(images, list) or sorted(item.get('component') for item in images if isinstance(item, dict)) != expected:
              raise SystemExit('rollback target image tuple differs')
          subjects = []
          for item in sorted(images, key=lambda value: value['component']):
              component = item['component']
              subject = item.get('subject')
              repository = f'ghcr.io/medtechcorps-netizen/rereply-release-{component}'
              digest = item.get('digest')
              if set(item) != {'component', 'repository', 'digest', 'subject'} or item.get('repository') != repository:
                  raise SystemExit('rollback target image record differs')
              if not isinstance(digest, str) or re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None or subject != f'{repository}@{digest}':
                  raise SystemExit('rollback target image subject differs')
              subjects.append(subject)
          if len(set(subjects)) != 3:
              raise SystemExit('rollback target image subjects are not unique')
          print(*subjects, sep='\n')
          PY
          mapfile -t target_images < "$anonymous_root/subjects.txt"
          [[ "${#target_images[@]}" -eq 3 ]]
          pulled=0
          for image in "${target_images[@]}"; do
            [[ "$image" =~ ^ghcr\.io/medtechcorps-netizen/rereply-release-(web|meta-relay|gmail-relay)@sha256:[0-9a-f]{64}$ ]]
            env -i \
              DOCKER_CONFIG="$anonymous_config" \
              HOME="$anonymous_home" \
              LANG=C.UTF-8 \
              PATH=/usr/local/bin:/usr/bin:/bin \
              /usr/bin/docker pull --platform linux/amd64 "$image"
            pulled=$((pulled + 1))
          done
          [[ "$pulled" -eq 3 ]]
          if [[ -f "$anonymous_config/config.json" ]]; then
            "$RUNNER_TEMP/release-tools/jq" -e '
              ((.auths // {}) | length) == 0 and
              ((.credHelpers // {}) | length) == 0 and
              ((.credsStore // "") == "")
            ' "$anonymous_config/config.json" > /dev/null
          fi

      - name: Roll back with one isolated app-update capability
        env:
          DO_PRODUCTION_APPLY_TOKEN: ${{ secrets.DO_PRODUCTION_APPLY_TOKEN }}
          DO_PRODUCTION_TARGET_JSON: ${{ secrets.DO_PRODUCTION_TARGET_JSON }}
          GH_PRODUCTION_BRANCH_READ_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_READ_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          CURRENT_KIND: ${{ needs.authority.outputs.current_kind }}
          CURRENT_RUN_ID: ${{ needs.authority.outputs.current_run_id }}
          RECOVERY_RUN_ID: ${{ needs.authority.outputs.recovery_run_id }}
          TARGET_RUN_ID: ${{ needs.authority.outputs.target_run_id }}
          INTENT_ARTIFACT_ID: ${{ needs.intent.outputs.intent_artifact_id }}
          INTENT_ARTIFACT_DIGEST: ${{ needs.intent.outputs.intent_artifact_digest }}
          INTENT_ARTIFACT_NAME: ${{ needs.intent.outputs.intent_name }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          PROOF_ARTIFACT_ID: ${{ needs.lock_proof.outputs.proof_artifact_id }}
          PROOF_ARTIFACT_DIGEST: ${{ needs.lock_proof.outputs.proof_artifact_digest }}
          PROOF_ARTIFACT_NAME: ${{ needs.lock_proof.outputs.proof_name }}
          PROOF_SHA256: ${{ needs.lock_proof.outputs.proof_sha256 }}
          RULE_ID: ${{ needs.prelock.outputs.rule_id }}
        run: |
          set -euo pipefail
          provider_token="$DO_PRODUCTION_APPLY_TOKEN"
          target_json="$DO_PRODUCTION_TARGET_JSON"
          branch_read_token="$GH_PRODUCTION_BRANCH_READ_TOKEN"
          github_read_token="$GITHUB_READ_TOKEN"
          unset DO_PRODUCTION_APPLY_TOKEN DO_PRODUCTION_TARGET_JSON GH_PRODUCTION_BRANCH_READ_TOKEN GITHUB_READ_TOKEN GH_TOKEN GITHUB_TOKEN
          [[ -n "$provider_token" && -n "$target_json" && -n "$branch_read_token" && -n "$github_read_token" ]]

          cleanup_secrets() {
            unset DO_PRODUCTION_APPLY_TOKEN DO_PRODUCTION_TARGET_JSON GH_TOKEN GITHUB_TOKEN
            provider_token= target_json= branch_read_token= github_read_token=
          }
          trap cleanup_secrets EXIT

          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          [[ "$(sha256sum "$jq_bin" | awk '{print $1}')" == "$PINNED_JQ_SHA256" ]]
          [[ "$("$gh_bin" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]
          read_api() {
            GH_TOKEN="$github_read_token" "$gh_bin" api "$@"
          }
          verify_exact_authority() {
            local live_main current_json run_id latest exact
            live_main="$(read_api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            [[ "$live_main" == "$CONTROL_SHA" ]]
            current_json="$(read_api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
            "$jq_bin" -e --arg sha "$CONTROL_SHA" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              .run_attempt == $attempt and .head_sha == $sha and .head_branch == "main" and
              .event == "workflow_dispatch" and (.status == "in_progress" or .status == "queued")
            ' <<< "$current_json" > /dev/null
            for run_id in "$CURRENT_RUN_ID" "$TARGET_RUN_ID" "$RECOVERY_RUN_ID"; do
              [[ "$run_id" =~ ^[1-9][0-9]{0,14}$ ]]
              latest="$(read_api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              exact="$(read_api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/1")"
              for run_json in "$latest" "$exact"; do
                "$jq_bin" -e --arg sha "$CONTROL_SHA" --argjson run_id "$run_id" '
                  .id == $run_id and .run_attempt == 1 and .head_sha == $sha and
                  .head_branch == "main" and .event == "workflow_dispatch" and
                  .status == "completed" and .conclusion == "success"
                ' <<< "$run_json" > /dev/null
              done
            done
            /usr/bin/python3 -I -S -B - <<'PY'
          import datetime as dt, pathlib, sys
          sys.path.insert(0, 'control/release/deployment')
          import verify_production_release as common
          recovery = common.load_json(pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'recovery' / 'production-recovery-readiness.json', 'recovery readiness')
          common.validate_fresh_window(recovery.get('issued_at'), recovery.get('expires_at'), dt.datetime.now(dt.timezone.utc), maximum_age_seconds=common.MAX_RECOVERY_AGE_SECONDS, label='recovery readiness')
          PY
          }

          verify_exact_authority
          jobs_json="$(read_api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100")"
          "$jq_bin" -e 'any(.jobs[]; .name == "Attest exact production rollback main lock proof" and .status == "completed" and .conclusion == "success")' <<< "$jobs_json" > /dev/null
          for descriptor in "$INTENT_ARTIFACT_ID|$INTENT_ARTIFACT_NAME|$INTENT_ARTIFACT_DIGEST" "$PROOF_ARTIFACT_ID|$PROOF_ARTIFACT_NAME|$PROOF_ARTIFACT_DIGEST"; do
            IFS='|' read -r artifact_id artifact_name artifact_digest <<< "$descriptor"
            artifact="$(read_api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            "$jq_bin" -e --arg name "$artifact_name" --arg digest "$artifact_digest" --argjson run_id "$GITHUB_RUN_ID" '.name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' <<< "$artifact" > /dev/null
          done
          repository_owner="${GITHUB_REPOSITORY%%/*}"; repository_name="${GITHUB_REPOSITORY#*/}"
          rule_query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}} ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
          locked_json="$(GH_TOKEN="$branch_read_token" "$gh_bin" api graphql -f "query=$rule_query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg id "$RULE_ID" --arg sha "$CONTROL_SHA" '.data.repository.ref.target.oid == $sha and .data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == true and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$locked_json" > /dev/null
          /usr/bin/python3 -I -S -B - <<'PY'
          import datetime as dt,os,pathlib,sys
          sys.path.insert(0,'control/release/deployment'); import verify_production_release as common
          root=pathlib.Path(os.environ['RUNNER_TEMP']); now=dt.datetime.now(dt.timezone.utc)
          intent_path=root/'mutation-intent'/'production-mutation-intent.json'; proof_path=root/'main-lock-proof'/'production-main-lock-proof.json'
          if common.sha256_bytes(intent_path.read_bytes())!=common.require_sha256(os.environ['INTENT_SHA256'],'rollback intent hash'): common.fail('rollback intent exact-file hash differs')
          if common.sha256_bytes(proof_path.read_bytes())!=common.require_sha256(os.environ['PROOF_SHA256'],'rollback proof hash'): common.fail('rollback proof exact-file hash differs')
          intent=common.validate_mutation_intent(common.load_json(intent_path,'mutation intent'),now=now)
          proof=common.validate_main_lock_proof(common.load_json(proof_path,'main lock proof'),mutation_intent=intent,now=now)
          intent_authority={'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'artifact_id':os.environ['INTENT_ARTIFACT_ID'],'artifact_name':os.environ['INTENT_ARTIFACT_NAME'],'artifact_digest':os.environ['INTENT_ARTIFACT_DIGEST'],'sha256':os.environ['INTENT_SHA256']}
          proof_authority={'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'artifact_id':os.environ['PROOF_ARTIFACT_ID'],'artifact_name':os.environ['PROOF_ARTIFACT_NAME'],'artifact_digest':os.environ['PROOF_ARTIFACT_DIGEST'],'sha256':os.environ['PROOF_SHA256']}
          if proof['mutation_intent']!=intent_authority: common.fail('rollback proof intent authority differs')
          (root/'mutation-intent-authority.json').write_bytes(common.canonical_file_bytes(intent_authority)); (root/'main-lock-proof-authority.json').write_bytes(common.canonical_file_bytes(proof_authority))
          PY

          if [[ "$CURRENT_KIND" == phase-state ]]; then current="$RUNNER_TEMP/current/production-phase-state.json"; else current="$RUNNER_TEMP/current/production-phase-apply-receipt.json"; fi
          export DO_PRODUCTION_APPLY_TOKEN="$provider_token"
          export DO_PRODUCTION_TARGET_JSON="$target_json"
          /usr/bin/python3 -I -S -B -c '
          import hashlib, os, pathlib, sys
          target = os.environ.pop("DO_PRODUCTION_TARGET_JSON")
          sys.path.insert(0, "control/release/deployment")
          import rollback_production_change as controller
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          current = root / "current" / ("production-phase-state.json" if os.environ["CURRENT_KIND"] == "phase-state" else "production-phase-apply-receipt.json")
          arguments = [
              "execute", "--target", target,
              "--evidence-request", str(root / "rollback-evidence.json"),
              "--current-state", str(current),
              "--target-state", str(root / "target-state" / "production-phase-state.json"),
              "--recovery", str(root / "recovery" / "production-recovery-readiness.json"),
              "--release-policy-sha256", hashlib.sha256(pathlib.Path("control/release/deployment/production-release-policy.json").read_bytes()).hexdigest(),
              "--change-schema-sha256", hashlib.sha256(pathlib.Path("control/release/deployment/production-change.schema.json").read_bytes()).hexdigest(),
              "--mutation-intent-schema-sha256", hashlib.sha256(pathlib.Path("control/release/deployment/production-mutation-intent.schema.json").read_bytes()).hexdigest(),
              "--controller-sha256", hashlib.sha256(pathlib.Path("control/release/deployment/rollback_production_change.py").read_bytes()).hexdigest(),
              "--workflow-path", os.environ["WORKFLOW_PATH"],
              "--workflow-sha", os.environ["CONTROL_SHA"],
              "--workflow-run-id", os.environ["GITHUB_RUN_ID"],
              "--workflow-run-attempt", os.environ["GITHUB_RUN_ATTEMPT"],
              "--runner-temp", str(root),
              "--output", str(root / "production-phase-rollback-receipt.json"),
              "--mutation-intent", str(root / "mutation-intent" / "production-mutation-intent.json"),
              "--mutation-intent-authority", str(root / "mutation-intent-authority.json"),
              "--main-lock-proof", str(root / "main-lock-proof" / "production-main-lock-proof.json"),
              "--main-lock-proof-authority", str(root / "main-lock-proof-authority.json"),
          ]
          raise SystemExit(controller.run_cli(arguments))'
          unset DO_PRODUCTION_APPLY_TOKEN DO_PRODUCTION_TARGET_JSON
          provider_token= target_json=

          post_main="$(read_api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$post_main" == "$CONTROL_SHA" ]]
          post_lock="$(GH_TOKEN="$branch_read_token" "$gh_bin" api graphql -f "query=$rule_query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg id "$RULE_ID" --arg sha "$CONTROL_SHA" '.data.repository.ref.target.oid == $sha and .data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == true and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$post_lock" > /dev/null
          cleanup_secrets
          trap - EXIT

      - name: Create exact sanitized rollback sidecar
        id: name
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum production-phase-rollback-receipt.json | awk '{print $1}' > production-phase-rollback-receipt.sha256
          printf 'internal_name=unsigned-production-phase-rollback-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.internal_name }}
          path: |
            ${{ runner.temp }}/production-phase-rollback-receipt.json
            ${{ runner.temp }}/production-phase-rollback-receipt.sha256
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Exact production rollback receipt gate
    needs: [authority, rollback]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false
      - name: Download unsigned rollback receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.rollback.outputs.internal_name }}
          path: ${{ runner.temp }}/receipt
      - name: Recheck exact protected main before attestation
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          CURRENT_RUN_ID: ${{ needs.authority.outputs.current_run_id }}
          RECOVERY_RUN_ID: ${{ needs.authority.outputs.recovery_run_id }}
          TARGET_RUN_ID: ${{ needs.authority.outputs.target_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const main = await github.rest.git.getRef({owner, repo, ref:'heads/main'});
            const current = await github.rest.actions.getWorkflowRun({owner, repo, run_id:context.runId});
            if (main.data.object.sha !== process.env.CONTROL_SHA || current.data.run_attempt !== 1 || current.data.head_sha !== process.env.CONTROL_SHA || current.data.event !== 'workflow_dispatch') throw new Error('rollback attestation authority changed');
            for(const runId of [process.env.CURRENT_RUN_ID,process.env.TARGET_RUN_ID,process.env.RECOVERY_RUN_ID]) {
              const run=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(runId)});
              if(run.data.run_attempt!==1 || run.data.head_sha!==process.env.CONTROL_SHA || run.data.status!=='completed' || run.data.conclusion!=='success') throw new Error('rollback upstream authority changed before attestation');
            }
      - name: Validate receipt and unchanged CAS
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_SHA" == "$CONTROL_SHA" ]]
          cd "$RUNNER_TEMP/receipt"
          [[ "$(cat production-phase-rollback-receipt.sha256)" == "$(sha256sum production-phase-rollback-receipt.json | awk '{print $1}')" ]]
          /usr/bin/python3 -I -S -B -c 'import sys,pathlib; sys.path.insert(0,"control/release/deployment"); import rollback_production_change as r, verify_production_release as v; p=pathlib.Path("'"$RUNNER_TEMP"'/receipt/production-phase-rollback-receipt.json"); r.validate_rollback_receipt(v.load_json(p,"rollback receipt"))'
      - name: Attest rollback provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/receipt/production-phase-rollback-receipt.json
      - name: Attest exact rollback policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/receipt/production-phase-rollback-receipt.json
          predicate-type: ${{ env.ROLLBACK_PREDICATE }}
          predicate-path: ${{ runner.temp }}/receipt/production-phase-rollback-receipt.json
      - name: Upload signed rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-phase-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 7

  release_authorization:
    name: Authorize exact production rollback main lock release
    needs: [authority, prelock, intent, lock, lock_proof, rollback, gate]
    if: ${{ needs.authority.result == 'success' && needs.prelock.result == 'success' && needs.intent.result == 'success' && needs.lock.result == 'success' && needs.lock_proof.result == 'success' && needs.rollback.result == 'success' && needs.gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      authorization_artifact_digest: ${{ steps.upload_release_intent.outputs.artifact-digest }}
      authorization_artifact_id: ${{ steps.upload_release_intent.outputs.artifact-id }}
      authorization_name: ${{ steps.release_intent.outputs.intent_name }}
      authorization_sha256: ${{ steps.release_intent.outputs.intent_sha256 }}
      receipt_artifact_digest: ${{ steps.authenticate.outputs.receipt_artifact_digest }}
      receipt_artifact_id: ${{ steps.authenticate.outputs.receipt_artifact_id }}
      receipt_name: ${{ steps.authenticate.outputs.receipt_name }}
      receipt_sha256: ${{ steps.evidence.outputs.receipt_sha256 }}
      rule_id: ${{ steps.evidence.outputs.rule_id }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Install pinned unlock authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          [[ "$("$tools_dir/jq" --version)" == "jq-$PINNED_JQ_VERSION" ]]
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" \
            "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]

      - name: Authenticate the exact successful rollback gate and immutable artifacts
        id: authenticate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          LOCK_NAME: ${{ needs.prelock.outputs.root_marker_name }}
          INTENT_NAME: ${{ needs.intent.outputs.intent_name }}
          PROOF_NAME: ${{ needs.lock_proof.outputs.proof_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const runId = context.runId;
            const expectedJobs = {
              'Authenticate exact production rollback authority': 'success',
              'Prepare exact production rollback pre-lock authority': 'success',
              'Prepare and attest exact production rollback mutation intent': 'success',
              'Acquire exact production rollback main lock': 'success',
              'Attest exact production rollback main lock proof': 'success',
              'Roll back exact production phase': 'success',
              'Exact production rollback receipt gate': 'success',
              'Authorize exact production rollback main lock release': null,
            };
            const main = await github.rest.git.getRef({owner, repo, ref:'heads/main'});
            if (main.data.object.sha !== process.env.CONTROL_SHA) throw new Error('main changed before rollback unlock');
            const latest = await github.rest.actions.getWorkflowRun({owner, repo, run_id:runId});
            const exact = await github.rest.actions.getWorkflowRunAttempt({owner, repo, run_id:runId, attempt_number:1});
            for (const run of [latest.data, exact.data]) {
              if (run.run_attempt !== 1 || run.head_sha !== process.env.CONTROL_SHA || run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.path !== process.env.WORKFLOW_PATH || run.status !== 'in_progress') throw new Error('rollback unlock run authority differs');
            }
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {owner, repo, run_id:runId, attempt_number:1, per_page:100});
            if (jobs.length !== 8 || JSON.stringify(jobs.map(job=>job.name).sort()) !== JSON.stringify(Object.keys(expectedJobs).sort())) throw new Error('rollback unlock job inventory differs');
            for (const job of jobs) {
              const expected = expectedJobs[job.name];
              if (expected === null) {
                if (job.status !== 'in_progress' || job.conclusion !== null) throw new Error('rollback release-authorization job is not current');
              } else if (job.status !== 'completed' || job.conclusion !== expected) throw new Error('rollback prerequisite job differs');
            }
            const receiptName = `production-phase-rollback-${runId}-1`;
            const unsignedName = `unsigned-production-phase-rollback-${runId}-1`;
            const expectedNames = [process.env.LOCK_NAME, process.env.INTENT_NAME, process.env.PROOF_NAME, receiptName, unsignedName].sort();
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id:runId, per_page:100});
            if (artifacts.length !== 5 || JSON.stringify(artifacts.map(item=>item.name).sort()) !== JSON.stringify(expectedNames)) throw new Error('rollback artifact inventory differs');
            async function exactArtifact(name) {
              const matches = artifacts.filter(item=>item.name===name);
              if (matches.length !== 1) throw new Error('rollback artifact is ambiguous');
              const artifact = await github.rest.actions.getArtifact({owner, repo, artifact_id:matches[0].id});
              if (artifact.data.expired || artifact.data.workflow_run.id !== runId || !/^sha256:[0-9a-f]{64}$/.test(artifact.data.digest)) throw new Error('rollback artifact authority differs');
              return artifact.data;
            }
            const marker = await exactArtifact(process.env.LOCK_NAME);
            const mutationIntent = await exactArtifact(process.env.INTENT_NAME);
            const lockProof = await exactArtifact(process.env.PROOF_NAME);
            const receipt = await exactArtifact(receiptName);
            const unsigned = await exactArtifact(unsignedName);
            core.setOutput('marker_artifact_id', String(marker.id));
            core.setOutput('marker_artifact_digest', marker.digest);
            core.setOutput('intent_artifact_id', String(mutationIntent.id));
            core.setOutput('intent_artifact_digest', mutationIntent.digest);
            core.setOutput('intent_name', process.env.INTENT_NAME);
            core.setOutput('proof_artifact_id', String(lockProof.id));
            core.setOutput('proof_artifact_digest', lockProof.digest);
            core.setOutput('proof_name', process.env.PROOF_NAME);
            core.setOutput('receipt_artifact_id', String(receipt.id));
            core.setOutput('receipt_artifact_digest', receipt.digest);
            core.setOutput('receipt_name', receiptName);
            core.setOutput('unsigned_artifact_id', String(unsigned.id));
            core.setOutput('unsigned_artifact_digest', unsigned.digest);
            core.setOutput('unsigned_name', unsignedName);

      - name: Download exact rollback lock marker
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.authenticate.outputs.marker_artifact_id }}
          path: ${{ runner.temp }}/lock
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download exact signed rollback receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.authenticate.outputs.receipt_artifact_id }}
          path: ${{ runner.temp }}/receipt
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify exact rollback lock ownership and signed receipt
        id: evidence
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(find "$RUNNER_TEMP/lock" -maxdepth 1 -type f -printf '%f\n')" == "rollback-main-lock.json" ]]
          [[ -z "$(find "$RUNNER_TEMP/lock" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(find "$RUNNER_TEMP/receipt" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-phase-rollback-receipt.json production-phase-rollback-receipt.sha256 " ]]
          [[ -z "$(find "$RUNNER_TEMP/receipt" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(cat "$RUNNER_TEMP/receipt/production-phase-rollback-receipt.sha256")" == "$(sha256sum "$RUNNER_TEMP/receipt/production-phase-rollback-receipt.json" | awk '{print $1}')" ]]
          /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          marker_path = root / 'lock' / 'rollback-main-lock.json'
          marker_raw = marker_path.read_bytes()
          marker = json.loads(marker_raw)
          if sorted(marker) != ['control_sha','rule_id','run_attempt','run_id','schema_version','state']:
              raise SystemExit('rollback lock marker keys differ')
          if marker['schema_version'] != 1 or marker['run_id'] != os.environ['GITHUB_RUN_ID'] or marker['run_attempt'] != 1 or marker['control_sha'] != os.environ['CONTROL_SHA'] or marker['state'] != 'acquire-intent' or re.fullmatch(r'[A-Za-z0-9_+/=-]+', marker['rule_id']) is None:
              raise SystemExit('rollback lock marker authority differs')
          sys.path.insert(0, 'control/release/deployment')
          import rollback_production_change as rollback
          import verify_production_release as common
          receipt_path = root / 'receipt' / 'production-phase-rollback-receipt.json'
          receipt = rollback.validate_rollback_receipt(common.load_json(receipt_path, 'rollback receipt'))
          control = receipt['control']
          if control['workflow_sha'] != os.environ['CONTROL_SHA'] or control['workflow_path'] != '.github/workflows/rollback-production-phase.yml' or str(control['run_id']) != os.environ['GITHUB_RUN_ID'] or control['run_attempt'] != 1:
              raise SystemExit('rollback receipt control authority differs')
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as stream:
              stream.write(f"rule_id={marker['rule_id']}\n")
              stream.write(f"marker_sha256={hashlib.sha256(marker_raw).hexdigest()}\n")
              stream.write(f"receipt_sha256={hashlib.sha256(receipt_path.read_bytes()).hexdigest()}\n")
          PY
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          signer="$RELEASE_REPOSITORY/$WORKFLOW_PATH"
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$signer" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          "$gh_bin" attestation verify "$RUNNER_TEMP/receipt/production-phase-rollback-receipt.json" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/rollback-unlock-provenance.json"
          "$gh_bin" attestation verify "$RUNNER_TEMP/receipt/production-phase-rollback-receipt.json" "${flags[@]}" --predicate-type "$ROLLBACK_PREDICATE" > "$RUNNER_TEMP/rollback-unlock-policy.json"
          "$jq_bin" -e 'type == "array" and length > 0' "$RUNNER_TEMP/rollback-unlock-provenance.json" > /dev/null
          "$jq_bin" -e --slurpfile expected "$RUNNER_TEMP/receipt/production-phase-rollback-receipt.json" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/rollback-unlock-policy.json" > /dev/null

      - name: Create exact durable rollback release authorization before unlock
        id: release_intent
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          EXPECTED_MARKER_ARTIFACT_DIGEST: ${{ steps.authenticate.outputs.marker_artifact_digest }}
          EXPECTED_MARKER_ARTIFACT_ID: ${{ steps.authenticate.outputs.marker_artifact_id }}
          EXPECTED_MARKER_NAME: ${{ needs.rollback.outputs.lock_name }}
          EXPECTED_MARKER_SHA256: ${{ steps.evidence.outputs.marker_sha256 }}
          EXPECTED_INTENT_ARTIFACT_DIGEST: ${{ steps.authenticate.outputs.intent_artifact_digest }}
          EXPECTED_INTENT_ARTIFACT_ID: ${{ steps.authenticate.outputs.intent_artifact_id }}
          EXPECTED_INTENT_NAME: ${{ steps.authenticate.outputs.intent_name }}
          EXPECTED_INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          EXPECTED_PROOF_ARTIFACT_DIGEST: ${{ steps.authenticate.outputs.proof_artifact_digest }}
          EXPECTED_PROOF_ARTIFACT_ID: ${{ steps.authenticate.outputs.proof_artifact_id }}
          EXPECTED_PROOF_NAME: ${{ steps.authenticate.outputs.proof_name }}
          EXPECTED_PROOF_SHA256: ${{ needs.lock_proof.outputs.proof_sha256 }}
          EXPECTED_RECEIPT_ARTIFACT_DIGEST: ${{ steps.authenticate.outputs.receipt_artifact_digest }}
          EXPECTED_RECEIPT_ARTIFACT_ID: ${{ steps.authenticate.outputs.receipt_artifact_id }}
          EXPECTED_RECEIPT_NAME: ${{ steps.authenticate.outputs.receipt_name }}
          EXPECTED_RECEIPT_SHA256: ${{ steps.evidence.outputs.receipt_sha256 }}
          EXPECTED_RULE_ID: ${{ steps.evidence.outputs.rule_id }}
          EXPECTED_UNSIGNED_ARTIFACT_DIGEST: ${{ steps.authenticate.outputs.unsigned_artifact_digest }}
          EXPECTED_UNSIGNED_ARTIFACT_ID: ${{ steps.authenticate.outputs.unsigned_artifact_id }}
          EXPECTED_UNSIGNED_NAME: ${{ steps.authenticate.outputs.unsigned_name }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          github_read_token="$GH_READ_TOKEN"
          unset GH_READ_TOKEN GH_TOKEN GITHUB_TOKEN
          [[ -n "$github_read_token" ]]
          cleanup_tokens() { github_read_token=; }
          trap cleanup_tokens EXIT
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          read_api() { GH_TOKEN="$github_read_token" "$gh_bin" api "$@"; }

          [[ "$(sha256sum "$RUNNER_TEMP/lock/rollback-main-lock.json" | awk '{print $1}')" == "$EXPECTED_MARKER_SHA256" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/receipt/production-phase-rollback-receipt.json" | awk '{print $1}')" == "$EXPECTED_RECEIPT_SHA256" ]]
          for endpoint in "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1"; do
            run_json="$(read_api "$endpoint")"
            "$jq_bin" -e --arg sha "$CONTROL_SHA" --arg path "$WORKFLOW_PATH" '.run_attempt == 1 and .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .path == $path and .status == "in_progress"' <<< "$run_json" > /dev/null
          done
          jobs_json="$(read_api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100")"
          "$jq_bin" -e '
            .total_count == 8 and (.jobs | length) == 8 and
            ([.jobs[].name] | sort) == (["Acquire exact production rollback main lock","Attest exact production rollback main lock proof","Authenticate exact production rollback authority","Authorize exact production rollback main lock release","Exact production rollback receipt gate","Prepare and attest exact production rollback mutation intent","Prepare exact production rollback pre-lock authority","Roll back exact production phase"] | sort) and
            ([.jobs[] | select(.name == "Authorize exact production rollback main lock release" and .status == "in_progress" and .conclusion == null)] | length) == 1 and
            ([.jobs[] | select(.name != "Authorize exact production rollback main lock release" and .status == "completed" and .conclusion == "success")] | length) == 7
          ' <<< "$jobs_json" > /dev/null
          "$jq_bin" -cS '[
            "Authenticate exact production rollback authority",
            "Prepare exact production rollback pre-lock authority",
            "Prepare and attest exact production rollback mutation intent",
            "Acquire exact production rollback main lock",
            "Attest exact production rollback main lock proof",
            "Roll back exact production phase",
            "Exact production rollback receipt gate",
            "Authorize exact production rollback main lock release"
          ] as $expected | [$expected[] as $name | (.jobs[] | select(.name == $name) | {job_id:(.id|tostring),name,status,conclusion})]' \
            <<< "$jobs_json" > "$RUNNER_TEMP/rollback-release-jobs.json"
          artifacts_json="$(read_api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          "$jq_bin" -e \
            --arg marker_name "$EXPECTED_MARKER_NAME" --argjson marker_id "$EXPECTED_MARKER_ARTIFACT_ID" --arg marker_digest "$EXPECTED_MARKER_ARTIFACT_DIGEST" \
            --arg intent_name "$EXPECTED_INTENT_NAME" --argjson intent_id "$EXPECTED_INTENT_ARTIFACT_ID" --arg intent_digest "$EXPECTED_INTENT_ARTIFACT_DIGEST" \
            --arg proof_name "$EXPECTED_PROOF_NAME" --argjson proof_id "$EXPECTED_PROOF_ARTIFACT_ID" --arg proof_digest "$EXPECTED_PROOF_ARTIFACT_DIGEST" \
            --arg receipt_name "$EXPECTED_RECEIPT_NAME" --argjson receipt_id "$EXPECTED_RECEIPT_ARTIFACT_ID" --arg receipt_digest "$EXPECTED_RECEIPT_ARTIFACT_DIGEST" \
            --arg unsigned_name "$EXPECTED_UNSIGNED_NAME" --argjson unsigned_id "$EXPECTED_UNSIGNED_ARTIFACT_ID" --arg unsigned_digest "$EXPECTED_UNSIGNED_ARTIFACT_DIGEST" '
            .total_count == 5 and (.artifacts | length) == 5 and
            ([.artifacts[].name] | sort) == ([$marker_name,$intent_name,$proof_name,$receipt_name,$unsigned_name] | sort) and
            any(.artifacts[]; .id == $marker_id and .name == $marker_name and .digest == $marker_digest and .expired == false) and
            any(.artifacts[]; .id == $intent_id and .name == $intent_name and .digest == $intent_digest and .expired == false) and
            any(.artifacts[]; .id == $proof_id and .name == $proof_name and .digest == $proof_digest and .expired == false) and
            any(.artifacts[]; .id == $receipt_id and .name == $receipt_name and .digest == $receipt_digest and .expired == false) and
            any(.artifacts[]; .id == $unsigned_id and .name == $unsigned_name and .digest == $unsigned_digest and .expired == false)
          ' <<< "$artifacts_json" > /dev/null
          "$jq_bin" -e 'type == "array" and length > 0' "$RUNNER_TEMP/rollback-unlock-provenance.json" > /dev/null
          "$jq_bin" -e --slurpfile expected "$RUNNER_TEMP/receipt/production-phase-rollback-receipt.json" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/rollback-unlock-policy.json" > /dev/null
          provenance_sha256="$(sha256sum "$RUNNER_TEMP/rollback-unlock-provenance.json" | awk '{print $1}')"
          policy_sha256="$(sha256sum "$RUNNER_TEMP/rollback-unlock-policy.json" | awk '{print $1}')"
          export PROVENANCE_SHA256="$provenance_sha256" POLICY_SHA256="$policy_sha256"
          /usr/bin/python3 -I -S -B - <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0, 'control/release/deployment')
          import authorize_production_main_lock_release as controller
          import rollback_production_change as rollback
          import verify_production_release as common
          request = {
              'operation': 'rollback',
              'issued_at': dt.datetime.now(dt.timezone.utc).replace(microsecond=0).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'control': {
                  'workflow_path': os.environ['WORKFLOW_PATH'],
                  'workflow_sha': os.environ['CONTROL_SHA'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': 1,
                  'runner_environment': 'github-hosted',
                  'authorization_schema_sha256': hashlib.sha256(pathlib.Path('control', os.environ['RELEASE_AUTHORIZATION_SCHEMA_PATH']).read_bytes()).hexdigest(),
                  'controller_sha256': hashlib.sha256(pathlib.Path('control', os.environ['RELEASE_AUTHORIZATION_CONTROLLER_PATH']).read_bytes()).hexdigest(),
              },
              'jobs': json.loads((root / 'rollback-release-jobs.json').read_text(encoding='utf-8')),
              'branch': {
                  'main_sha': os.environ['CONTROL_SHA'],
                  'rule_id': os.environ['EXPECTED_RULE_ID'],
                  'rule_identity_sha256': hashlib.sha256(os.environ['EXPECTED_RULE_ID'].encode('utf-8')).hexdigest(),
                  'lock_branch': True,
                  'is_admin_enforced': True,
                  'lock_allows_fetch_and_merge': False,
              },
              'artifacts': {
                  'acquire_intent': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': 1, 'artifact_id': os.environ['EXPECTED_MARKER_ARTIFACT_ID'], 'artifact_name': os.environ['EXPECTED_MARKER_NAME'], 'artifact_digest': os.environ['EXPECTED_MARKER_ARTIFACT_DIGEST'], 'sha256': os.environ['EXPECTED_MARKER_SHA256']},
                  'mutation_intent': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': 1, 'artifact_id': os.environ['EXPECTED_INTENT_ARTIFACT_ID'], 'artifact_name': os.environ['EXPECTED_INTENT_NAME'], 'artifact_digest': os.environ['EXPECTED_INTENT_ARTIFACT_DIGEST'], 'sha256': os.environ['EXPECTED_INTENT_SHA256']},
                  'main_lock_proof': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': 1, 'artifact_id': os.environ['EXPECTED_PROOF_ARTIFACT_ID'], 'artifact_name': os.environ['EXPECTED_PROOF_NAME'], 'artifact_digest': os.environ['EXPECTED_PROOF_ARTIFACT_DIGEST'], 'sha256': os.environ['EXPECTED_PROOF_SHA256']},
                  'unsigned_receipt': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': 1, 'artifact_id': os.environ['EXPECTED_UNSIGNED_ARTIFACT_ID'], 'artifact_name': os.environ['EXPECTED_UNSIGNED_NAME'], 'artifact_digest': os.environ['EXPECTED_UNSIGNED_ARTIFACT_DIGEST'], 'sha256': os.environ['EXPECTED_RECEIPT_SHA256']},
                  'signed_receipt': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': 1, 'artifact_id': os.environ['EXPECTED_RECEIPT_ARTIFACT_ID'], 'artifact_name': os.environ['EXPECTED_RECEIPT_NAME'], 'artifact_digest': os.environ['EXPECTED_RECEIPT_ARTIFACT_DIGEST'], 'sha256': os.environ['EXPECTED_RECEIPT_SHA256']},
              },
              'receipt_attestations': {
                  'signer_workflow': f"{os.environ['RELEASE_REPOSITORY']}/{os.environ['WORKFLOW_PATH']}",
                  'signer_digest': os.environ['CONTROL_SHA'],
                  'source_digest': os.environ['CONTROL_SHA'],
                  'source_ref': 'refs/heads/main',
                  'runner_environment': 'github-hosted',
                  'provenance_predicate_type': 'https://slsa.dev/provenance/v1',
                  'policy_predicate_type': os.environ['ROLLBACK_PREDICATE'],
                  'provenance_verification_sha256': os.environ['PROVENANCE_SHA256'],
                  'policy_verification_sha256': os.environ['POLICY_SHA256'],
              },
          }
          receipt = rollback.validate_rollback_receipt(common.load_json(root / 'receipt' / 'production-phase-rollback-receipt.json', 'rollback receipt'))
          payload = controller.build_authorization(request, receipt, now=dt.datetime.now(dt.timezone.utc))
          path = root / 'production-main-lock-release-authorization.json'
          raw = common.canonical_file_bytes(payload)
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(raw)
          digest = hashlib.sha256(raw).hexdigest()
          sidecar = root / 'production-main-lock-release-authorization.sha256'
          sidecar_fd = os.open(sidecar, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(sidecar_fd, 'wb') as stream:
              stream.write((digest + '\n').encode('ascii'))
          controller.validate_authorization(payload, receipt=receipt, now=dt.datetime.now(dt.timezone.utc))
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as stream:
              stream.write(f"intent_name=production-main-lock-release-authorization-rollback-{os.environ['GITHUB_RUN_ID']}-1\n")
              stream.write(f"intent_sha256={digest}\n")
          PY
          cleanup_tokens
          trap - EXIT

      - name: Attest rollback release authorization provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/production-main-lock-release-authorization.json

      - name: Attest exact rollback release authorization policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/production-main-lock-release-authorization.json
          predicate-type: ${{ env.RELEASE_AUTHORIZATION_PREDICATE }}
          predicate-path: ${{ runner.temp }}/production-main-lock-release-authorization.json

      - name: Upload durable rollback release authorization
        id: upload_release_intent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release_intent.outputs.intent_name }}
          path: |
            ${{ runner.temp }}/production-main-lock-release-authorization.json
            ${{ runner.temp }}/production-main-lock-release-authorization.sha256
          if-no-files-found: error
          retention-days: 30

  unlock:
    name: Release exact production rollback main lock
    needs: [authority, prelock, intent, lock, lock_proof, rollback, gate, release_authorization]
    if: ${{ needs.authority.result == 'success' && needs.prelock.result == 'success' && needs.intent.result == 'success' && needs.lock.result == 'success' && needs.lock_proof.result == 'success' && needs.rollback.result == 'success' && needs.gate.result == 'success' && needs.release_authorization.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: rereply-production-apply
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Install pinned unlock verification tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"

      - name: Download exact signed rollback release authorization
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.release_authorization.outputs.authorization_artifact_id }}
          path: ${{ runner.temp }}/release-authorization
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download exact signed rollback receipt for release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.release_authorization.outputs.receipt_artifact_id }}
          path: ${{ runner.temp }}/release-receipt
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Authenticate exact rollback pre-unlock authority
        env:
          AUTHORIZATION_ARTIFACT_DIGEST: ${{ needs.release_authorization.outputs.authorization_artifact_digest }}
          AUTHORIZATION_ARTIFACT_ID: ${{ needs.release_authorization.outputs.authorization_artifact_id }}
          AUTHORIZATION_NAME: ${{ needs.release_authorization.outputs.authorization_name }}
          AUTHORIZATION_SHA256: ${{ needs.release_authorization.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_DIGEST: ${{ needs.release_authorization.outputs.receipt_artifact_digest }}
          RECEIPT_ARTIFACT_ID: ${{ needs.release_authorization.outputs.receipt_artifact_id }}
          RECEIPT_NAME: ${{ needs.release_authorization.outputs.receipt_name }}
          RECEIPT_SHA256: ${{ needs.release_authorization.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          [[ "$(find "$RUNNER_TEMP/release-authorization" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-main-lock-release-authorization.json production-main-lock-release-authorization.sha256 " ]]
          [[ -z "$(find "$RUNNER_TEMP/release-authorization" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(cat "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.sha256")" == "$AUTHORIZATION_SHA256" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" | awk '{print $1}')" == "$AUTHORIZATION_SHA256" ]]
          [[ "$(find "$RUNNER_TEMP/release-receipt" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-phase-rollback-receipt.json production-phase-rollback-receipt.sha256 " ]]
          [[ "$(cat "$RUNNER_TEMP/release-receipt/production-phase-rollback-receipt.sha256")" == "$RECEIPT_SHA256" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/release-receipt/production-phase-rollback-receipt.json" | awk '{print $1}')" == "$RECEIPT_SHA256" ]]
          [[ "$AUTHORIZATION_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          auth_api_digest="sha256:$AUTHORIZATION_ARTIFACT_DIGEST"
          for endpoint in "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1"; do
            run_json="$("$gh_bin" api "$endpoint")"
            "$jq_bin" -e --arg sha "$CONTROL_SHA" --arg path "$WORKFLOW_PATH" '.run_attempt == 1 and .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .path == $path and .status == "in_progress"' <<< "$run_json" > /dev/null
          done
          jobs_json="$("$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100")"
          "$jq_bin" -e '
            .total_count == 9 and (.jobs | length) == 9 and
            ([.jobs[].name] | sort) == (["Acquire exact production rollback main lock","Attest exact production rollback main lock proof","Authenticate exact production rollback authority","Authorize exact production rollback main lock release","Exact production rollback receipt gate","Prepare and attest exact production rollback mutation intent","Prepare exact production rollback pre-lock authority","Release exact production rollback main lock","Roll back exact production phase"] | sort) and
            ([.jobs[] | select(.name == "Release exact production rollback main lock" and .status == "in_progress" and .conclusion == null)] | length) == 1 and
            ([.jobs[] | select(.name != "Release exact production rollback main lock" and .status == "completed" and .conclusion == "success")] | length) == 8
          ' <<< "$jobs_json" > /dev/null
          artifacts_json="$("$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          "$jq_bin" -e --arg auth "$AUTHORIZATION_NAME" --arg receipt "$RECEIPT_NAME" '
            .total_count == 6 and (.artifacts | length) == 6 and
            ([.artifacts[].name] | sort) == ([
              "production-main-lock-rollback-" + ($ENV.GITHUB_RUN_ID) + "-1",
              "production-mutation-intent-rollback-" + ($ENV.GITHUB_RUN_ID) + "-1",
              "production-main-lock-proof-rollback-" + ($ENV.GITHUB_RUN_ID) + "-1",
              "unsigned-production-phase-rollback-" + ($ENV.GITHUB_RUN_ID) + "-1",
              $receipt,$auth
            ] | sort)
          ' <<< "$artifacts_json" > /dev/null
          for specification in "$AUTHORIZATION_ARTIFACT_ID|$auth_api_digest|$AUTHORIZATION_NAME" "$RECEIPT_ARTIFACT_ID|$RECEIPT_ARTIFACT_DIGEST|$RECEIPT_NAME"; do
            IFS='|' read -r artifact_id artifact_digest artifact_name <<< "$specification"
            artifact_json="$("$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            "$jq_bin" -e --argjson id "$artifact_id" --arg digest "$artifact_digest" --arg name "$artifact_name" --argjson run_id "$GITHUB_RUN_ID" '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' <<< "$artifact_json" > /dev/null
          done
          /usr/bin/python3 -I -S -B "control/$RELEASE_AUTHORIZATION_CONTROLLER_PATH" validate --authorization "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" --receipt "$RUNNER_TEMP/release-receipt/production-phase-rollback-receipt.json" --sha256 "$AUTHORIZATION_SHA256"
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$WORKFLOW_PATH" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          "$gh_bin" attestation verify "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/release-auth-provenance.json"
          "$gh_bin" attestation verify "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" "${flags[@]}" --predicate-type "$RELEASE_AUTHORIZATION_PREDICATE" > "$RUNNER_TEMP/release-auth-policy.json"
          "$jq_bin" -e 'type == "array" and length > 0' "$RUNNER_TEMP/release-auth-provenance.json" > /dev/null
          "$jq_bin" -e --slurpfile expected "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/release-auth-policy.json" > /dev/null

      - name: Release the exact authorized rollback main lock
        env:
          AUTHORIZATION_SHA256: ${{ needs.release_authorization.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          EXPECTED_RULE_ID: ${{ needs.release_authorization.outputs.rule_id }}
          GH_PRODUCTION_BRANCH_LOCK_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_LOCK_TOKEN }}
          GH_PRODUCTION_BRANCH_READ_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_READ_TOKEN }}
        run: |
          set -euo pipefail
          branch_lock_token="$GH_PRODUCTION_BRANCH_LOCK_TOKEN"
          branch_read_token="$GH_PRODUCTION_BRANCH_READ_TOKEN"
          unset GH_PRODUCTION_BRANCH_LOCK_TOKEN GH_PRODUCTION_BRANCH_READ_TOKEN GH_TOKEN GITHUB_TOKEN
          [[ -n "$branch_lock_token" && -n "$branch_read_token" ]]
          cleanup_tokens() { branch_lock_token= branch_read_token=; }
          trap cleanup_tokens EXIT
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          read_rule() { GH_TOKEN="$branch_read_token" "$gh_bin" api graphql "$@"; }
          mutate_rule() { GH_TOKEN="$branch_lock_token" "$gh_bin" api graphql "$@"; }
          [[ "$(sha256sum "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" | awk '{print $1}')" == "$AUTHORIZATION_SHA256" ]]
          /usr/bin/python3 -I -S -B "control/$RELEASE_AUTHORIZATION_CONTROLLER_PATH" validate \
            --authorization "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" \
            --receipt "$RUNNER_TEMP/release-receipt/production-phase-rollback-receipt.json" \
            --sha256 "$AUTHORIZATION_SHA256"
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}} ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
          before="$(read_rule -f "query=$query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg id "$EXPECTED_RULE_ID" --arg sha "$CONTROL_SHA" '.data.repository.branchProtectionRules.pageInfo.hasNextPage == false and .data.repository.ref.target.oid == $sha and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == true and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$before" > /dev/null
          mutation='mutation($ruleId:ID!,$lock:Boolean!){updateBranchProtectionRule(input:{branchProtectionRuleId:$ruleId,lockBranch:$lock}){branchProtectionRule{id pattern lockBranch}}}'
          /usr/bin/python3 -I -S -B "control/$RELEASE_AUTHORIZATION_CONTROLLER_PATH" validate \
            --authorization "$RUNNER_TEMP/release-authorization/production-main-lock-release-authorization.json" \
            --receipt "$RUNNER_TEMP/release-receipt/production-phase-rollback-receipt.json" \
            --sha256 "$AUTHORIZATION_SHA256"
          set +e
          response="$(mutate_rule -f "query=$mutation" -F "ruleId=$EXPECTED_RULE_ID" -F lock=false)"
          mutation_status=$?
          set -e
          after="$(read_rule -f "query=$query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg id "$EXPECTED_RULE_ID" --arg sha "$CONTROL_SHA" '.data.repository.branchProtectionRules.pageInfo.hasNextPage == false and .data.repository.ref.target.oid == $sha and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == false and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$after" > /dev/null
          if [[ "$mutation_status" -eq 0 ]]; then
            "$jq_bin" -e --arg id "$EXPECTED_RULE_ID" '(.errors // []) == [] and .data.updateBranchProtectionRule.branchProtectionRule.id == $id and .data.updateBranchProtectionRule.branchProtectionRule.pattern == "main" and .data.updateBranchProtectionRule.branchProtectionRule.lockBranch == false' <<< "$response" > /dev/null
          fi
          cleanup_tokens
          trap - EXIT
