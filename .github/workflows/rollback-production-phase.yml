name: Rollback Production Phase

run-name: Roll back one exact production phase from signed evidence

on:
  workflow_dispatch:
    inputs:
      rollback_evidence_json:
        description: Exact control SHA plus current, rollback-target, recovery, and rollout authorities
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_REPOSITORY: medtechcorps-netizen/whatomate
  WORKFLOW_PATH: .github/workflows/rollback-production-phase.yml
  APPLY_WORKFLOW_PATH: .github/workflows/apply-production-phase.yml
  CANARY_WORKFLOW_PATH: .github/workflows/verify-production-crm-canary.yml
  RECOVERY_WORKFLOW_PATH: .github/workflows/verify-production-recovery-readiness.yml
  CONTROLLER_PATH: release/deployment/rollback_production_change.py
  COMMON_PATH: release/deployment/verify_production_release.py
  POLICY_PATH: release/deployment/production-release-policy.json
  SCHEMA_PATH: release/deployment/production-change.schema.json
  INTENT_SCHEMA_PATH: release/deployment/production-mutation-intent.schema.json
  LOCK_PROOF_SCHEMA_PATH: release/deployment/production-main-lock-proof.schema.json
  RELEASE_AUTHORIZATION_CONTROLLER_PATH: release/deployment/authorize_production_main_lock_release.py
  RELEASE_AUTHORIZATION_SCHEMA_PATH: release/deployment/production-main-lock-release-authorization.schema.json
  INTENT_PREDICATE: https://rereply.app/attestations/production-mutation-intent/v2
  LOCK_PROOF_PREDICATE: https://rereply.app/attestations/production-main-lock-proof/v1
  ROLLBACK_PREDICATE: https://rereply.app/attestations/production-phase-rollback-receipt/v1
  RELEASE_AUTHORIZATION_PREDICATE: https://rereply.app/attestations/production-main-lock-release-authorization/v1
  PINNED_JQ_VERSION: "1.8.2"
  PINNED_JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
  PINNED_JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
  PINNED_GH_VERSION: "2.98.0"
  PINNED_GH_URL: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
  PINNED_GH_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de

jobs:
  authority:
    name: Authenticate exact production rollback authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      control_sha: ${{ steps.guard.outputs.control_sha }}
      current_kind: ${{ steps.github.outputs.current_kind }}
      current_run_id: ${{ steps.github.outputs.current_run_id }}
      current_name: ${{ steps.github.outputs.current_name }}
      target_run_id: ${{ steps.github.outputs.target_run_id }}
      target_name: ${{ steps.github.outputs.target_name }}
      recovery_run_id: ${{ steps.github.outputs.recovery_run_id }}
      recovery_name: ${{ steps.github.outputs.recovery_name }}
    steps:
      - name: Require exact protected-main attempt-one authority
        id: guard
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch && "$REPOSITORY" == "$RELEASE_REPOSITORY" ]]
          [[ "$DISPATCH_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$RUN_ATTEMPT" == 1 && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$WORKFLOW_REF" == "$RELEASE_REPOSITORY/$WORKFLOW_PATH@refs/heads/main" ]]
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'control_sha=%s\n' "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.guard.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false
      - name: Authenticate immutable rollback artifacts
        id: github
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ steps.guard.outputs.control_sha }}
          RAW: ${{ inputs.rollback_evidence_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const value=JSON.parse(process.env.RAW);
            const top=['control_sha','current_state','recovery','rollout_plan_sha256','target_state'];
            if (JSON.stringify(Object.keys(value).sort())!==JSON.stringify(top) || value.control_sha!==process.env.CONTROL_SHA || !/^[0-9a-f]{64}$/.test(value.rollout_plan_sha256)) throw new Error('rollback descriptor differs');
            const {owner,repo}=context.repo;
            const main=await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if(main.data.object.sha!==process.env.CONTROL_SHA) throw new Error('main changed');
            async function artifact(binding,kind,workflow,name,expectedJobs) {
              const keys=(kind==='current')?['artifact_digest','artifact_id','kind','run_attempt','run_id','sha256']:['artifact_digest','artifact_id','run_attempt','run_id','sha256'];
              if(JSON.stringify(Object.keys(binding).sort())!==JSON.stringify(keys) || binding.run_attempt!==1 || !/^sha256:[0-9a-f]{64}$/.test(binding.artifact_digest) || !/^[0-9a-f]{64}$/.test(binding.sha256)) throw new Error(`${kind} binding differs`);
              const latest=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(binding.run_id)});
              const exact=await github.rest.actions.getWorkflowRunAttempt({owner,repo,run_id:Number(binding.run_id),attempt_number:1});
              for(const run of [latest.data,exact.data]) if(run.run_attempt!==1 || run.head_sha!==process.env.CONTROL_SHA || run.head_branch!=='main' || run.event!=='workflow_dispatch' || run.path!==workflow || run.status!=='completed' || run.conclusion!=='success') throw new Error(`${kind} run differs`);
              const jobs=await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',{owner,repo,run_id:Number(binding.run_id),attempt_number:1,per_page:100});
              const actual=jobs.map(job=>job.name).sort();
              if(JSON.stringify(actual)!==JSON.stringify([...expectedJobs].sort()) || jobs.some(job=>job.status!=='completed' || job.conclusion!=='success')) throw new Error(`${kind} job inventory differs`);
              const a=await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(binding.artifact_id)});
              if(a.data.name!==name || a.data.digest!==binding.artifact_digest || a.data.expired || a.data.workflow_run.id!==Number(binding.run_id)) throw new Error(`${kind} artifact differs`);
              return name;
            }
            if(!['phase-state','apply-receipt'].includes(value.current_state.kind)) throw new Error('current authority kind differs');
            const currentWorkflow=value.current_state.kind==='phase-state'?process.env.CANARY_WORKFLOW_PATH:process.env.APPLY_WORKFLOW_PATH;
            const currentPrefix=value.current_state.kind==='phase-state'?'production-phase-state':'production-phase-apply';
            const canaryJobs=['Authenticate exact change receipt authority','Exact production phase gate','Run content-free production and synthetic canaries'];
            const applyJobs=['Acquire exact production apply main lock','Apply exact production phase','Attest exact production apply main lock proof','Authenticate exact production apply authority','Exact production apply receipt gate','Prepare and attest exact production mutation intent','Prepare exact production apply pre-lock authority','Release exact production apply main lock'];
            const recoveryJobs=['Authenticate exact production recovery authority','Exact production recovery readiness gate','Observe exact production recovery state'];
            const currentJobs=value.current_state.kind==='phase-state'?canaryJobs:applyJobs;
            const currentName=await artifact(value.current_state,'current',currentWorkflow,`${currentPrefix}-${value.current_state.run_id}-1`,currentJobs);
            const targetName=await artifact(value.target_state,'target',process.env.CANARY_WORKFLOW_PATH,`production-phase-state-${value.target_state.run_id}-1`,canaryJobs);
            const recoveryName=await artifact(value.recovery,'recovery',process.env.RECOVERY_WORKFLOW_PATH,`production-recovery-readiness-${value.recovery.run_id}-1`,recoveryJobs);
            core.setOutput('current_kind',value.current_state.kind);
            core.setOutput('current_run_id',String(value.current_state.run_id)); core.setOutput('current_name',currentName);
            core.setOutput('target_run_id',String(value.target_state.run_id)); core.setOutput('target_name',targetName);
            core.setOutput('recovery_run_id',String(value.recovery.run_id)); core.setOutput('recovery_name',recoveryName);

  prelock:
    name: Prepare exact production rollback pre-lock authority
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-apply
    permissions:
      actions: read
      contents: read
    outputs:
      root_marker_name: ${{ steps.prepare.outputs.root_marker_name }}
      root_marker_sha256: ${{ steps.prepare.outputs.root_marker_sha256 }}
      rule_id: ${{ steps.prepare.outputs.rule_id }}
      rule_identity_sha256: ${{ steps.prepare.outputs.rule_identity_sha256 }}
      route_contract_sha256: ${{ steps.prepare.outputs.route_contract_sha256 }}
      root_marker_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      root_marker_artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false
      - name: Install pinned pre-lock authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]
      - name: Create exact durable rollback pre-lock marker
        id: prepare
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_PRODUCTION_BRANCH_READ_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_READ_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          TARGET_JSON: ${{ secrets.DO_PRODUCTION_TARGET_JSON }}
        run: |
          set -euo pipefail
          branch_read_token="$GH_PRODUCTION_BRANCH_READ_TOKEN"
          github_read_token="$GITHUB_READ_TOKEN"
          target_json="$TARGET_JSON"
          unset GH_PRODUCTION_BRANCH_READ_TOKEN GITHUB_READ_TOKEN TARGET_JSON GH_TOKEN GITHUB_TOKEN
          [[ -n "$branch_read_token" && -n "$github_read_token" && -n "$target_json" ]]
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          [[ "$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$CONTROL_SHA" ]]
          current="$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          "$jq_bin" -e --arg sha "$CONTROL_SHA" '.run_attempt == 1 and .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and (.status == "in_progress" or .status == "queued")' <<< "$current" > /dev/null
          repository_owner="$(cut -d/ -f1 <<< "$GITHUB_REPOSITORY")"
          repository_name="$(cut -d/ -f2- <<< "$GITHUB_REPOSITORY")"
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}} ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
          rule_json="$(GH_TOKEN="$branch_read_token" "$gh_bin" api graphql -f "query=$query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg sha "$CONTROL_SHA" '.data.repository.ref.target.oid == $sha and .data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .lockBranch == false and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$rule_json" > /dev/null
          rule_id="$("$jq_bin" -er '.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main") | .id' <<< "$rule_json")"
          RULE_ID="$rule_id" TARGET_DESCRIPTOR="$target_json" /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path.insert(0,'control/release/deployment')
          import verify_production_release as common
          target=common.validate_target_descriptor(common.loads_strict(os.environ.pop('TARGET_DESCRIPTOR')))
          route_hash=common.public_route_contract_sha256(target['default_ingress'])
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'rollback-main-lock.json'
          payload={'schema_version':1,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'control_sha':os.environ['CONTROL_SHA'],'rule_id':os.environ['RULE_ID'],'state':'acquire-intent'}
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|getattr(os,'O_NOFOLLOW',0),0o600)
          with os.fdopen(fd,'wb') as stream:
              stream.write(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()+b'\n')
              stream.flush(); os.fsync(stream.fileno())
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as stream:
              stream.write(f"root_marker_name=production-main-lock-rollback-{os.environ['GITHUB_RUN_ID']}-1\n")
              stream.write(f"root_marker_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}\n")
              stream.write(f"rule_id={os.environ['RULE_ID']}\n")
              stream.write(f"rule_identity_sha256={hashlib.sha256(os.environ['RULE_ID'].encode()).hexdigest()}\n")
              stream.write(f"route_contract_sha256={route_hash}\n")
          PY
          branch_read_token= github_read_token= target_json=
      - name: Upload durable rollback pre-lock marker
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prepare.outputs.root_marker_name }}
          path: ${{ runner.temp }}/rollback-main-lock.json
          if-no-files-found: error
          retention-days: 30
      - name: Canonicalize rollback pre-lock marker artifact digest
        id: digest
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact_digest=sha256:%s\n' "$RAW_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  intent:
    name: Prepare and attest exact production rollback mutation intent
    needs: [authority, prelock]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      intent_name: ${{ steps.prepare.outputs.intent_name }}
      intent_sha256: ${{ steps.prepare.outputs.intent_sha256 }}
      intent_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      intent_artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false
      - name: Download exact current authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.current_name }}
          path: ${{ runner.temp }}/current
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.current_run_id }}
      - name: Download exact target phase state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.target_name }}
          path: ${{ runner.temp }}/target-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.target_run_id }}
      - name: Download fresh recovery readiness
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.recovery_name }}
          path: ${{ runner.temp }}/recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.recovery_run_id }}
      - name: Download exact root rollback lock intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prelock.outputs.root_marker_artifact_id }}
          path: ${{ runner.temp }}/root-lock
      - name: Install pinned rollback intent authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]
      - name: Authenticate exact rollback inputs before signing intent
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          CURRENT_KIND: ${{ needs.authority.outputs.current_kind }}
          GH_TOKEN: ${{ github.token }}
          RAW: ${{ inputs.rollback_evidence_json }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B -c '
          import os,sys,pathlib
          sys.path.insert(0,"control/release/deployment")
          import verify_production_release as c, rollback_production_change as r
          v=c.loads_strict(os.environ["RAW"])
          if v.pop("control_sha",None)!=os.environ["CONTROL_SHA"]: c.fail("control SHA differs")
          r.validate_request(v)
          pathlib.Path(os.environ["RUNNER_TEMP"]+"/rollback-evidence.json").write_bytes(c.canonical_file_bytes(v))'
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          verify_subject() {
            local directory="$1" stem="$2" expected_sha="$3" signer_path="$4" predicate="$5" label="$6"
            local subject="$directory/$stem.json" sidecar="$directory/$stem.sha256"
            [[ "$(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort | wc -l)" -eq 2 ]]
            [[ -z "$(find "$directory" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
            [[ "$(cat "$sidecar")" == "$expected_sha" && "$(sha256sum "$subject" | awk '{print $1}')" == "$expected_sha" ]]
            flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$signer_path" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
            "$gh_bin" attestation verify "$subject" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/$label-provenance.json"
            "$gh_bin" attestation verify "$subject" "${flags[@]}" --predicate-type "$predicate" > "$RUNNER_TEMP/$label-policy.json"
            "$jq_bin" -e --slurpfile expected "$subject" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/$label-policy.json" > /dev/null
          }
          current_sha="$("$RUNNER_TEMP/release-tools/jq" -er '.current_state.sha256' "$RUNNER_TEMP/rollback-evidence.json")"
          if [[ "$CURRENT_KIND" == phase-state ]]; then
            verify_subject "$RUNNER_TEMP/current" production-phase-state "$current_sha" "$CANARY_WORKFLOW_PATH" https://rereply.app/attestations/production-phase-state/v1 current
          else
            verify_subject "$RUNNER_TEMP/current" production-phase-apply-receipt "$current_sha" "$APPLY_WORKFLOW_PATH" https://rereply.app/attestations/production-phase-apply-receipt/v1 current
          fi
          verify_subject "$RUNNER_TEMP/target-state" production-phase-state "$("$jq_bin" -er '.target_state.sha256' "$RUNNER_TEMP/rollback-evidence.json")" "$CANARY_WORKFLOW_PATH" https://rereply.app/attestations/production-phase-state/v1 target
          verify_subject "$RUNNER_TEMP/recovery" production-recovery-readiness "$("$jq_bin" -er '.recovery.sha256' "$RUNNER_TEMP/rollback-evidence.json")" "$RECOVERY_WORKFLOW_PATH" https://rereply.app/attestations/production-recovery-readiness/v1 recovery
      - name: Prepare exact sanitized rollback mutation intent without credentials
        id: prepare
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          CURRENT_KIND: ${{ needs.authority.outputs.current_kind }}
          LOCK_ARTIFACT_ID: ${{ needs.prelock.outputs.root_marker_artifact_id }}
          LOCK_ARTIFACT_DIGEST: ${{ needs.prelock.outputs.root_marker_artifact_digest }}
          LOCK_ARTIFACT_NAME: ${{ needs.prelock.outputs.root_marker_name }}
          LOCK_SHA256: ${{ needs.prelock.outputs.root_marker_sha256 }}
          RULE_ID: ${{ needs.prelock.outputs.rule_id }}
          RULE_IDENTITY_SHA256: ${{ needs.prelock.outputs.rule_identity_sha256 }}
          ROUTE_CONTRACT_SHA256: ${{ needs.prelock.outputs.route_contract_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_SHA" == "$CONTROL_SHA" ]]
          /usr/bin/python3 -I -S -B - <<'PY'
          import os,pathlib,sys
          sys.path.insert(0,'control/release/deployment')
          import verify_production_release as common
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          marker=root/'root-lock'/'rollback-main-lock.json'
          if common.sha256_bytes(marker.read_bytes())!=os.environ['LOCK_SHA256']: common.fail('root rollback lock marker hash differs')
