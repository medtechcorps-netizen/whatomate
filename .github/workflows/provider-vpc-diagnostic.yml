name: Provider VPC Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpc:
    runs-on: ubuntu-24.04
    environment: rereply-production-crm-fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Print VPC diagnostic
        env:
          DO_PRODUCTION_FIXTURE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_FIXTURE_READ_TOKEN }}
          PROVIDER_VPC_APP_ID: 54bc0d92-73e9-4f8b-86cd-c3fd96e06beb
          PROVIDER_VPC_DEFAULT_INGRESS: https://omnitech-3rilx.ondigitalocean.app
        run: |
          python3 -I -S -B release/deployment/provider_vpc_diagnostic.py
