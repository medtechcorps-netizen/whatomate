name: Validate Exact Release Source

run-name: Validate exact ${{ inputs.phase }} release source

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Immutable release phase to validate
        required: true
        type: choice
        options:
          - baseline
          - bridge
          - backend
          - ui

# This workflow validates source only. It has no deployment environment,
# repository secrets, package permissions, registry login, or cloud mutation.
permissions:
  contents: read

concurrency:
  # Every production-control workflow shares one non-cancelling lock. A later
  # phase must wait for the current phase instead of overlapping it.
  group: rereply-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source_identity:
    name: Resolve and verify exact source identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      phase: ${{ steps.select.outputs.phase }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      root_tree: ${{ steps.select.outputs.root_tree }}
      frontend_tree: ${{ steps.select.outputs.frontend_tree }}
      internal_tree: ${{ steps.select.outputs.internal_tree }}
      workflow_sha: ${{ steps.authority.outputs.workflow_sha }}
    steps:
      - name: Require dispatch from protected main
        id: authority
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          [[ "$REPOSITORY" == "medtechcorps-netizen/whatomate" ]]
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$DISPATCH_REF" == "refs/heads/main" ]]
          [[ "$REF_PROTECTED" == "true" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$WORKFLOW_REF" == "medtechcorps-netizen/whatomate/.github/workflows/validate-exact-release-source.yml@refs/heads/main" ]]
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

          printf 'workflow_sha=%s\n' "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Select an allowlisted immutable source
        id: select
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail

          case "$REQUESTED_PHASE" in
            baseline)
              source_sha="fe0fc9e4f5ad8f3f8b98af945a78a7239e848f33"
              root_tree="f43c28bd4c712d2f3a5610a567fdc358ced899c6"
              frontend_tree="3a05b5d1ab184bb1cd674d02e1bf14f834d266ae"
              internal_tree="f70860bcee374d507b7e6443f4f21df2855b217f"
              ;;
            bridge)
              source_sha="45334bf62943885291a73c55788d18001b191be9"
              root_tree="693cc853fa1e0ec5ec894884b9d7b88f61902222"
              frontend_tree="3a05b5d1ab184bb1cd674d02e1bf14f834d266ae"
              internal_tree="32763888c556305e8aee180183c92f36ddf5d195"
              ;;
            backend)
              source_sha="f90ae3b1713c76694680c0cb3b36114db1688f30"
              root_tree="1346a39805919f5a0d690200cd0f02fab3cbfba0"
              frontend_tree="3a05b5d1ab184bb1cd674d02e1bf14f834d266ae"
              internal_tree="494d3957ff3559375f406886be45646049ec9378"
              ;;
            ui)
              source_sha="c6e16810b8dec7d54305be47f7f7fc12430a1f0a"
              root_tree="2e300415c550f7fade95d16da8d1499ed3e0a5fd"
              frontend_tree="b9e93e27948ef2287b3f35bb38f6399b7f0a05c6"
              internal_tree="a1da97143c17f3d02e47250269d00f238ac0e38c"
              ;;
            *)
              echo "::error::The requested phase is not allowlisted."
              exit 1
              ;;
          esac

          {
            printf 'phase=%s\n' "$REQUESTED_PHASE"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'root_tree=%s\n' "$root_tree"
            printf 'frontend_tree=%s\n' "$frontend_tree"
            printf 'internal_tree=%s\n' "$internal_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact allowlisted commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.select.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed unless commit and trees match
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.select.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ steps.select.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ steps.select.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ steps.select.outputs.internal_tree }}
        run: |
          set -euo pipefail

          actual_source_sha="$(git rev-parse 'HEAD^{commit}')"
          actual_root_tree="$(git show -s --format=%T HEAD)"
          actual_frontend_tree="$(git rev-parse 'HEAD:frontend')"
          actual_internal_tree="$(git rev-parse 'HEAD:internal')"

          printf 'source=%s\nroot=%s\nfrontend=%s\ninternal=%s\n' \
            "$actual_source_sha" "$actual_root_tree" \
            "$actual_frontend_tree" "$actual_internal_tree"

          [[ "$actual_source_sha" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$actual_root_tree" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$actual_frontend_tree" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$actual_internal_tree" == "$EXPECTED_INTERNAL_TREE" ]]
          git diff --exit-code
          [[ -z "$(git status --porcelain)" ]]

  full_go:
    name: Full Go race and service tests (PostgreSQL 17)
    needs: source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatomate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:91d0f7e8c748ec7a4c2b4fb2c4f84edab794dd91d01e095e38dc906db9d684ab
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Download Go dependencies
        run: go mod download

      - name: Install pinned gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run full race and service test suite
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/whatomate_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          set -euo pipefail
          package_output="$(go list -mod=readonly ./...)"
          mapfile -t packages < <(printf '%s\n' "$package_output" | grep -v /test/)
          [[ "${#packages[@]}" -gt 0 ]]
          gotestsum \
            --format testname \
            --hide-summary=skipped \
            -- -mod=readonly -race -p 1 -timeout 40m -coverprofile=coverage.out "${packages[@]}"
          go tool cover -func=coverage.out | grep 'total:'
          git diff --exit-code -- go.mod go.sum

  bridge_pg14:
    name: Bridge compatibility contract (PostgreSQL 14)
    if: needs.source_identity.outputs.phase == 'bridge'
    needs: source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:14@sha256:2fdfb9b432d4a73bd3eea3d989752c1e669b68d502347e0bfd2cc6d709f3d6b4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatomate_bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Run the exact 12-test PostgreSQL 14 bridge selector
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/whatomate_bridge_test?sslmode=disable
        run: |
          set -euo pipefail

          selector='^(TestPlatformComplianceDatabaseWriteBarrier|TestPlatformComplianceAtomicBirthAndMonotonicIdentity|TestPlatformComplianceAtomicCreationIdempotenceRejectsDrift|TestPlatformComplianceGlobalDatabaseSeedsSkipPurposeOrganization|TestPlatformComplianceScanAuthorityRejectsPolicyGaps|TestRemoveTenantRLSPreservesPlatformComplianceBarrier|TestPlatformComplianceRemoveTenantRLSSerializesAtomicCreation|TestRemoveTenantRLSRejectsNestedAndRepeatableReadSnapshots|TestPlatformComplianceStartupVerificationAcceptsExactMessageCursorRolloutProfiles|TestPlatformComplianceStartupVerificationRejectsContractDrift|TestClassifyPlatformComplianceProductTriggerProfile|TestFutureMessageCursorTriggerContractMetadataIsExact)$'
          expected_tests=(
            TestClassifyPlatformComplianceProductTriggerProfile
            TestFutureMessageCursorTriggerContractMetadataIsExact
            TestPlatformComplianceDatabaseWriteBarrier
            TestPlatformComplianceAtomicBirthAndMonotonicIdentity
            TestPlatformComplianceAtomicCreationIdempotenceRejectsDrift
            TestPlatformComplianceGlobalDatabaseSeedsSkipPurposeOrganization
            TestPlatformComplianceScanAuthorityRejectsPolicyGaps
            TestRemoveTenantRLSPreservesPlatformComplianceBarrier
            TestPlatformComplianceRemoveTenantRLSSerializesAtomicCreation
            TestRemoveTenantRLSRejectsNestedAndRepeatableReadSnapshots
            TestPlatformComplianceStartupVerificationAcceptsExactMessageCursorRolloutProfiles
            TestPlatformComplianceStartupVerificationRejectsContractDrift
          )

          listed_tests="$(go test -mod=readonly ./internal/database -list "$selector")"
          mapfile -t selected_tests < <(printf '%s\n' "$listed_tests" | grep '^Test')
          [[ "${#selected_tests[@]}" -eq 12 ]]
          diff -u \
            <(printf '%s\n' "${expected_tests[@]}") \
            <(printf '%s\n' "${selected_tests[@]}")

          go test -mod=readonly -v ./internal/database -run "$selector" -count=1 -timeout 20m
          git diff --exit-code -- go.mod go.sum

  frontend:
    name: Frontend typecheck, unit tests, and build
    needs: source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out protected-main validation control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.workflow_sha }}
          path: validation-control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify control and product identities
        env:
          EXPECTED_WORKFLOW_SHA: ${{ needs.source_identity.outputs.workflow_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
        run: |
          set -euo pipefail

          control_dir="$GITHUB_WORKSPACE/validation-control"
          source_dir="$GITHUB_WORKSPACE/source"

          [[ "$(git -C "$control_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ -z "$(git -C "$control_dir" status --porcelain)" ]]

          [[ "$(git -C "$source_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git -C "$source_dir" show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -z "$(git -C "$source_dir" status --porcelain)" ]]

      - name: Apply audited test-only outcome-wait harness
        id: harness
        env:
          PHASE: ${{ needs.source_identity.outputs.phase }}
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          COMMON_PATCH_SHA256: 917868ced113fe03b0f93d5a0d2acbb9c75021f666517c80af2092a2e2fc2ab1
          COMMON_PATCH_RELATIVE_PATH: release/validation/patches/channels-view-webcrypto-waits.patch
          LEGACY_COMPLETION_PATCH_SHA256: 0df887022c760e9b108cf9cea5e936d1dbc2cd5bdec335c329970eb06d6daeb9
          LEGACY_COMPLETION_PATCH_RELATIVE_PATH: release/validation/patches/channels-view-webcrypto-completion-legacy.patch
          UI_COMPLETION_PATCH_SHA256: be427efad3c9b2deffdab3dbd51691cf8d79f212ecbdd3dc250449c271a00dd9
          UI_COMPLETION_PATCH_RELATIVE_PATH: release/validation/patches/channels-view-webcrypto-completion-ui.patch
          TEST_RELATIVE_PATH: frontend/src/views/channels/ChannelsView.test.ts
        run: |
          set -euo pipefail

          control_dir="$GITHUB_WORKSPACE/validation-control"
          source_dir="$GITHUB_WORKSPACE/source"
          common_patch_path="$control_dir/$COMMON_PATCH_RELATIVE_PATH"
          test_path="$source_dir/$TEST_RELATIVE_PATH"

          [[ "$(git -C "$source_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ -z "$(git -C "$source_dir" status --porcelain)" ]]
          [[ -f "$test_path" && ! -L "$test_path" ]]

          case "$PHASE" in
            baseline|bridge|backend)
              expected_original_blob="36a70caacdc068153b8a71e8c8747665f48acf33"
              expected_common_blob="ade1da3561942105ab376122e7dcb2f85f7c8f16"
              apply_common_patch="true"
              completion_patch_relative_path="$LEGACY_COMPLETION_PATCH_RELATIVE_PATH"
              completion_patch_sha256="$LEGACY_COMPLETION_PATCH_SHA256"
              expected_patched_blob="7d7dc8a0bfe5f94bf728dcc2a499c54872e0e39f"
              ;;
            ui)
              # The reviewed final source already contains the common
              # WebCrypto outcome-wait fix. Apply only the audited completion
              # harness and keep the product source otherwise immutable.
              expected_original_blob="906e09c8ebf43d4ba23fcd3caf856175c6ecc332"
              expected_common_blob="906e09c8ebf43d4ba23fcd3caf856175c6ecc332"
              apply_common_patch="false"
              completion_patch_relative_path="$UI_COMPLETION_PATCH_RELATIVE_PATH"
              completion_patch_sha256="$UI_COMPLETION_PATCH_SHA256"
              expected_patched_blob="f9ae2342e236274db62dc50e9acd19dba7e03f2f"
              ;;
            *)
              echo "::error::Resolved phase '$PHASE' is not allowlisted for the frontend harness."
              exit 1
              ;;
          esac

          completion_patch_path="$control_dir/$completion_patch_relative_path"
          git -C "$control_dir" ls-files --error-unmatch \
            "$COMMON_PATCH_RELATIVE_PATH" \
            "$completion_patch_relative_path" > /dev/null
          [[ -f "$common_patch_path" && ! -L "$common_patch_path" ]]
          [[ -f "$completion_patch_path" && ! -L "$completion_patch_path" ]]
          [[ "$(sha256sum "$common_patch_path" | awk '{print $1}')" == "$COMMON_PATCH_SHA256" ]]
          [[ "$(sha256sum "$completion_patch_path" | awk '{print $1}')" == "$completion_patch_sha256" ]]
          [[ "$(git -C "$source_dir" hash-object "$TEST_RELATIVE_PATH")" == "$expected_original_blob" ]]

          if [[ "$apply_common_patch" == "true" ]]; then
            git -C "$source_dir" apply --unidiff-zero --check --whitespace=error-all "$common_patch_path"
            git -C "$source_dir" apply --unidiff-zero --whitespace=error-all "$common_patch_path"
          else
            [[ "$apply_common_patch" == "false" ]]
          fi
          [[ "$(git -C "$source_dir" hash-object "$TEST_RELATIVE_PATH")" == "$expected_common_blob" ]]
          git -C "$source_dir" apply --unidiff-zero --check --whitespace=error-all "$completion_patch_path"
          git -C "$source_dir" apply --unidiff-zero --whitespace=error-all "$completion_patch_path"

          [[ -f "$test_path" && ! -L "$test_path" ]]
          git -C "$source_dir" diff HEAD --check --
          mapfile -t changed_paths < <(git -C "$source_dir" diff HEAD --name-only --)
          mapfile -t untracked_paths < <(git -C "$source_dir" ls-files --others --exclude-standard)
          [[ "${#changed_paths[@]}" -eq 1 ]]
          [[ "${changed_paths[0]}" == "$TEST_RELATIVE_PATH" ]]
          [[ "${#untracked_paths[@]}" -eq 0 ]]

          actual_patched_blob="$(git -C "$source_dir" hash-object "$TEST_RELATIVE_PATH")"
          [[ "$actual_patched_blob" == "$expected_patched_blob" ]]
          printf 'patched_blob=%s\n' "$actual_patched_blob" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install locked frontend dependencies
        working-directory: source/frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: source/frontend
        run: npm run typecheck

      - name: Prove outcome waits across delayed WebCrypto completion
        working-directory: source/frontend
        env:
          VITEST_LEGACY_REPLY_DIGEST_DELAY_MS: "25"
        run: |
          set -euo pipefail
          selector='reuses an unresolved WhatsApp attempt beyond fifteen minutes while the service window remains open|uses a new WhatsApp idempotency key after the conversation changes|reports a server without the fail-closed reply endpoint and never falls back|shows a service-window conflict from the authoritative endpoint'
          report="$(mktemp "$RUNNER_TEMP/webcrypto-waits.XXXXXX.json")"
          npx --no-install vitest run \
            src/views/channels/ChannelsView.test.ts \
            --reporter=json \
            --outputFile="$report" \
            -t "$selector"

          node - "$report" <<'NODE'
          const fs = require('node:fs')

          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const expected = new Set([
            'reuses an unresolved WhatsApp attempt beyond fifteen minutes while the service window remains open',
            'uses a new WhatsApp idempotency key after the conversation changes',
            'reports a server without the fail-closed reply endpoint and never falls back',
            'shows a service-window conflict from the authoritative endpoint',
          ])
          const assertions = report.testResults.flatMap(result => result.assertionResults ?? [])
          const executed = assertions.filter(result => result.status === 'passed' || result.status === 'failed')

          if (report.numPassedTests !== expected.size || report.numFailedTests !== 0) {
            throw new Error(`Expected ${expected.size} focused passes and zero failures; received ${report.numPassedTests} passes and ${report.numFailedTests} failures`)
          }
          if (executed.length !== expected.size) {
            throw new Error(`Expected exactly ${expected.size} executed focused tests; received ${executed.length}`)
          }
          for (const result of executed) {
            if (!expected.delete(result.title) || result.status !== 'passed') {
              throw new Error(`Unexpected focused result: ${result.title} (${result.status})`)
            }
          }
          if (expected.size !== 0) {
            throw new Error(`Focused tests were not executed: ${[...expected].join(', ')}`)
          }
          NODE

      - name: Run frontend unit tests
        working-directory: source/frontend
        run: npx --no-install vitest run src

      - name: Build frontend
        working-directory: source/frontend
        run: npm run build

      - name: Reverify test-only harness scope
        env:
          EXPECTED_WORKFLOW_SHA: ${{ needs.source_identity.outputs.workflow_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
          EXPECTED_PATCHED_BLOB: ${{ steps.harness.outputs.patched_blob }}
          TEST_RELATIVE_PATH: frontend/src/views/channels/ChannelsView.test.ts
        run: |
          set -euo pipefail

          control_dir="$GITHUB_WORKSPACE/validation-control"
          source_dir="$GITHUB_WORKSPACE/source"
          test_path="$source_dir/$TEST_RELATIVE_PATH"

          [[ "$(git -C "$control_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ -z "$(git -C "$control_dir" status --porcelain)" ]]

          [[ "$(git -C "$source_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git -C "$source_dir" show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -f "$test_path" && ! -L "$test_path" ]]

          mapfile -t changed_paths < <(git -C "$source_dir" diff HEAD --name-only --)
          mapfile -t untracked_paths < <(git -C "$source_dir" ls-files --others --exclude-standard)

          [[ "${#changed_paths[@]}" -eq 1 ]]
          [[ "${changed_paths[0]}" == "$TEST_RELATIVE_PATH" ]]
          [[ "${#untracked_paths[@]}" -eq 0 ]]
          [[ "$(git -C "$source_dir" hash-object "$TEST_RELATIVE_PATH")" == "$EXPECTED_PATCHED_BLOB" ]]
          git -C "$source_dir" diff HEAD --check --

  quality:
    name: Build, vet, lint, and dependency security
    needs: source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Build all Go packages
        run: go build -mod=readonly -v ./...

      - name: Vet all Go packages
        run: go vet -mod=readonly ./...

      - name: Run pinned golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.4
          skip-cache: true

      - name: Run pinned govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOFLAGS=-mod=readonly govulncheck ./...
          git diff --exit-code -- go.mod go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Audit locked frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high

  containers:
    name: Exact release container builds and Trivy scans
    needs: source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out protected-main validation control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.workflow_sha }}
          path: validation-control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify control, release packaging, and product identities
        env:
          EXPECTED_WORKFLOW_SHA: ${{ needs.source_identity.outputs.workflow_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
          WEB_DOCKERFILE_SHA256: f441cbd45867a32a509af11c246f2c4e6d81104db99b728d7ccd865c7f9ad381
          META_RELAY_DOCKERFILE_SHA256: 38a6dcceaa252750f4ffd016002687423f062b15d8b47f6478af2185b628eb25
          GMAIL_RELAY_DOCKERFILE_SHA256: f0c2ac09e585b3504123c1a5d336658dca5a52a0124a04aace202fb61a98a098
        run: |
          set -euo pipefail

          control_dir="$GITHUB_WORKSPACE/validation-control"
          source_dir="$GITHUB_WORKSPACE/source"

          [[ "$(git -C "$control_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ -z "$(git -C "$control_dir" status --porcelain)" ]]
          git -C "$control_dir" ls-files --error-unmatch release/exact-sources.json > /dev/null
          [[ "$(git -C "$control_dir" ls-files -s -- release/exact-sources.json | awk '{print $1}')" == "100644" ]]
          [[ -f "$control_dir/release/exact-sources.json" && ! -L "$control_dir/release/exact-sources.json" ]]

          [[ "$(git -C "$source_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git -C "$source_dir" show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -z "$(git -C "$source_dir" status --porcelain)" ]]

          while read -r path expected_sha; do
            git -C "$control_dir" ls-files --error-unmatch "$path" > /dev/null
            [[ "$(git -C "$control_dir" ls-files -s -- "$path" | awk '{print $1}')" == "100644" ]]
            [[ "$(git -C "$control_dir" cat-file -t "HEAD:$path")" == "blob" ]]
            [[ -f "$control_dir/$path" && ! -L "$control_dir/$path" ]]
            [[ "$(sha256sum "$control_dir/$path" | awk '{print $1}')" == "$expected_sha" ]]
          done <<EOF
          docker/release/web.Dockerfile $WEB_DOCKERFILE_SHA256
          docker/release/meta-relay.Dockerfile $META_RELAY_DOCKERFILE_SHA256
          docker/release/gmail-relay.Dockerfile $GMAIL_RELAY_DOCKERFILE_SHA256
          EOF

          jq -e \
            --arg web "$WEB_DOCKERFILE_SHA256" \
            --arg meta "$META_RELAY_DOCKERFILE_SHA256" \
            --arg gmail "$GMAIL_RELAY_DOCKERFILE_SHA256" '
              .schema_version == 1 and
              .repository == "medtechcorps-netizen/whatomate" and
              .release.platform == "linux/amd64" and
              .release.components.web.dockerfile == "docker/release/web.Dockerfile" and
              .release.components.web.dockerfile_sha256 == $web and
              .release.components["meta-relay"].dockerfile == "docker/release/meta-relay.Dockerfile" and
              .release.components["meta-relay"].dockerfile_sha256 == $meta and
              .release.components["gmail-relay"].dockerfile == "docker/release/gmail-relay.Dockerfile" and
              .release.components["gmail-relay"].dockerfile_sha256 == $gmail and
              (.release.materials.scratch_stages | sort_by(.dockerfile)) == [
                {dockerfile: "docker/release/gmail-relay.Dockerfile", stage: null},
                {dockerfile: "docker/release/meta-relay.Dockerfile", stage: null}
              ]
            ' "$control_dir/release/exact-sources.json" > /dev/null

          [[ "$(tail -n +1 "$control_dir/docker/release/meta-relay.Dockerfile" | grep -c '^FROM scratch$')" -eq 1 ]]
          [[ "$(tail -n +1 "$control_dir/docker/release/gmail-relay.Dockerfile" | grep -c '^FROM scratch$')" -eq 1 ]]

      - name: Build exact web release container locally
        run: |
          docker build --platform linux/amd64 \
            -f "$GITHUB_WORKSPACE/validation-control/docker/release/web.Dockerfile" \
            -t rereply:exact-validation \
            "$GITHUB_WORKSPACE/source"

      - name: Build exact Meta relay scratch release container locally
        run: |
          docker build --platform linux/amd64 \
            -f "$GITHUB_WORKSPACE/validation-control/docker/release/meta-relay.Dockerfile" \
            -t rereply-meta-relay:exact-validation \
            "$GITHUB_WORKSPACE/source"

      - name: Build exact Gmail relay scratch release container locally
        run: |
          docker build --platform linux/amd64 \
            -f "$GITHUB_WORKSPACE/validation-control/docker/release/gmail-relay.Dockerfile" \
            -t rereply-gmail-relay:exact-validation \
            "$GITHUB_WORKSPACE/source"

      - name: Scan exact web release container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply:exact-validation
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.70.0
          cache: false

      - name: Scan exact Meta relay scratch release container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply-meta-relay:exact-validation
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.70.0
          cache: false

      - name: Scan exact Gmail relay scratch release container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply-gmail-relay:exact-validation
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.70.0
          cache: false

      - name: Reverify immutable build inputs
        env:
          EXPECTED_WORKFLOW_SHA: ${{ needs.source_identity.outputs.workflow_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
        run: |
          set -euo pipefail
          control_dir="$GITHUB_WORKSPACE/validation-control"
          source_dir="$GITHUB_WORKSPACE/source"

          [[ "$(git -C "$control_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ -z "$(git -C "$control_dir" status --porcelain)" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git -C "$source_dir" show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -z "$(git -C "$source_dir" status --porcelain)" ]]

  e2e_shard:
    name: PostgreSQL 17 E2E shard ${{ matrix.shard }}
    needs: source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_DB: whatomate_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:91d0f7e8c748ec7a4c2b4fb2c4f84edab794dd91d01e095e38dc906db9d684ab
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source_identity.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.source_identity.outputs.source_sha }}
          EXPECTED_ROOT_TREE: ${{ needs.source_identity.outputs.root_tree }}
          EXPECTED_FRONTEND_TREE: ${{ needs.source_identity.outputs.frontend_tree }}
          EXPECTED_INTERNAL_TREE: ${{ needs.source_identity.outputs.internal_tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$EXPECTED_ROOT_TREE" ]]
          [[ "$(git rev-parse 'HEAD:frontend')" == "$EXPECTED_FRONTEND_TREE" ]]
          [[ "$(git rev-parse 'HEAD:internal')" == "$EXPECTED_INTERNAL_TREE" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Create test config
        run: |
          set -euo pipefail
          cat > config.toml << 'EOF'
          [app]
          name = "ReReply"
          environment = "test"
          debug = true
          # CI-only deterministic fixture key for this disposable test database.
          encryption_key = "synthetic-e2e-key-not-for-production" # gitleaks:allow

          [server]
          host = "0.0.0.0"
          port = 8080
          read_timeout = 30
          write_timeout = 30
          base_path = ""

          [database]
          host = "localhost"
          port = 5432
          user = "test"
          password = "test"
          name = "whatomate_test"
          ssl_mode = "disable"
          max_open_conns = 25
          max_idle_conns = 5
          conn_max_lifetime = 300

          [redis]
          host = "localhost"
          port = 6379
          username = ""
          password = ""
          db = 0
          tls = false

          [jwt]
          secret = "test-secret-key-for-ci"
          access_expiry_mins = 60
          refresh_expiry_days = 7

          [storage]
          type = "local"
          local_path = "./uploads"

          [whatsapp]
          base_url = "http://127.0.0.1:9"
          EOF

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend to embed directory
        run: |
          set -euo pipefail
          rm -rf internal/frontend/dist/*
          cp -r frontend/dist/* internal/frontend/dist/

      - name: Build backend
        run: |
          set -euo pipefail
          go build -mod=readonly -o rereply ./cmd/whatomate
          git diff --exit-code -- go.mod go.sum

      - name: Start backend with migrations
        env:
          WHATOMATE_CONFIG: config.toml
        run: |
          set -euo pipefail
          ./rereply server -migrate > backend.log 2>&1 &
          backend_pid=$!

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 5 http://localhost:8080/ready > /dev/null; then
              echo "Backend became ready after $((attempt * 2)) seconds"
              exit 0
            fi

            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "Backend exited before becoming ready"
              cat backend.log
              exit 1
            fi

            sleep 2
          done

          echo "Backend did not become ready within 180 seconds"
          cat backend.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/whatomate_test
          E2E_SEED_WHATSAPP_ACCOUNTS: "1"
          CI: true
          E2E_SHARD: ${{ matrix.shard }}
        run: npm run test:e2e -- --shard="${E2E_SHARD}/4"

      - name: Require backend readiness after E2E
        run: curl --fail --silent --show-error --max-time 10 http://localhost:8080/ready > /dev/null

      - name: Print backend log after failure
        if: failure()
        run: tail -n 400 backend.log || true

  gate:
    name: Exact source validation gate
    if: always()
    needs:
      - source_identity
      - full_go
      - bridge_pg14
      - frontend
      - quality
      - containers
      - e2e_shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation to pass
        env:
          PHASE: ${{ needs.source_identity.outputs.phase }}
          SOURCE_IDENTITY_RESULT: ${{ needs.source_identity.result }}
          VALIDATION_WORKFLOW_SHA: ${{ needs.source_identity.outputs.workflow_sha }}
          FULL_GO_RESULT: ${{ needs.full_go.result }}
          BRIDGE_PG14_RESULT: ${{ needs.bridge_pg14.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          E2E_RESULT: ${{ needs.e2e_shard.result }}
        run: |
          set -euo pipefail
          failures=0

          require_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$label result was '$result'; expected 'success'."
              failures=1
            fi
          }

          require_success "source identity" "$SOURCE_IDENTITY_RESULT"
          if [[ ! "$VALIDATION_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Protected-main workflow SHA is missing or malformed."
            failures=1
          fi
          require_success "full Go" "$FULL_GO_RESULT"
          require_success "frontend" "$FRONTEND_RESULT"
          require_success "quality" "$QUALITY_RESULT"
          require_success "containers" "$CONTAINERS_RESULT"
          require_success "E2E" "$E2E_RESULT"

          case "$PHASE" in
            bridge)
              require_success "PostgreSQL 14 bridge" "$BRIDGE_PG14_RESULT"
              ;;
            baseline|backend|ui)
              if [[ "$BRIDGE_PG14_RESULT" != "skipped" ]]; then
                echo "::error::PostgreSQL 14 bridge result was '$BRIDGE_PG14_RESULT'; expected 'skipped' for $PHASE."
                failures=1
              fi
              ;;
            *)
              echo "::error::Resolved phase '$PHASE' is not allowlisted."
              failures=1
              ;;
          esac

          if [[ "$failures" -ne 0 ]]; then
            exit 1
          fi

          echo "All validation gates passed for exact phase '$PHASE'."
