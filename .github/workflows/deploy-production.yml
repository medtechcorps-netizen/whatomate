name: Production Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production

    steps:
      - name: Wait for protected-main checks
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: test lint build security e2e tenant-isolation
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))

          while (( SECONDS < deadline )); do
            check_runs="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100"
            )"
            pending=()

            for check_name in ${REQUIRED_CHECKS}; do
              conclusion="$(
                jq -r --arg name "${check_name}" \
                  '[.check_runs[] | select(.name == $name)] |
                   sort_by(.started_at // .created_at) |
                   last |
                   .conclusion // empty' \
                  <<<"${check_runs}"
              )"

              case "${conclusion}" in
                success)
                  ;;
                failure|cancelled|timed_out|action_required|stale)
                  echo "Required check ${check_name} concluded ${conclusion}."
                  exit 1
                  ;;
                *)
                  pending+=("${check_name}")
                  ;;
              esac
            done

            if (( ${#pending[@]} == 0 )); then
              echo "All protected-main checks passed for ${GITHUB_SHA}."
              exit 0
            fi

            echo "Waiting for: ${pending[*]}"
            sleep 15
          done

          echo "Timed out waiting for protected-main checks."
          exit 1

      - name: Checkout protected revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Verify protected Meta relay inventory before deployment
        env:
          META_RELAY_EXPECTED_ACCOUNTS_JSON: ${{ vars.META_RELAY_EXPECTED_ACCOUNTS_JSON }}
        run: |
          set -euo pipefail
          app_id="54bc0d92-73e9-4f8b-86cd-c3fd96e06beb"
          app_spec="$(doctl apps spec get "${app_id}" --format json)"
          if ! jq -e 'any(.services[]?; .name == "meta-relay")' <<<"${app_spec}" >/dev/null; then
            if [[ -n "${META_RELAY_EXPECTED_ACCOUNTS_JSON}" ]]; then
              echo "::error::Protected Meta relay inventory exists, but the meta-relay service is missing."
              exit 1
            fi
            echo "meta-relay is not provisioned and no protected inventory exists; skipping structural preflight"
            exit 0
          fi
          if [[ -z "${META_RELAY_EXPECTED_ACCOUNTS_JSON}" ]]; then
            echo "::error::Production variable META_RELAY_EXPECTED_ACCOUNTS_JSON is required when meta-relay is provisioned."
            exit 1
          fi
          python3 scripts/meta_relay_preflight.py --validate-only <<<"${app_spec}"

      - name: Ensure production runtime RLS scope
        run: |
          set -euo pipefail
          app_id="54bc0d92-73e9-4f8b-86cd-c3fd96e06beb"
          repository="https://github.com/medtechcorps-netizen/whatomate.git"
          service_name="omnitech-web"
          rls_key="WHATOMATE_DATABASE__RLS_ENABLED"
          app_spec="$(
            doctl apps spec get \
              "${app_id}" \
              --format json
          )"

          if jq -e \
            --arg repository "${repository}" \
            --arg service_name "${service_name}" \
            --arg rls_key "${rls_key}" '
            (.services // [])
            | map(select(
                .name == $service_name
                and .git.repo_clone_url == $repository
              )) as $runtime
            | ($runtime | length) == 1
              and all(
                $runtime[];
                any(.envs[]?; .key == $rls_key and .value == "true")
              )
          ' <<<"${app_spec}" >/dev/null; then
            echo "Production runtime RLS scope is already enabled."
            exit 0
          fi

          jq \
            --arg repository "${repository}" \
            --arg service_name "${service_name}" \
            --arg rls_key "${rls_key}" '
            def enable_rls:
              .envs = (
                ((.envs // []) | map(select(.key != $rls_key)))
                + [{
                    key: $rls_key,
                    value: "true",
                    scope: "RUN_TIME",
                    type: "GENERAL"
                  }]
              );
            .services = (
              (.services // [])
              | map(
                  if .name == $service_name
                    and .git.repo_clone_url == $repository
                  then enable_rls
                  else .
                  end
                )
            )
          ' <<<"${app_spec}" > production-app-spec.json

          jq -e \
            --arg repository "${repository}" \
            --arg service_name "${service_name}" \
            --arg rls_key "${rls_key}" '
            (.services // [])
            | map(select(
                .name == $service_name
                and .git.repo_clone_url == $repository
              )) as $runtime
            | ($runtime | length) == 1
              and all(
                $runtime[];
                any(.envs[]?; .key == $rls_key and .value == "true")
              )
          ' production-app-spec.json >/dev/null

          doctl apps update \
            "${app_id}" \
            --spec production-app-spec.json \
            --update-sources \
            --wait

      - name: Verify production RLS migration gate
        run: |
          set -euo pipefail
          app_spec="$(
            doctl apps spec get \
              54bc0d92-73e9-4f8b-86cd-c3fd96e06beb \
              --format json
          )"
          jq -e '
            any(
              .jobs[]?;
              .name == "rereply-rls-migrate"
              and .kind == "PRE_DEPLOY"
              and .git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
              and .git.branch == "main"
              and .dockerfile_path == "docker/Dockerfile"
              and (.run_command | contains("rereply rls-migrate"))
              and any(.envs[]?; .key == "WHATOMATE_DATABASE__MIGRATION_URL")
              and any(.envs[]?; .key == "WHATOMATE_DATABASE__RUNTIME_ROLE")
            )
            and (
              (.services // [])
              | map(select(
                  .name == "omnitech-web"
                  and .git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
                )) as $runtime
              | ($runtime | length) == 1
                and all(
                  $runtime[];
                  any(
                    .envs[]?;
                    .key == "WHATOMATE_DATABASE__RLS_ENABLED"
                    and .value == "true"
                  )
                )
            )
          ' <<<"${app_spec}" >/dev/null

      - name: Deploy protected main
        run: |
          doctl apps create-deployment \
            54bc0d92-73e9-4f8b-86cd-c3fd96e06beb \
            --force-rebuild \
            --wait

      - name: Verify production readiness
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://app.rereply.app/ready

      - name: Verify Meta relay readiness
        run: |
          set -euo pipefail
          app_id="54bc0d92-73e9-4f8b-86cd-c3fd96e06beb"
          if ! doctl apps spec get "${app_id}" --format json \
            | jq -e 'any(.services[]?; .name == "meta-relay")' >/dev/null; then
            echo "meta-relay is not provisioned yet; skipping its readiness check"
            exit 0
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://app.rereply.app/meta-relay/readyz

      - name: Verify Meta relay mappings and account bindings
        env:
          META_RELAY_EXPECTED_ACCOUNTS_JSON: ${{ vars.META_RELAY_EXPECTED_ACCOUNTS_JSON }}
          META_RELAY_PREFLIGHT_SECRETS_JSON: ${{ secrets.META_RELAY_PREFLIGHT_SECRETS_JSON }}
        run: |
          set -euo pipefail
          app_id="54bc0d92-73e9-4f8b-86cd-c3fd96e06beb"
          app_spec="$(doctl apps spec get "${app_id}" --format json)"
          if ! jq -e 'any(.services[]?; .name == "meta-relay")' <<<"${app_spec}" >/dev/null; then
            if [[ -n "${META_RELAY_EXPECTED_ACCOUNTS_JSON}" ]]; then
              echo "::error::Protected Meta relay inventory exists, but the deployed meta-relay service is missing."
              exit 1
            fi
            echo "meta-relay is not provisioned yet; skipping its account preflight"
            exit 0
          fi
          if [[ -z "${META_RELAY_EXPECTED_ACCOUNTS_JSON}" ]]; then
            echo "::error::Production variable META_RELAY_EXPECTED_ACCOUNTS_JSON is required when meta-relay is provisioned."
            exit 1
          fi
          if [[ -z "${META_RELAY_PREFLIGHT_SECRETS_JSON}" ]]; then
            echo "::error::Production secret META_RELAY_PREFLIGHT_SECRETS_JSON is required when meta-relay is provisioned."
            exit 1
          fi
          python3 scripts/meta_relay_preflight.py <<<"${app_spec}"

      - name: Verify Gmail relay readiness
        run: |
          app_id="54bc0d92-73e9-4f8b-86cd-c3fd96e06beb"
          if ! doctl apps spec get "${app_id}" --format json \
            | jq -e 'any(.services[]?; .name == "gmail-relay")' >/dev/null; then
            echo "gmail-relay is not provisioned yet; skipping its readiness check"
            exit 0
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://app.rereply.app/gmail-relay/readyz
