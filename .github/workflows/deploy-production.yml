name: Production Deploy - Disabled Safety Gate

on:
  workflow_dispatch:

# Production deployment is intentionally disabled while the immutable candidate,
# recovery, rollback, and protected-environment gates are installed and verified.
# This workflow contains no deployment credentials or mutation commands and always
# fails closed when manually dispatched.
permissions:
  contents: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

jobs:
  deployment-disabled:
    name: production-deployment-disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse production mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Production deployment is disabled pending the reviewed recovery and rollback release gate."
          exit 1
