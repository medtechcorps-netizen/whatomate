name: Production Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production

    steps:
      - name: Wait for protected-main checks
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: test lint build security e2e tenant-isolation
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))

          while (( SECONDS < deadline )); do
            check_runs="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100"
            )"
            pending=()

            for check_name in ${REQUIRED_CHECKS}; do
              conclusion="$(
                jq -r --arg name "${check_name}" \
                  '[.check_runs[] | select(.name == $name)] |
                   sort_by(.started_at // .created_at) |
                   last |
                   .conclusion // empty' \
                  <<<"${check_runs}"
              )"

              case "${conclusion}" in
                success)
                  ;;
                failure|cancelled|timed_out|action_required|stale)
                  echo "Required check ${check_name} concluded ${conclusion}."
                  exit 1
                  ;;
                *)
                  pending+=("${check_name}")
                  ;;
              esac
            done

            if (( ${#pending[@]} == 0 )); then
              echo "All protected-main checks passed for ${GITHUB_SHA}."
              exit 0
            fi

            echo "Waiting for: ${pending[*]}"
            sleep 15
          done

          echo "Timed out waiting for protected-main checks."
          exit 1

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.167.0

      - name: Reject nonstandard production migration jobs
        run: |
          set -euo pipefail
          app_spec="$(
            doctl apps spec get \
              54bc0d92-73e9-4f8b-86cd-c3fd96e06beb \
              --format json
          )"
          jq -e '
            (.jobs // []) as $jobs
            | (.services // []) as $services
            | ((.envs // []) | length) == 0
              and (((.workers // []) | length) == 0)
              and (((.static_sites // []) | length) == 0)
              and (((.functions // []) | length) == 0)
              and (($services | map(.name) | sort) == ["gmail-relay", "meta-relay", "omnitech-web"])
              and all($services[]; (.git.deploy_on_push // false) == false)
              and any($services[];
                .name == "omnitech-web"
                and .git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
                and .git.branch == "main"
                and .dockerfile_path == "docker/Dockerfile"
              )
              and any($services[];
                .name == "meta-relay"
                and .git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
                and .git.branch == "main"
                and .dockerfile_path == "docker/meta-relay.Dockerfile"
              )
              and any($services[];
                .name == "gmail-relay"
                and .git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
                and .git.branch == "main"
                and .dockerfile_path == "docker/gmail-relay.Dockerfile"
              )
              and ($jobs | length) == 1
              and $jobs[0].name == "rereply-rls-migrate"
              and $jobs[0].kind == "PRE_DEPLOY"
              and $jobs[0].git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
              and $jobs[0].git.branch == "main"
              and $jobs[0].dockerfile_path == "docker/Dockerfile"
              and ($jobs[0].git.deploy_on_push // false) == false
              and $jobs[0].run_command == "./rereply rls-migrate -config config.toml"
              and (($jobs[0].envs | map(.key) | sort) == [
                "WHATOMATE_DATABASE__MIGRATION_URL",
                "WHATOMATE_DATABASE__RUNTIME_ROLE"
              ])
              and any(
                $jobs[0].envs[];
                .key == "WHATOMATE_DATABASE__MIGRATION_URL"
                and .scope == "RUN_TIME"
                and .type == "SECRET"
                and (.value | startswith("EV["))
              )
              and any(
                $jobs[0].envs[];
                .key == "WHATOMATE_DATABASE__RUNTIME_ROLE"
                and .value == "rereply_app"
              )
          ' <<<"${app_spec}" >/dev/null

      - name: Ensure production runtime RLS scope
        run: |
          set -euo pipefail
          app_id="54bc0d92-73e9-4f8b-86cd-c3fd96e06beb"
          repository="https://github.com/medtechcorps-netizen/whatomate.git"
          service_name="omnitech-web"
          rls_key="WHATOMATE_DATABASE__RLS_ENABLED"
          app_spec="$(
            doctl apps spec get \
              "${app_id}" \
              --format json
          )"

          if jq -e \
            --arg repository "${repository}" \
            --arg service_name "${service_name}" \
            --arg rls_key "${rls_key}" '
            (.services // [])
            | map(select(
                .name == $service_name
                and .git.repo_clone_url == $repository
              )) as $runtime
            | ($runtime | length) == 1
              and all(
                $runtime[];
                any(.envs[]?; .key == $rls_key and .value == "true")
              )
          ' <<<"${app_spec}" >/dev/null; then
            echo "Production runtime RLS scope is already enabled."
            exit 0
          fi

          jq \
            --arg repository "${repository}" \
            --arg service_name "${service_name}" \
            --arg rls_key "${rls_key}" '
            def enable_rls:
              .envs = (
                ((.envs // []) | map(select(.key != $rls_key)))
                + [{
                    key: $rls_key,
                    value: "true",
                    scope: "RUN_TIME",
                    type: "GENERAL"
                  }]
              );
            .services = (
              (.services // [])
              | map(
                  if .name == $service_name
                    and .git.repo_clone_url == $repository
                  then enable_rls
                  else .
                  end
                )
            )
          ' <<<"${app_spec}" > production-app-spec.json

          jq -e \
            --arg repository "${repository}" \
            --arg service_name "${service_name}" \
            --arg rls_key "${rls_key}" '
            (.services // [])
            | map(select(
                .name == $service_name
                and .git.repo_clone_url == $repository
              )) as $runtime
            | ($runtime | length) == 1
              and all(
                $runtime[];
                any(.envs[]?; .key == $rls_key and .value == "true")
              )
          ' production-app-spec.json >/dev/null

          doctl apps update \
            "${app_id}" \
            --spec production-app-spec.json \
            --update-sources \
            --wait

      - name: Verify production RLS migration gate
        run: |
          set -euo pipefail
          app_spec="$(
            doctl apps spec get \
              54bc0d92-73e9-4f8b-86cd-c3fd96e06beb \
              --format json
          )"
          jq -e '
            any(
              .jobs[]?;
              .name == "rereply-rls-migrate"
              and .kind == "PRE_DEPLOY"
              and .git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
              and .git.branch == "main"
              and .dockerfile_path == "docker/Dockerfile"
              and .run_command == "./rereply rls-migrate -config config.toml"
              and ((.envs | map(.key) | sort) == [
                "WHATOMATE_DATABASE__MIGRATION_URL",
                "WHATOMATE_DATABASE__RUNTIME_ROLE"
              ])
              and any(
                .envs[]?;
                .key == "WHATOMATE_DATABASE__MIGRATION_URL"
                and .scope == "RUN_TIME"
                and .type == "SECRET"
                and (.value | startswith("EV["))
              )
              and any(
                .envs[]?;
                .key == "WHATOMATE_DATABASE__RUNTIME_ROLE"
                and .value == "rereply_app"
              )
            )
            and (
              (.services // [])
              | map(select(
                  .name == "omnitech-web"
                  and .git.repo_clone_url == "https://github.com/medtechcorps-netizen/whatomate.git"
                )) as $runtime
              | ($runtime | length) == 1
                and all(
                  $runtime[];
                  any(
                    .envs[]?;
                    .key == "WHATOMATE_DATABASE__RLS_ENABLED"
                    and .value == "true"
                  )
                )
            )
          ' <<<"${app_spec}" >/dev/null

      - name: Deploy protected main
        run: |
          doctl apps create-deployment \
            54bc0d92-73e9-4f8b-86cd-c3fd96e06beb \
            --force-rebuild \
            --wait

      - name: Verify production readiness
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://app.rereply.app/ready

      - name: Verify Gmail relay readiness
        run: |
          app_id="54bc0d92-73e9-4f8b-86cd-c3fd96e06beb"
          if ! doctl apps spec get "${app_id}" --format json \
            | jq -e 'any(.services[]?; .name == "gmail-relay")' >/dev/null; then
            echo "gmail-relay is not provisioned yet; skipping its readiness check"
            exit 0
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://app.rereply.app/gmail-relay/readyz
