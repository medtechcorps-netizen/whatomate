name: Prepare Production Valkey Recovery Fork

run-name: Prepare exact ${{ inputs.phase }} Valkey recovery fork

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact rollout phase whose provider-native recovery fork is prepared
        required: true
        type: choice
        options:
          - baseline
          - bridge
          - backend
          - ui
      rollout_evidence_json:
        description: Exact successful rollout capsule run/artifact authority
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_REPOSITORY: medtechcorps-netizen/whatomate
  WORKFLOW_PATH: .github/workflows/prepare-production-valkey-recovery-fork.yml
  ROLLOUT_WORKFLOW_PATH: .github/workflows/aggregate-exact-four-phase-rollout.yml
  ROLLOUT_VERIFIER_PATH: release/deployment/verify_rollout_evidence.py
  ROLLOUT_CONTRACT_PATH: release/deployment/exact-rollout-contract.json
  ROLLOUT_SCHEMA_PATH: release/deployment/rollout-plan.schema.json
  SOURCE_MANIFEST_PATH: release/exact-sources.json
  PRODUCTION_CONTRACT_PATH: release/deployment/production-app-contract.json
  CONTROLLER_PATH: release/deployment/provider_native_valkey_recovery.py
  INTENT_PREDICATE: https://rereply.app/attestations/production-valkey-recovery-fork-create-intent/v2
  RECEIPT_PREDICATE: https://rereply.app/attestations/production-valkey-recovery-fork-create-receipt/v2
  ROLLOUT_PREDICATE: https://rereply.app/attestations/exact-four-phase-rollout/v1
  PINNED_JQ_VERSION: "1.8.2"
  PINNED_JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
  PINNED_JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
  PINNED_GH_VERSION: "2.98.0"
  PINNED_GH_URL: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
  PINNED_GH_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de

jobs:
  authority:
    name: Authenticate exact production Valkey recovery fork authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      control_sha: ${{ steps.guard.outputs.control_sha }}
      phase: ${{ steps.github.outputs.phase }}
      rollout_run_id: ${{ steps.github.outputs.rollout_run_id }}
      rollout_run_attempt: ${{ steps.github.outputs.rollout_run_attempt }}
      capsule_artifact_id: ${{ steps.github.outputs.capsule_artifact_id }}
      capsule_artifact_name: ${{ steps.github.outputs.capsule_artifact_name }}
      capsule_artifact_digest: ${{ steps.github.outputs.capsule_artifact_digest }}
      rollout_plan_sha256: ${{ steps.github.outputs.rollout_plan_sha256 }}
    steps:
      - name: Require exact protected-main attempt-one authority
        id: guard
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch ]]
          [[ "$REPOSITORY" == "$RELEASE_REPOSITORY" ]]
          [[ "$DISPATCH_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$RUN_ATTEMPT" == 1 && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$WORKFLOW_REF" == "$RELEASE_REPOSITORY/$WORKFLOW_PATH@refs/heads/main" ]]
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'control_sha=%s\n' "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.guard.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Authenticate exact successful rollout capsule
        id: github
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ steps.guard.outputs.control_sha }}
          PHASE: ${{ inputs.phase }}
          RAW: ${{ inputs.rollout_evidence_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const value = JSON.parse(process.env.RAW);
            const expected = ['capsule_artifact_digest','capsule_artifact_id','control_sha','rollout_plan_sha256','rollout_run_attempt','rollout_run_id'];
            if (JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(expected)) throw new Error('rollout descriptor keys differ');
            if (value.control_sha !== process.env.CONTROL_SHA || !/^[0-9a-f]{64}$/.test(value.rollout_plan_sha256)) throw new Error('rollout descriptor authority differs');
            if (value.rollout_run_attempt !== 1 || !/^[1-9][0-9]{0,14}$/.test(String(value.rollout_run_id)) || !/^[1-9][0-9]{0,14}$/.test(String(value.capsule_artifact_id)) || !/^sha256:[0-9a-f]{64}$/.test(value.capsule_artifact_digest)) throw new Error('rollout descriptor format differs');
            if (!['baseline','bridge','backend','ui'].includes(process.env.PHASE)) throw new Error('rollout phase differs');
            const {owner, repo} = context.repo;
            const main = await github.rest.git.getRef({owner, repo, ref:'heads/main'});
            if (main.data.object.sha !== process.env.CONTROL_SHA) throw new Error('main changed');
            const latest = await github.rest.actions.getWorkflowRun({owner, repo, run_id:Number(value.rollout_run_id)});
            const exact = await github.rest.actions.getWorkflowRunAttempt({owner, repo, run_id:Number(value.rollout_run_id), attempt_number:1});
            for (const run of [latest.data, exact.data]) {
              if (run.run_attempt !== 1 || run.head_sha !== process.env.CONTROL_SHA || run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.status !== 'completed' || run.conclusion !== 'success' || run.path !== process.env.ROLLOUT_WORKFLOW_PATH || run.display_title !== 'Assemble exact four-phase rollout authority') throw new Error('rollout run authority differs');
            }
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/1/jobs',{owner,repo,run_id:Number(value.rollout_run_id),per_page:100});
            const expectedJobs = ['Assemble and sign exact rollout capsule','Exact four-phase rollout authority gate','Independently verify exact rollout capsule'];
            if (JSON.stringify(jobs.map(job=>job.name).sort()) !== JSON.stringify(expectedJobs.sort()) || jobs.some(job=>job.status!=='completed' || job.conclusion!=='success' || job.run_attempt!==1)) throw new Error('rollout job inventory differs');
            const list = await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:Number(value.rollout_run_id),per_page:100});
            const name = `exact-four-phase-rollout-${value.rollout_run_id}-1`;
            if (list.data.total_count !== 1 || list.data.artifacts.length !== 1) throw new Error('rollout artifact inventory differs');
            const artifact = await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(value.capsule_artifact_id)});
            if (artifact.data.name !== name || artifact.data.digest !== value.capsule_artifact_digest || artifact.data.expired || artifact.data.size_in_bytes <= 0 || artifact.data.size_in_bytes > 67108864 || artifact.data.workflow_run.id !== Number(value.rollout_run_id) || artifact.data.workflow_run.head_sha !== process.env.CONTROL_SHA || artifact.data.workflow_run.head_branch !== 'main') throw new Error('rollout artifact authority differs');
            core.setOutput('phase', process.env.PHASE);
            core.setOutput('rollout_run_id', String(value.rollout_run_id));
            core.setOutput('rollout_run_attempt', '1');
            core.setOutput('capsule_artifact_id', String(value.capsule_artifact_id));
            core.setOutput('capsule_artifact_name', name);
            core.setOutput('capsule_artifact_digest', value.capsule_artifact_digest);
            core.setOutput('rollout_plan_sha256', value.rollout_plan_sha256);

      - name: Download exact rollout capsule
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.github.outputs.capsule_artifact_id }}
          path: ${{ runner.temp }}/rollout-capsule
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.github.outputs.rollout_run_id }}

      - name: Install pinned evidence tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/recovery-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]

      - name: Independently verify exact capsule and target phase
        env:
          CONTROL_SHA: ${{ steps.guard.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ steps.github.outputs.phase }}
          ROLLOUT_PLAN_SHA256: ${{ steps.github.outputs.rollout_plan_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rollout-capsule"
          [[ "$(find "$root" -type f | wc -l)" -eq 20 ]]
          expected_dirs=$'phases\nphases/backend\nphases/baseline\nphases/bridge\nphases/ui'
          actual_dirs="$(find "$root" -mindepth 1 -type d -printf '%P\n' | LC_ALL=C sort)"
          [[ "$actual_dirs" == "$expected_dirs" ]]
          [[ -z "$(find "$root" -mindepth 1 ! -type f ! -type d -print -quit)" ]]
          [[ "$(sha256sum "$root/rollout-plan.json" | awk '{print $1}')" == "$ROLLOUT_PLAN_SHA256" ]]
          /usr/bin/python3 -I -S -B "control/$ROLLOUT_VERIFIER_PATH" validate-capsule --root "$root" --manifest "control/$SOURCE_MANIFEST_PATH" --contract "control/$ROLLOUT_CONTRACT_PATH" --schema "control/$ROLLOUT_SCHEMA_PATH" --verifier "control/$ROLLOUT_VERIFIER_PATH"
          "$RUNNER_TEMP/recovery-tools/jq" -e --arg phase "$PHASE" '([.phases[] | select(.phase == $phase)] | length) == 1' "$root/rollout-plan.json" > /dev/null
          signer="$RELEASE_REPOSITORY/$ROLLOUT_WORKFLOW_PATH"
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$signer" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$root/rollout-plan.json" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/rollout-provenance.json"
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$root/rollout-plan.json" "${flags[@]}" --predicate-type "$ROLLOUT_PREDICATE" > "$RUNNER_TEMP/rollout-policy.json"
          "$RUNNER_TEMP/recovery-tools/jq" -e 'type == "array" and length > 0' "$RUNNER_TEMP/rollout-provenance.json" > /dev/null
          "$RUNNER_TEMP/recovery-tools/jq" -e --slurpfile expected "$root/rollout-plan.json" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/rollout-policy.json" > /dev/null

  intent:
    name: Prepare and attest exact production Valkey recovery fork intent
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: rereply-production-recovery-create
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      intent_sha256: ${{ steps.names.outputs.intent_sha256 }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Prepare exact immutable fork intent with GET-only controller path
        id: names
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          DO_PRODUCTION_DATABASE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_DATABASE_READ_TOKEN }}
          PHASE: ${{ needs.authority.outputs.phase }}
          ROLLOUT_PLAN_SHA256: ${{ needs.authority.outputs.rollout_plan_sha256 }}
          TARGET_JSON: ${{ secrets.DO_PRODUCTION_DATABASE_TARGET_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$DO_PRODUCTION_DATABASE_READ_TOKEN" && -n "$TARGET_JSON" ]]
          mkdir -m 0700 "$RUNNER_TEMP/fork-intent"
          contract_sha="$(sha256sum "control/$PRODUCTION_CONTRACT_PATH" | awk '{print $1}')"
          controller_sha="$(sha256sum "control/$CONTROLLER_PATH" | awk '{print $1}')"
          export CONTROL_SHA PHASE ROLLOUT_PLAN_SHA256 contract_sha controller_sha
          /usr/bin/python3 -I -S -B -c 'import json,os,pathlib; value={"workflow_sha":os.environ["CONTROL_SHA"],"workflow_path":".github/workflows/prepare-production-valkey-recovery-fork.yml","run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"runner_environment":"github-hosted","rollout_plan_sha256":os.environ["ROLLOUT_PLAN_SHA256"],"contract_sha256":os.environ["contract_sha"],"controller_sha256":os.environ["controller_sha"]}; pathlib.Path(os.environ["RUNNER_TEMP"]+"/fork-control.json").write_text(json.dumps(value,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")'
          TARGET_JSON="$TARGET_JSON" /usr/bin/python3 -I -S -B -c 'import os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import verify_production_release as v; raw=os.environ.pop("TARGET_JSON"); value=v.loads_strict(raw); pathlib.Path(os.environ["RUNNER_TEMP"]+"/fork-target.json").write_bytes(v.canonical_file_bytes(value))'
          chmod 0600 "$RUNNER_TEMP/fork-control.json" "$RUNNER_TEMP/fork-target.json"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$RUNNER_TEMP" DO_PRODUCTION_DATABASE_READ_TOKEN="$DO_PRODUCTION_DATABASE_READ_TOKEN" /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" prepare-intent --target "$RUNNER_TEMP/fork-target.json" --control "$RUNNER_TEMP/fork-control.json" --phase "$PHASE" --contract "control/$PRODUCTION_CONTRACT_PATH" --output "$RUNNER_TEMP/production-valkey-recovery-fork-create-intent.json" --runner-temp "$RUNNER_TEMP"
          unset DO_PRODUCTION_DATABASE_READ_TOKEN TARGET_JSON
          mv "$RUNNER_TEMP/production-valkey-recovery-fork-create-intent.json" "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json"
          intent_sha="$(sha256sum "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json" | awk '{print $1}')"
          printf '%s\n' "$intent_sha" > "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.sha256"
          printf 'intent_sha256=%s\n' "$intent_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=production-valkey-recovery-fork-create-intent-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Attest exact fork intent provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/fork-intent/production-valkey-recovery-fork-create-intent.json

      - name: Attest exact fork intent policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/fork-intent/production-valkey-recovery-fork-create-intent.json
          predicate-type: ${{ env.INTENT_PREDICATE }}
          predicate-path: ${{ runner.temp }}/fork-intent/production-valkey-recovery-fork-create-intent.json

      - name: Upload exact signed fork intent
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: ${{ runner.temp }}/fork-intent
          if-no-files-found: error
          retention-days: 30

      - name: Canonicalize intent artifact digest
        id: digest
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact_digest=sha256:%s\n' "$RAW_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  create:
    name: Create exact production Valkey recovery fork
    needs: [authority, intent]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: rereply-production-recovery-create
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      receipt_sha256: ${{ steps.names.outputs.receipt_sha256 }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Download exact signed fork intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.intent.outputs.artifact_id }}
          path: ${{ runner.temp }}/fork-intent
          merge-multiple: true

      - name: Install pinned intent-verification tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/recovery-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"

      - name: Verify signed immutable intent before provider capability
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          subject="$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json"
          [[ "$(find "$RUNNER_TEMP/fork-intent" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-valkey-recovery-fork-create-intent.json production-valkey-recovery-fork-create-intent.sha256 " ]]
          [[ "$(cat "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.sha256")" == "$INTENT_SHA256" ]]
          [[ "$(sha256sum "$subject" | awk '{print $1}')" == "$INTENT_SHA256" ]]
          signer="$RELEASE_REPOSITORY/$WORKFLOW_PATH"
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$signer" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$subject" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/intent-provenance.json"
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$subject" "${flags[@]}" --predicate-type "$INTENT_PREDICATE" > "$RUNNER_TEMP/intent-policy.json"
          "$RUNNER_TEMP/recovery-tools/jq" -e 'type == "array" and length > 0' "$RUNNER_TEMP/intent-provenance.json" > /dev/null
          "$RUNNER_TEMP/recovery-tools/jq" -e --slurpfile expected "$subject" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/intent-policy.json" > /dev/null

      - name: Recheck exact protected main before fork creation
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const main = await github.rest.git.getRef({owner, repo, ref:'heads/main'});
            const current = await github.rest.actions.getWorkflowRun({owner,repo,run_id:context.runId});
            if (main.data.object.sha !== process.env.CONTROL_SHA || current.data.run_attempt !== 1 || current.data.head_sha !== process.env.CONTROL_SHA || current.data.event !== 'workflow_dispatch') throw new Error('fork authority changed');

      - name: Create one exact provider-native Valkey recovery fork
        id: names
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          DO_PRODUCTION_DATABASE_CREATE_TOKEN: ${{ secrets.DO_PRODUCTION_DATABASE_CREATE_TOKEN }}
          DO_PRODUCTION_DATABASE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_DATABASE_READ_TOKEN }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          PHASE: ${{ needs.authority.outputs.phase }}
          ROLLOUT_PLAN_SHA256: ${{ needs.authority.outputs.rollout_plan_sha256 }}
          TARGET_JSON: ${{ secrets.DO_PRODUCTION_DATABASE_TARGET_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$DO_PRODUCTION_DATABASE_CREATE_TOKEN" && -n "$DO_PRODUCTION_DATABASE_READ_TOKEN" && -n "$TARGET_JSON" ]]
          mkdir -m 0700 "$RUNNER_TEMP/fork-receipt"
          contract_sha="$(sha256sum "control/$PRODUCTION_CONTRACT_PATH" | awk '{print $1}')"
          controller_sha="$(sha256sum "control/$CONTROLLER_PATH" | awk '{print $1}')"
          export CONTROL_SHA PHASE ROLLOUT_PLAN_SHA256 contract_sha controller_sha
          /usr/bin/python3 -I -S -B -c 'import json,os,pathlib; value={"workflow_sha":os.environ["CONTROL_SHA"],"workflow_path":".github/workflows/prepare-production-valkey-recovery-fork.yml","run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"runner_environment":"github-hosted","rollout_plan_sha256":os.environ["ROLLOUT_PLAN_SHA256"],"contract_sha256":os.environ["contract_sha"],"controller_sha256":os.environ["controller_sha"]}; pathlib.Path(os.environ["RUNNER_TEMP"]+"/fork-control.json").write_text(json.dumps(value,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")'
          TARGET_JSON="$TARGET_JSON" /usr/bin/python3 -I -S -B -c 'import os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import verify_production_release as v; raw=os.environ.pop("TARGET_JSON"); value=v.loads_strict(raw); pathlib.Path(os.environ["RUNNER_TEMP"]+"/fork-target.json").write_bytes(v.canonical_file_bytes(value))'
          chmod 0600 "$RUNNER_TEMP/fork-control.json" "$RUNNER_TEMP/fork-target.json"
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$RUNNER_TEMP" DO_PRODUCTION_DATABASE_READ_TOKEN="$DO_PRODUCTION_DATABASE_READ_TOKEN" DO_PRODUCTION_DATABASE_CREATE_TOKEN="$DO_PRODUCTION_DATABASE_CREATE_TOKEN" /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" create-or-reconcile --target "$RUNNER_TEMP/fork-target.json" --control "$RUNNER_TEMP/fork-control.json" --phase "$PHASE" --contract "control/$PRODUCTION_CONTRACT_PATH" --intent "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json" --intent-sha256 "$INTENT_SHA256" --output "$RUNNER_TEMP/production-valkey-recovery-fork-create-receipt.json" --runner-temp "$RUNNER_TEMP"
          unset DO_PRODUCTION_DATABASE_READ_TOKEN DO_PRODUCTION_DATABASE_CREATE_TOKEN TARGET_JSON
          mv "$RUNNER_TEMP/production-valkey-recovery-fork-create-receipt.json" "$RUNNER_TEMP/fork-receipt/production-valkey-recovery-fork-create-receipt.json"
          receipt_sha="$(sha256sum "$RUNNER_TEMP/fork-receipt/production-valkey-recovery-fork-create-receipt.json" | awk '{print $1}')"
          printf '%s\n' "$receipt_sha" > "$RUNNER_TEMP/fork-receipt/production-valkey-recovery-fork-create-receipt.sha256"
          printf 'receipt_sha256=%s\n' "$receipt_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=unsigned-production-valkey-recovery-fork-create-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned exact fork receipt
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: ${{ runner.temp }}/fork-receipt
          if-no-files-found: error
          retention-days: 2

      - name: Canonicalize unsigned receipt artifact digest
        id: digest
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact_digest=sha256:%s\n' "$RAW_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  gate:
    name: Exact production Valkey recovery fork gate
    needs: [authority, intent, create]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-recovery-create
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Download exact unsigned fork receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.create.outputs.artifact_id }}
          path: ${{ runner.temp }}/fork-receipt
          merge-multiple: true

      - name: Download exact signed fork intent for final binding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.intent.outputs.artifact_id }}
          path: ${{ runner.temp }}/fork-intent
          merge-multiple: true

      - name: Install pinned final receipt-verification tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/recovery-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gate-gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gate-gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gate-gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]

      - name: Verify signed intent and live-bind exact clean-create receipt
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          DO_PRODUCTION_DATABASE_READ_TOKEN: ${{ secrets.DO_PRODUCTION_DATABASE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          PHASE: ${{ needs.authority.outputs.phase }}
          RECEIPT_SHA256: ${{ needs.create.outputs.receipt_sha256 }}
          ROLLOUT_PLAN_SHA256: ${{ needs.authority.outputs.rollout_plan_sha256 }}
          TARGET_JSON: ${{ secrets.DO_PRODUCTION_DATABASE_TARGET_JSON }}
        run: |
          set -euo pipefail
          [[ -n "$DO_PRODUCTION_DATABASE_READ_TOKEN" && -n "$TARGET_JSON" ]]
          [[ "$(find "$RUNNER_TEMP/fork-receipt" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-valkey-recovery-fork-create-receipt.json production-valkey-recovery-fork-create-receipt.sha256 " ]]
          [[ "$(cat "$RUNNER_TEMP/fork-receipt/production-valkey-recovery-fork-create-receipt.sha256")" == "$RECEIPT_SHA256" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/fork-receipt/production-valkey-recovery-fork-create-receipt.json" | awk '{print $1}')" == "$RECEIPT_SHA256" ]]
          [[ "$(find "$RUNNER_TEMP/fork-intent" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-valkey-recovery-fork-create-intent.json production-valkey-recovery-fork-create-intent.sha256 " ]]
          [[ "$(cat "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.sha256")" == "$INTENT_SHA256" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json" | awk '{print $1}')" == "$INTENT_SHA256" ]]
          signer="$RELEASE_REPOSITORY/$WORKFLOW_PATH"
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$signer" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/gate-intent-provenance.json"
          "$RUNNER_TEMP/recovery-tools/gh" attestation verify "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json" "${flags[@]}" --predicate-type "$INTENT_PREDICATE" > "$RUNNER_TEMP/gate-intent-policy.json"
          "$RUNNER_TEMP/recovery-tools/jq" -e 'type == "array" and length > 0' "$RUNNER_TEMP/gate-intent-provenance.json" > /dev/null
          "$RUNNER_TEMP/recovery-tools/jq" -e --slurpfile expected "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/gate-intent-policy.json" > /dev/null
          contract_sha="$(sha256sum "control/$PRODUCTION_CONTRACT_PATH" | awk '{print $1}')"
          controller_sha="$(sha256sum "control/$CONTROLLER_PATH" | awk '{print $1}')"
          export CONTROL_SHA PHASE ROLLOUT_PLAN_SHA256 contract_sha controller_sha
          /usr/bin/python3 -I -S -B -c 'import json,os,pathlib; value={"workflow_sha":os.environ["CONTROL_SHA"],"workflow_path":".github/workflows/prepare-production-valkey-recovery-fork.yml","run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"runner_environment":"github-hosted","rollout_plan_sha256":os.environ["ROLLOUT_PLAN_SHA256"],"contract_sha256":os.environ["contract_sha"],"controller_sha256":os.environ["controller_sha"]}; pathlib.Path(os.environ["RUNNER_TEMP"]+"/gate-fork-control.json").write_text(json.dumps(value,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")'
          TARGET_JSON="$TARGET_JSON" /usr/bin/python3 -I -S -B -c 'import os,pathlib,sys; sys.path.insert(0,"control/release/deployment"); import verify_production_release as v; value=v.loads_strict(os.environ.pop("TARGET_JSON")); pathlib.Path(os.environ["RUNNER_TEMP"]+"/gate-fork-target.json").write_bytes(v.canonical_file_bytes(value))'
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$RUNNER_TEMP" DO_PRODUCTION_DATABASE_READ_TOKEN="$DO_PRODUCTION_DATABASE_READ_TOKEN" /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" validate-create-receipt --target "$RUNNER_TEMP/gate-fork-target.json" --control "$RUNNER_TEMP/gate-fork-control.json" --phase "$PHASE" --contract "control/$PRODUCTION_CONTRACT_PATH" --intent "$RUNNER_TEMP/fork-intent/production-valkey-recovery-fork-create-intent.json" --intent-sha256 "$INTENT_SHA256" --receipt "$RUNNER_TEMP/fork-receipt/production-valkey-recovery-fork-create-receipt.json" --receipt-sha256 "$RECEIPT_SHA256" --output "$RUNNER_TEMP/validated-create-receipt.json" --runner-temp "$RUNNER_TEMP"
          [[ "$(sha256sum "$RUNNER_TEMP/validated-create-receipt.json" | awk '{print $1}')" == "$RECEIPT_SHA256" ]]
          unset DO_PRODUCTION_DATABASE_READ_TOKEN TARGET_JSON

      - name: Require exact pre-signing job and artifact inventory
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          INTENT_ARTIFACT_DIGEST: ${{ needs.intent.outputs.artifact_digest }}
          INTENT_ARTIFACT_ID: ${{ needs.intent.outputs.artifact_id }}
          INTENT_ARTIFACT_NAME: ${{ needs.intent.outputs.artifact_name }}
          RECEIPT_ARTIFACT_DIGEST: ${{ needs.create.outputs.artifact_digest }}
          RECEIPT_ARTIFACT_ID: ${{ needs.create.outputs.artifact_id }}
          RECEIPT_ARTIFACT_NAME: ${{ needs.create.outputs.artifact_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const main = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if (main.data.object.sha !== process.env.CONTROL_SHA) throw new Error('main changed before fork attestation');
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/1/jobs',{owner,repo,run_id:context.runId,per_page:100});
            const expected = ['Authenticate exact production Valkey recovery fork authority','Prepare and attest exact production Valkey recovery fork intent','Create exact production Valkey recovery fork','Exact production Valkey recovery fork gate'];
            if (JSON.stringify(jobs.map(job=>job.name).sort()) !== JSON.stringify(expected.sort())) throw new Error('fork job inventory differs');
            for (const job of jobs) {
              if (job.name === 'Exact production Valkey recovery fork gate') {
                if (job.status !== 'in_progress') throw new Error('fork gate state differs');
              } else if (job.status !== 'completed' || job.conclusion !== 'success') throw new Error('fork prerequisite job differs');
            }
            const list = await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:context.runId,per_page:100});
            if (list.data.total_count !== 2 || list.data.artifacts.length !== 2) throw new Error('fork artifact inventory differs');
            const expectedArtifacts = new Map([[Number(process.env.INTENT_ARTIFACT_ID),[process.env.INTENT_ARTIFACT_NAME,process.env.INTENT_ARTIFACT_DIGEST]],[Number(process.env.RECEIPT_ARTIFACT_ID),[process.env.RECEIPT_ARTIFACT_NAME,process.env.RECEIPT_ARTIFACT_DIGEST]]]);
            for (const artifact of list.data.artifacts) {
              const binding = expectedArtifacts.get(artifact.id);
              if (!binding || artifact.name !== binding[0] || artifact.digest !== binding[1] || artifact.expired || artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 1048576 || artifact.workflow_run.id !== context.runId) throw new Error('fork artifact binding differs');
            }

      - name: Attest exact fork receipt provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/fork-receipt/production-valkey-recovery-fork-create-receipt.json

      - name: Attest exact fork receipt policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/fork-receipt/production-valkey-recovery-fork-create-receipt.json
          predicate-type: ${{ env.RECEIPT_PREDICATE }}
          predicate-path: ${{ runner.temp }}/fork-receipt/production-valkey-recovery-fork-create-receipt.json

      - name: Upload exact signed fork receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-valkey-recovery-fork-create-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-receipt
          if-no-files-found: error
          retention-days: 30
