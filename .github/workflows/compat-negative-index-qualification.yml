name: Compatibility negative-index qualification

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: compat-negative-index-qualification
  cancel-in-progress: false

env:
  PINNED_GH_VERSION: '2.98.0'
  PINNED_GH_URL: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
  PINNED_GH_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de

jobs:
  qualify:
    name: Synthetic negative-index token and order qualification
    if: ${{ github.repository == 'medtechcorps-netizen/whatomate' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Check out actual main workflow source
        id: checkout
        timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned ordinary GitHub CLI
        id: install-gh
        timeout-minutes: 1
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/compat-tools"
          mkdir -m 0700 "$tools"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
            "$PINNED_GH_URL" -o "$tools/gh.tar.gz"
          printf '%s  %s\n' "$PINNED_GH_SHA256" "$tools/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/gh.tar.gz" -C "$tools"
          install -m 0755 "$tools/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools/gh"
          printf 'COMPAT_GH_BIN=%s\n' "$tools/gh" >> "$GITHUB_ENV"

      # One shared 600s / 32-command / 4MiB allowance. The real publisher also
      # retains its unchanged 10-call / 2MiB allowance. No database is contacted.
      - name: Qualify the ordinary token using a reserved synthetic ancestor
        id: qualify
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -S -B release/compat/qualify_negative_index.py

      - name: Attest only the labelled positive qualification statement
        id: sign-positive
        if: ${{ !cancelled() && steps.qualify.outcome == 'success' && steps.qualify.outputs.complete == 'true' }}
        timeout-minutes: 1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/public/qualification-positive.json
          predicate-type: https://rereply.dev/attestations/negative-index-qualification/v1
          predicate-path: ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/public/predicate-positive.json
          push-to-registry: false
          github-token: ${{ github.token }}

      - name: Attest only the labelled negative qualification statement
        id: sign-negative
        if: ${{ !cancelled() && steps.qualify.outcome == 'success' && steps.qualify.outputs.complete == 'true' && steps.sign-positive.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/public/qualification-negative.json
          predicate-type: https://rereply.dev/attestations/negative-index-qualification/v1
          predicate-path: ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/public/predicate-negative.json
          push-to-registry: false
          github-token: ${{ github.token }}

      - name: Retain bounded qualification diagnostics including refusals
        id: diagnostic
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: negative-index-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/public/
            ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/receipts/
            ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/compat-negative-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/failure.json
          if-no-files-found: error
          retention-days: 7

      - name: Require qualification, both signatures and diagnostics
        if: ${{ always() }}
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          INSTALL: ${{ steps.install-gh.outcome }}
          QUALIFY: ${{ steps.qualify.outcome }}
          POSITIVE: ${{ steps.sign-positive.outcome }}
          NEGATIVE: ${{ steps.sign-negative.outcome }}
          DIAGNOSTIC: ${{ steps.diagnostic.outcome }}
          COMPLETE: ${{ steps.qualify.outputs.complete }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B - <<'PY'
          import os
          names = ('CHECKOUT', 'INSTALL', 'QUALIFY', 'POSITIVE', 'NEGATIVE', 'DIAGNOSTIC')
          if os.environ.get('COMPLETE') != 'true' or any(os.environ.get(name) != 'success' for name in names):
              raise SystemExit(1)
          PY
