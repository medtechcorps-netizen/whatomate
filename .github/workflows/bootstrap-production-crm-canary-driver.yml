name: Bootstrap Production CRM Canary Driver
run-name: ${{ inputs.mode == 'install' && 'Install exact private CRM canary driver' || 'Check exact private CRM driver prerequisites' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check prerequisites without write credentials, or consume the one-time installation authority
        required: true
        type: choice
        default: check
        options:
          - check
          - install
      authorization_json:
        description: Reviewed public packet binding this control, private setup hash, fixture and image evidence
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: rereply-production
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  CONTROL_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  REF_PROTECTED: ${{ github.ref_protected }}
  BOOTSTRAP_AUTHORIZATION_JSON: ${{ inputs.authorization_json }}
  BOOTSTRAP_MODE: ${{ inputs.mode }}

jobs:
  authority:
    name: Verify exact one-time driver setup authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Validate public packet without private setup credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/bootstrap_production_crm_canary_driver.py validate --control-root control

  check:
    name: Check exact private CRM driver prerequisites without writes
    needs: authority
    if: ${{ inputs.mode == 'check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-crm-fixture
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Check private prerequisites without create or secret-write credentials
        env:
          GH_TOKEN: ${{ secrets.GH_DRIVER_BOOTSTRAP_READ_TOKEN }}
          CRM_CANARY_FIXTURE_INPUT_JSON: ${{ secrets.CRM_CANARY_FIXTURE_INPUT_JSON }}
          CRM_CANARY_DRIVER_BOOTSTRAP_JSON: ${{ secrets.CRM_CANARY_DRIVER_BOOTSTRAP_JSON }}
          DO_DRIVER_BOOTSTRAP_READ_TOKEN: ${{ secrets.DO_DRIVER_BOOTSTRAP_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/bootstrap_production_crm_canary_driver.py check --control-root control

  install:
    name: Install exact isolated CRM canary driver once
    needs: authority
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: rereply-production-crm-fixture
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Install private setup without exporting credential material
        env:
          GH_TOKEN: ${{ secrets.GH_DRIVER_BOOTSTRAP_READ_TOKEN }}
          CRM_CANARY_FIXTURE_INPUT_JSON: ${{ secrets.CRM_CANARY_FIXTURE_INPUT_JSON }}
          CRM_CANARY_DRIVER_BOOTSTRAP_JSON: ${{ secrets.CRM_CANARY_DRIVER_BOOTSTRAP_JSON }}
          DO_DRIVER_BOOTSTRAP_READ_TOKEN: ${{ secrets.DO_DRIVER_BOOTSTRAP_READ_TOKEN }}
          DO_DRIVER_BOOTSTRAP_CREATE_TOKEN: ${{ secrets.DO_DRIVER_BOOTSTRAP_CREATE_TOKEN }}
          GH_CANARY_ENVIRONMENT_WRITE_TOKEN: ${{ secrets.GH_CANARY_ENVIRONMENT_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$WORKFLOW_SHA" == "$CONTROL_SHA" ]]
          python3 -I -S -B control/release/deployment/bootstrap_production_crm_canary_driver.py install --control-root control --output-dir "$RUNNER_TEMP/driver-bootstrap-receipt"
      - name: Attest content-free driver setup provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/driver-bootstrap-receipt/receipt.json
      - name: Attest exact driver setup policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/driver-bootstrap-receipt/receipt.json
          predicate-type: https://rereply.app/attestations/crm-canary-driver-bootstrap/v1
          predicate-path: ${{ runner.temp }}/driver-bootstrap-receipt/receipt.json
      - name: Upload public driver setup receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-canary-driver-bootstrap-${{ github.run_id }}-1
          path: ${{ runner.temp }}/driver-bootstrap-receipt
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          compression-level: 0
          retention-days: 90

  gate:
    name: Exact private CRM canary driver setup gate
    needs: [authority, check, install]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both exact setup jobs
        env:
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_RESULT" == success ]]
          if [[ "$BOOTSTRAP_MODE" == check ]]; then
            [[ "$CHECK_RESULT" == success && "$INSTALL_RESULT" == skipped ]]
          elif [[ "$BOOTSTRAP_MODE" == install ]]; then
            [[ "$CHECK_RESULT" == skipped && "$INSTALL_RESULT" == success ]]
          else
            exit 1
          fi
