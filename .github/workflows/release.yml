name: Legacy Release - Disabled Safety Gate

on:
  workflow_dispatch:

# The historical tag-triggered GoReleaser path published mutable Docker Hub and
# GHCR tags without the exact-source, scan, SBOM, or attestation controls used by
# the production release process. Keep this entry point fail-closed so a tag can
# never create an artifact that might be mistaken for a production candidate.
permissions:
  contents: read

concurrency:
  group: rereply-legacy-release-disabled
  cancel-in-progress: false

jobs:
  release-disabled:
    name: legacy-release-disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse legacy release publication
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Legacy mutable-tag publication is disabled. Use the reviewed exact release image workflow."
          exit 1
