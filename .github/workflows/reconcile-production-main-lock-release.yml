          repository: ${{ github.repository }}
          run-id: ${{ needs.assertion.outputs.source_run_id }}

      - name: Authenticate exact gate artifacts and signed assertion
        env:
          ASSERTION_ARTIFACT_DIGEST: ${{ needs.assertion.outputs.assertion_artifact_digest }}
          ASSERTION_ARTIFACT_ID: ${{ needs.assertion.outputs.assertion_artifact_id }}
          ASSERTION_ARTIFACT_NAME: ${{ needs.assertion.outputs.assertion_artifact_name }}
          ASSERTION_SHA256: ${{ needs.assertion.outputs.assertion_sha256 }}
          CONTROL_SHA: ${{ needs.assertion.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe.outputs.artifact_digest }}
          OBSERVATION_ARTIFACT_ID: ${{ needs.observe.outputs.artifact_id }}
          OBSERVATIONS_SHA256: ${{ needs.observe.outputs.observations_sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          assertion="$RUNNER_TEMP/signed-assertion/production-main-lock-release-failure-assertion.json"
          observations="$RUNNER_TEMP/signed-observations/production-main-lock-release-observations.json"
          receipt_stem="production-phase-${{ needs.assertion.outputs.operation }}-receipt"
          [[ "$(find "$RUNNER_TEMP/signed-assertion" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-main-lock-release-failure-assertion.json production-main-lock-release-failure-assertion.sha256 " ]]
          [[ "$(find "$RUNNER_TEMP/signed-observations" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-main-lock-release-observations.json production-main-lock-release-observations.sha256 " ]]
          [[ "$(find "$RUNNER_TEMP/source-receipt" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "$receipt_stem.json $receipt_stem.sha256 " ]]
          [[ -z "$(find "$RUNNER_TEMP/signed-assertion" "$RUNNER_TEMP/signed-observations" "$RUNNER_TEMP/source-receipt" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(cat "$RUNNER_TEMP/signed-assertion/production-main-lock-release-failure-assertion.sha256")" == "$ASSERTION_SHA256" ]]
          [[ "$(sha256sum "$assertion" | awk '{print $1}')" == "$ASSERTION_SHA256" ]]
          [[ "$(cat "$RUNNER_TEMP/signed-observations/production-main-lock-release-observations.sha256")" == "$OBSERVATIONS_SHA256" ]]
          [[ "$(sha256sum "$observations" | awk '{print $1}')" == "$OBSERVATIONS_SHA256" ]]
          /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" validate-assertion --assertion "$assertion"
          gh api "/repos/$REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/gate-jobs.json"
          jq -e '.total_count == 3 and (.jobs|length) == 3 and ([.jobs[].name]|sort) == (["Authenticate and attest failed normal lock release assertion","Observe exact normal main lock release with read-only capability","Exact normal main lock release reconciliation gate"]|sort) and any(.jobs[]; .name == "Authenticate and attest failed normal lock release assertion" and .status == "completed" and .conclusion == "success") and any(.jobs[]; .name == "Observe exact normal main lock release with read-only capability" and .status == "completed" and .conclusion == "success") and any(.jobs[]; .name == "Exact normal main lock release reconciliation gate" and .status == "in_progress")' "$RUNNER_TEMP/gate-jobs.json" > /dev/null
          gh api "/repos/$REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/gate-artifacts.json"
          assertion_name="$ASSERTION_ARTIFACT_NAME"
          observations_name="unsigned-production-main-lock-release-observations-$GITHUB_RUN_ID-1"
          jq -e --argjson assertion_id "$ASSERTION_ARTIFACT_ID" --arg assertion_name "$assertion_name" --arg assertion_digest "$ASSERTION_ARTIFACT_DIGEST" --argjson observation_id "$OBSERVATION_ARTIFACT_ID" --arg observation_name "$observations_name" --arg observation_digest "$OBSERVATION_ARTIFACT_DIGEST" '.total_count == 2 and (.artifacts|length) == 2 and any(.artifacts[]; .id == $assertion_id and .name == $assertion_name and .digest == $assertion_digest and .expired == false) and any(.artifacts[]; .id == $observation_id and .name == $observation_name and .digest == $observation_digest and .expired == false)' "$RUNNER_TEMP/gate-artifacts.json" > /dev/null
          flags=(--repo "$RELEASE_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$WORKFLOW_PATH" --signer-digest "$CONTROL_SHA" --source-digest "$CONTROL_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          gh attestation verify "$assertion" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/gate-assertion-provenance.json"
          gh attestation verify "$assertion" "${flags[@]}" --predicate-type "$ASSERTION_PREDICATE" > "$RUNNER_TEMP/gate-assertion-policy.json"
          jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/gate-assertion-provenance.json" > /dev/null
          jq -e --slurpfile expected "$assertion" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/gate-assertion-policy.json" > /dev/null
          jq -S -n --arg run_id "$GITHUB_RUN_ID" --arg artifact_id "$ASSERTION_ARTIFACT_ID" --arg artifact_name "$assertion_name" --arg artifact_digest "$ASSERTION_ARTIFACT_DIGEST" --arg sha256 "$ASSERTION_SHA256" --arg signer "$RELEASE_REPOSITORY/$WORKFLOW_PATH" --arg sha "$CONTROL_SHA" --arg provenance_hash "$(sha256sum "$RUNNER_TEMP/gate-assertion-provenance.json" | awk '{print $1}')" --arg policy_hash "$(sha256sum "$RUNNER_TEMP/gate-assertion-policy.json" | awk '{print $1}')" '{binding:{run_id:$run_id,run_attempt:1,artifact_id:$artifact_id,artifact_name:$artifact_name,artifact_digest:$artifact_digest,sha256:$sha256},signer_workflow:$signer,signer_digest:$sha,source_digest:$sha,source_ref:"refs/heads/main",runner_environment:"github-hosted",provenance_predicate_type:"https://slsa.dev/provenance/v1",policy_predicate_type:"https://rereply.app/attestations/production-main-lock-release-failure-assertion/v1",provenance_verification_sha256:$provenance_hash,policy_verification_sha256:$policy_hash}' > "$RUNNER_TEMP/assertion-authority.json"

      - name: Final-read exact unlocked main and build reconciliation
        env:
          CONTROL_SHA: ${{ needs.assertion.outputs.control_sha }}
          GH_PRODUCTION_BRANCH_READ_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_READ_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          OPERATION: ${{ needs.assertion.outputs.operation }}
          RECEIPT_SHA256: ${{ needs.assertion.outputs.receipt_sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          github_read_token="$GITHUB_READ_TOKEN"
          branch_read_token="$GH_PRODUCTION_BRANCH_READ_TOKEN"
          unset GITHUB_READ_TOKEN GH_PRODUCTION_BRANCH_READ_TOKEN GH_TOKEN GITHUB_TOKEN
          [[ -n "$github_read_token" && -n "$branch_read_token" ]]
          assertion="$RUNNER_TEMP/signed-assertion/production-main-lock-release-failure-assertion.json"
          rule_id="$(jq -er '.branch.rule_id' "$assertion")"
          main_sha="$(GH_TOKEN="$github_read_token" gh api "/repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$CONTROL_SHA" ]]
          owner="${REPOSITORY%%/*}"; repo="${REPOSITORY#*/}"
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}}}}'
          GH_TOKEN="$branch_read_token" gh api graphql -f query="$query" -F owner="$owner" -F name="$repo" > "$RUNNER_TEMP/final-rule.json"
          jq -e --arg id "$rule_id" '.data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")]|length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == false and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' "$RUNNER_TEMP/final-rule.json" > /dev/null
          [[ "$(GH_TOKEN="$github_read_token" gh api "/repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$CONTROL_SHA" ]]
          jq -S -n --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg main_sha "$main_sha" --arg rule_id "$rule_id" '{round:3,observed_at:$observed_at,main_sha:$main_sha,rule_id:$rule_id,lock_branch:false,is_admin_enforced:true,lock_allows_fetch_and_merge:false,http_method:"POST",api_operation:"graphql-query"}' > "$RUNNER_TEMP/final-observation.json"
          unset branch_read_token github_read_token
          output="$RUNNER_TEMP/release-reconciliation"
          mkdir -m 0700 "$output"
          jq -S -n --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile control "$assertion" --slurpfile first_two "$RUNNER_TEMP/signed-observations/production-main-lock-release-observations.json" --slurpfile final "$RUNNER_TEMP/final-observation.json" '{completed_at:$completed_at,control:$control[0].control,observations:($first_two[0] + [$final[0]]),request_ledger:[range(1;4) as $round | {round:$round,label:"main-ref-before",http_method:"GET",api_operation:"rest-read"},{round:$round,label:"branch-rule",http_method:"POST",api_operation:"graphql-query"},{round:$round,label:"main-ref-after",http_method:"GET",api_operation:"rest-read"}],http_request_count:9,graphql_query_count:3,branch_mutation_request_count:0,mutation_text_present:false}' > "$RUNNER_TEMP/reconciliation-request.json"
          /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" build-reconciliation --request "$RUNNER_TEMP/reconciliation-request.json" --assertion "$assertion" --assertion-authority "$RUNNER_TEMP/assertion-authority.json" --output "$output/production-main-lock-release-reconciliation.json"
          receipt="$RUNNER_TEMP/source-receipt/production-phase-$OPERATION-receipt.json"
          [[ "$(sha256sum "$receipt" | awk '{print $1}')" == "$RECEIPT_SHA256" ]]
          /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" validate-reconciliation --reconciliation "$output/production-main-lock-release-reconciliation.json" --receipt "$receipt"

      - name: Recheck exact unlocked rule and fresh authority immediately before signing
        env:
