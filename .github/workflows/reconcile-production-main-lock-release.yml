        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.assertion.outputs.assertion_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/signed-assertion
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download exact unsigned double-read observations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.observe.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/signed-observations
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download exact original source receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.assertion.outputs.receipt_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/source-receipt
