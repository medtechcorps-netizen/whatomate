          [[ -n "$github_read_token" && -n "$branch_read_token" ]]
          [[ "$(GH_TOKEN="$github_read_token" gh api "/repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$CONTROL_SHA" ]]
          assertion="$RUNNER_TEMP/signed-assertion/production-main-lock-release-failure-assertion.json"
          rule_id="$(jq -er '.branch.rule_id' "$assertion")"
          owner="${REPOSITORY%%/*}"; repo="${REPOSITORY#*/}"
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}}}}'
          GH_TOKEN="$branch_read_token" gh api graphql -f query="$query" -F owner="$owner" -F name="$repo" > "$RUNNER_TEMP/pre-sign-rule.json"
          jq -e --arg id "$rule_id" '.data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")]|length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == false and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' "$RUNNER_TEMP/pre-sign-rule.json" > /dev/null
          [[ "$(GH_TOKEN="$github_read_token" gh api "/repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$CONTROL_SHA" ]]
          unset branch_read_token github_read_token
          /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" validate-assertion --assertion "$RUNNER_TEMP/signed-assertion/production-main-lock-release-failure-assertion.json"
          /usr/bin/python3 -I -S -B "control/$CONTROLLER_PATH" validate-reconciliation --reconciliation "$RUNNER_TEMP/release-reconciliation/production-main-lock-release-reconciliation.json" --receipt "$RUNNER_TEMP/source-receipt/production-phase-${{ needs.assertion.outputs.operation }}-receipt.json"

      - name: Attest exact normal main-lock release reconciliation provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-reconciliation/production-main-lock-release-reconciliation.json

      - name: Attest exact normal main-lock release reconciliation policy
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-reconciliation/production-main-lock-release-reconciliation.json
          predicate-type: ${{ env.RECONCILIATION_PREDICATE }}
          predicate-path: ${{ runner.temp }}/release-reconciliation/production-main-lock-release-reconciliation.json

      - name: Upload exact signed normal main-lock release reconciliation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-main-lock-release-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-reconciliation/production-main-lock-release-reconciliation.json
            ${{ runner.temp }}/release-reconciliation/production-main-lock-release-reconciliation.sha256
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
