name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A pull request's newer push cancels its older run. Every push to main gets
# its own group, so a main run is never cancelled or replaced by a later one:
# the Release plan requires a completed, successful push run for the exact
# commit it ships.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The only job that runs the Release workflow's tests, the schema guard's
  # tests and the CI workflow tests (release/deployment/test_ci_workflows.py).
  release-tests:
    name: release-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the Release workflow, its modules and the CI workflows
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s release/deployment -p 'test_*.py' -v

  # Stage 1's interim schema freeze (release/deployment/schema_change.py) at
  # pull-request time. A change the Release plan would refuse with
  # schema-change-blocked fails here, through the required 'test' check,
  # before it can merge and leave main unpromotable. A pull request is checked
  # from its merge base with main to GitHub's merge commit, so only its own
  # changes count; a push to main is checked against its first parent, so
  # the job always runs and the aggregator needs no exception.
  # test_ci_workflows.py runs this script against synthetic repositories.
  schema-guard:
    name: schema-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse guarded database changes
        run: |
          set -euo pipefail
          python3 -B - <<'GUARD'
          import os, sys
          from pathlib import Path

          sys.path.insert(0, str(Path("release/deployment").resolve()))
          import release_record
          import schema_change
          import ship_common as common

          MESSAGE = "guarded database code changed; it cannot be promoted in Part A; split or revert"
          REPO = Path.cwd()

          def commit(*args):
              raw = release_record.git_output(REPO, list(args), code="git-failed:schema-guard")
              return common.require_sha1(raw.decode("ascii", "replace").strip(), "git-failed:schema-guard")

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          try:
              head = commit("rev-parse", "--verify", "HEAD^{commit}")
              if event == "pull_request":
                  # The checkout is GitHub's merge of the pull request into
                  # main; its merge base with main is the main commit it was
                  # merged onto, so commits already on main never count.
                  base = commit("merge-base", "origin/main", head)
              elif event == "push":
                  base = commit("rev-parse", "--verify", head + "^1^{commit}")
              else:
                  common.fail("context-invalid:event")
              reasons = schema_change.check(REPO, base, head)
          except common.ReleaseError as error:
              print("schema guard failed closed: %s" % error)
              sys.exit(1)
          print("schema guard: %s, %s..%s" % (event, base, head))
          if not reasons:
              print("schema guard: clean")
              sys.exit(0)
          shown = []
          for reason in reasons:
              try:
                  shown.append(common.require_public_text(reason))
              except common.ReleaseError:
                  shown.append("(path withheld)")
          print(MESSAGE)
          for line in shown:
              print("  " + line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Schema guard refused\n\n%s\n\n" % MESSAGE)
              summary.write("".join("- %s\n" % line for line in shown))
          sys.exit(1)
          GUARD

  tenant-isolation:
    name: tenant-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatomate_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run PostgreSQL tenant isolation tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/whatomate_tenant_test?sslmode=disable
        run: go test -mod=readonly -v -timeout 45m ./internal/database -run '^TestTenantRLS_'

  go-race:
    name: go-race
    runs-on: ubuntu-24.04
    # The race suite is variable on shared runners: the same tree has completed
    # in about 47 minutes and has also been killed by the old 120-minute cap.
    # 360 is the GitHub-hosted per-job ceiling, so a slow-but-progressing run is
    # never reported as a failure by our own budget.
    timeout-minutes: 360

    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatomate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7@sha256:91d0f7e8c748ec7a4c2b4fb2c4f84edab794dd91d01e095e38dc906db9d684ab
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install pinned gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/whatomate_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          set -euo pipefail
          # gotestsum gives live "Running N/M tests" output, names failed
          # tests prominently at the end, and re-prints failure logs in a
          # final summary so we don't have to scroll.
          # -p 1 runs packages sequentially to avoid database conflicts
          # (all packages share the test DB).
          # --format testname streams a PASS/FAIL line per test as it
          # completes, so a hanging test is easy to spot — the last
          # printed test is the one before the hang.
          # -timeout 150m caps each package's test binary. One slow package on a
          # shared runner has hit the old 60m cap; the job's 360-minute limit
          # stays the outer ceiling for the whole race+coverage suite.
          package_output="$(go list -mod=readonly ./...)"
          [[ -n "$package_output" ]]
          mapfile -t packages < <(printf '%s\n' "$package_output")
          [[ "${#packages[@]}" -gt 0 ]]
          gotestsum \
            --format testname \
            --hide-summary=skipped \
            -- -mod=readonly -race -p 1 -timeout 150m -coverprofile=coverage.out "${packages[@]}"
          git diff --exit-code -- go.mod go.sum

      - name: Display coverage
        run: go tool cover -func=coverage.out | grep "total:"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.4

      - name: Lint workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          # With no arguments actionlint checks every workflow file under
          # .github/workflows, so a new workflow is linted without an edit here.
          actionlint

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        run: go build -mod=readonly -v ./...

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Scan Go dependencies and code
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOFLAGS=-mod=readonly govulncheck ./...
          git diff --exit-code -- go.mod go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          audit_rc=0
          npm audit --audit-level=high --json > "$RUNNER_TEMP/frontend-audit.json" || audit_rc=$?
          python3 - "$RUNNER_TEMP/frontend-audit.json" "$audit_rc" <<'AUDIT'
          import datetime, json, sys

          # Each exception names an advisory, must stay dev-only in the lock,
          # and lapses after its review date.
          # 2026-10-03: GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, stack exhaustion
          # on deeply nested patterns) has no patched release. braces is only
          # reached through the Tailwind and ESLint build toolchains, which
          # expand this repository's own fixed globs; it never ships in the
          # built assets or the production images.
          ALLOWED = {("braces", "stack-exhaustion denial of service", "2026-12-31")}
          TODAY = datetime.date.today().isoformat()
          LOCK = json.load(open("package-lock.json", encoding="utf-8"))

          def dev_only(package):
              rows = [meta for path, meta in LOCK.get("packages", {}).items()
                      if path == "node_modules/" + package or path.endswith("/node_modules/" + package)]
              return bool(rows) and all(meta.get("dev") is True for meta in rows)

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          # npm audit exits 1 exactly when a high or critical advisory exists;
          # any other exit status, an error object, or an incomplete report
          # (for example a registry outage) fails closed instead of passing.
          audit_rc = int(sys.argv[2])
          if (audit_rc not in (0, 1) or type(report) is not dict or "error" in report
                  or report.get("auditReportVersion") != 2
                  or type(report.get("vulnerabilities")) is not dict
                  or type(report.get("metadata")) is not dict):
              print("npm audit did not produce a complete report; failing closed")
              sys.exit(1)
          high_or_critical = [
              package for package, entry in report["vulnerabilities"].items()
              if type(entry) is not dict or entry.get("severity") in ("high", "critical")
          ]
          if (audit_rc == 1) != bool(high_or_critical):
              print("npm audit exit status contradicts its report; failing closed")
              sys.exit(1)
          blocking = []
          for package, entry in sorted(report.get("vulnerabilities", {}).items()):
              if entry.get("severity") not in ("high", "critical"):
                  continue
              for item in entry.get("via", []):
                  if not isinstance(item, dict):
                      continue
                  if any(item.get("name") == name and phrase in str(item.get("title"))
                         and TODAY <= review_by
                         for name, phrase, review_by in ALLOWED) and dev_only(package):
                      print("allowed dev-only advisory: %s <- %s" % (package, item.get("name")))
                  else:
                      blocking.append((entry.get("severity"), package, item.get("name"), item.get("title")))
          for severity, package, name, title in blocking:
              print("unexpected %s advisory: %s <- %s: %s" % (severity, package, name, title))
          if blocking:
              sys.exit(1)
          print("frontend audit policy satisfied")
          AUDIT

      - name: Test frontend unit suite
        working-directory: frontend
        run: npx --no-install vitest run src

      - name: Test CRM canary driver protocol
        run: node --test frontend/canary-driver/driver.test.mjs

      - name: Build production container
        run: docker build -f docker/Dockerfile -t rereply:ci .

      - name: Build Meta relay container
        run: docker build -f docker/meta-relay.Dockerfile -t rereply-meta-relay:ci .

      - name: Build Gmail relay container
        run: docker build -f docker/gmail-relay.Dockerfile -t rereply-gmail-relay:ci .

      - name: Reject ambient Trivy suppression policy
        run: |
          set -euo pipefail
          for path in .trivyignore .trivyignore.yaml trivy.yaml trivy.yml; do
            [[ ! -e "$path" && ! -L "$path" ]]
          done

      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Meta relay container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply-meta-relay:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Gmail relay container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply-gmail-relay:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # Branch protection requires this job. It runs even when a job it needs
  # failed or was cancelled (a skipped required check would count as passing)
  # and fails unless every job it needs succeeded. test_ci_workflows.py keeps
  # every other job of this workflow in its needs.
  test:
    name: test
    if: ${{ always() }}
    needs:
      - release-tests
      - schema-guard
      - tenant-isolation
      - go-race
      - lint
      - build
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every Test job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'NEEDS'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          if type(needs) is not dict or not needs:
              print("no job results to check; failing closed")
              sys.exit(1)
          failed = []
          for job, value in sorted(needs.items()):
              result = value.get("result") if type(value) is dict else None
              print("%s: %s" % (job, result))
              if result != "success":
                  failed.append(job)
          if failed:
              print("not successful: %s" % ", ".join(failed))
              sys.exit(1)
          NEEDS
