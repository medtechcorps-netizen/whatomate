name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tenant-isolation:
    name: tenant-isolation
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatomate_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run PostgreSQL tenant isolation tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/whatomate_tenant_test?sslmode=disable
        run: go test -mod=readonly -v ./internal/database -run '^TestTenantRLS_'

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatomate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7@sha256:91d0f7e8c748ec7a4c2b4fb2c4f84edab794dd91d01e095e38dc906db9d684ab
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test exact rollout evidence controls
        run: |
          python3 -m py_compile \
            release/deployment/verify_rollout_evidence.py \
            release/deployment/test_verify_rollout_evidence.py \
            release/deployment/verify_production_plan.py \
            release/deployment/test_verify_production_plan.py
          python3 -m unittest discover -s release/deployment -p 'test_*.py' -v

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install pinned gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/whatomate_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          set -euo pipefail
          # gotestsum gives live "Running N/M tests" output, names failed
          # tests prominently at the end, and re-prints failure logs in a
          # final summary so we don't have to scroll.
          # -p 1 runs packages sequentially to avoid database conflicts
          # (all packages share the test DB).
          # --format testname streams a PASS/FAIL line per test as it
          # completes, so a hanging test is easy to spot — the last
          # printed test is the one before the hang.
          # -timeout 30m caps each package's test binary. The enclosing 120m job
          # bound retains a finite ceiling while allowing for hosted PostgreSQL
          # runner variance in the race+coverage integration suites.
          package_output="$(go list -mod=readonly ./...)"
          [[ -n "$package_output" ]]
          mapfile -t packages < <(printf '%s\n' "$package_output" | grep -v /test/)
          [[ "${#packages[@]}" -gt 0 ]]
          gotestsum \
            --format testname \
            --hide-summary=skipped \
            -- -mod=readonly -race -p 1 -timeout 30m -coverprofile=coverage.out "${packages[@]}"
          git diff --exit-code -- go.mod go.sum

      - name: Display coverage
        run: go tool cover -func=coverage.out | grep "total:"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.4

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        run: go build -mod=readonly -v ./...

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Scan Go dependencies and code
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOFLAGS=-mod=readonly govulncheck ./...
          git diff --exit-code -- go.mod go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Build production container
        run: docker build -f docker/Dockerfile -t rereply:ci .

      - name: Build Meta relay container
        run: docker build -f docker/meta-relay.Dockerfile -t rereply-meta-relay:ci .

      - name: Build Gmail relay container
        run: docker build -f docker/gmail-relay.Dockerfile -t rereply-gmail-relay:ci .

      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Meta relay container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply-meta-relay:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Gmail relay container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rereply-gmail-relay:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
