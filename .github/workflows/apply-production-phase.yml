          schema_sha="$(sha256sum "control/$SCHEMA_PATH" | awk '{print $1}')"
          intent_schema_sha="$(sha256sum "control/$INTENT_SCHEMA_PATH" | awk '{print $1}')"
          args=(prepare-intent --evidence-request "$RUNNER_TEMP/apply-evidence.json" --production-plan "$RUNNER_TEMP/plan/production-plan.json" --rollout-plan "$RUNNER_TEMP/rollout-plan.json" --recovery "$RUNNER_TEMP/recovery/production-recovery-readiness.json" --release-policy-sha256 "$policy_sha" --change-schema-sha256 "$schema_sha" --mutation-intent-schema-sha256 "$intent_schema_sha" --controller-sha256 "$controller_sha" --workflow-sha "$CONTROL_SHA" --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt 1 --runner-temp "$RUNNER_TEMP" --output "$RUNNER_TEMP/production-mutation-intent.json" --lock-authority "$RUNNER_TEMP/lock-authority.json" --route-contract-sha256 "$ROUTE_CONTRACT_SHA256")
