        with:
          artifact-ids: ${{ needs.prelock.outputs.root_marker_artifact_id }}
          path: ${{ runner.temp }}/root-lock

      - name: Download exact signed pre-lock mutation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.intent.outputs.intent_artifact_id }}
          path: ${{ runner.temp }}/mutation-intent

      - name: Authenticate exact signed pre-lock mutation intent
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          INTENT_ARTIFACT_DIGEST: ${{ needs.intent.outputs.intent_artifact_digest }}
          INTENT_ARTIFACT_ID: ${{ needs.intent.outputs.intent_artifact_id }}
          INTENT_ARTIFACT_NAME: ${{ needs.intent.outputs.intent_name }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          ROOT_ARTIFACT_DIGEST: ${{ needs.prelock.outputs.root_marker_artifact_digest }}
          ROOT_ARTIFACT_ID: ${{ needs.prelock.outputs.root_marker_artifact_id }}
          ROOT_ARTIFACT_NAME: ${{ needs.prelock.outputs.root_marker_name }}
          ROOT_SHA256: ${{ needs.prelock.outputs.root_marker_sha256 }}
        run: |
          set -euo pipefail
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          intent="$RUNNER_TEMP/mutation-intent/production-mutation-intent.json"
          [[ "$(find "$RUNNER_TEMP/mutation-intent" -maxdepth 1 -type f -printf '%f\n' | sort)" == $'production-mutation-intent.json\nproduction-mutation-intent.sha256' ]]
          [[ -z "$(find "$RUNNER_TEMP/mutation-intent" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]
          [[ "$(cat "$RUNNER_TEMP/mutation-intent/production-mutation-intent.sha256")" == "$INTENT_SHA256" ]]
          [[ "$(sha256sum "$intent" | awk '{print $1}')" == "$INTENT_SHA256" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/root-lock/apply-main-lock.json" | awk '{print $1}')" == "$ROOT_SHA256" ]]
          for descriptor in \
            "$INTENT_ARTIFACT_ID|$INTENT_ARTIFACT_NAME|$INTENT_ARTIFACT_DIGEST" \
            "$ROOT_ARTIFACT_ID|$ROOT_ARTIFACT_NAME|$ROOT_ARTIFACT_DIGEST"; do
            IFS='|' read -r artifact_id artifact_name artifact_digest <<< "$descriptor"
            artifact="$("$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            "$jq_bin" -e --arg name "$artifact_name" --arg digest "$artifact_digest" --argjson run_id "$GITHUB_RUN_ID" '.name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' <<< "$artifact" > /dev/null
          done
          flags=(--repo "$GITHUB_REPOSITORY" --signer-workflow "$RELEASE_REPOSITORY/$WORKFLOW_PATH" --signer-digest "$CONTROL_SHA" --source-ref refs/heads/main --source-digest "$CONTROL_SHA" --deny-self-hosted-runners --format json)
          "$gh_bin" attestation verify "$intent" "${flags[@]}" --predicate-type https://slsa.dev/provenance/v1 > "$RUNNER_TEMP/intent-provenance.json"
          "$gh_bin" attestation verify "$intent" "${flags[@]}" --predicate-type "$INTENT_PREDICATE" > "$RUNNER_TEMP/intent-policy.json"
          "$jq_bin" -e --slurpfile expected "$intent" 'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' "$RUNNER_TEMP/intent-policy.json" > /dev/null

      - name: Acquire the exact main lock with one reconciled mutation
        id: acquire
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_PRODUCTION_BRANCH_LOCK_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_LOCK_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          EXPECTED_INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          EXPECTED_ROOT_ARTIFACT_DIGEST: ${{ needs.prelock.outputs.root_marker_artifact_digest }}
          EXPECTED_ROOT_ARTIFACT_ID: ${{ needs.prelock.outputs.root_marker_artifact_id }}
          EXPECTED_ROOT_ARTIFACT_NAME: ${{ needs.prelock.outputs.root_marker_name }}
          EXPECTED_ROOT_SHA256: ${{ needs.prelock.outputs.root_marker_sha256 }}
          EXPECTED_RULE_ID: ${{ needs.prelock.outputs.rule_id }}
          EXPECTED_RULE_IDENTITY_SHA256: ${{ needs.prelock.outputs.rule_identity_sha256 }}
        run: |
          set -euo pipefail
          branch_lock_token="$GH_PRODUCTION_BRANCH_LOCK_TOKEN"
          github_read_token="$GITHUB_READ_TOKEN"
          unset GH_PRODUCTION_BRANCH_LOCK_TOKEN GITHUB_READ_TOKEN GH_TOKEN GITHUB_TOKEN
          [[ -n "$branch_lock_token" && -n "$github_read_token" ]]
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          [[ "$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$CONTROL_SHA" ]]
          current="$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          "$jq_bin" -e --arg sha "$CONTROL_SHA" '.run_attempt == 1 and .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and (.status == "in_progress" or .status == "queued")' <<< "$current" > /dev/null
          jobs="$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100")"
          "$jq_bin" -e 'any(.jobs[]; .name == "Prepare and attest exact production mutation intent" and .status == "completed" and .conclusion == "success")' <<< "$jobs" > /dev/null
          /usr/bin/python3 -I -S -B - <<'PY'
          import datetime as dt,os,pathlib,sys
          sys.path.insert(0,'control/release/deployment')
          import verify_production_release as common
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          intent_path=root/'mutation-intent'/'production-mutation-intent.json'
          if common.sha256_bytes(intent_path.read_bytes()) != common.require_sha256(os.environ['EXPECTED_INTENT_SHA256'],'mutation intent hash'):
              common.fail('mutation intent exact-file hash differs immediately before lock')
          intent=common.validate_mutation_intent(common.load_json(intent_path,'mutation intent'),now=dt.datetime.now(dt.timezone.utc))
          expected_root={'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'artifact_id':int(os.environ['EXPECTED_ROOT_ARTIFACT_ID']),'artifact_name':os.environ['EXPECTED_ROOT_ARTIFACT_NAME'],'artifact_digest':os.environ['EXPECTED_ROOT_ARTIFACT_DIGEST'],'sha256':os.environ['EXPECTED_ROOT_SHA256']}
          lock=intent['lock']
          if lock['mode']!='planned' or lock['strategy']!='acquire' or lock['rule_id']!=os.environ['EXPECTED_RULE_ID'] or lock['rule_identity_sha256']!=os.environ['EXPECTED_RULE_IDENTITY_SHA256'] or lock['root_acquire_intent']!=expected_root:
              common.fail('signed mutation intent lock authority differs immediately before lock')
          if lock['expected_pre_lock']!={'lock_branch':False,'is_admin_enforced':True,'lock_allows_fetch_and_merge':False} or lock['expected_post_lock']!={'lock_branch':True,'is_admin_enforced':True,'lock_allows_fetch_and_merge':False}:
              common.fail('signed mutation intent lock projections differ immediately before lock')
          PY
          repository_owner="$(cut -d/ -f1 <<< "$GITHUB_REPOSITORY")"
          repository_name="$(cut -d/ -f2- <<< "$GITHUB_REPOSITORY")"
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}} ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
          before="$(GH_TOKEN="$branch_lock_token" "$gh_bin" api graphql -f "query=$query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg id "$EXPECTED_RULE_ID" --arg sha "$CONTROL_SHA" '.data.repository.ref.target.oid == $sha and .data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == false and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$before" > /dev/null
          mutation='mutation($ruleId:ID!,$lock:Boolean!){updateBranchProtectionRule(input:{branchProtectionRuleId:$ruleId,lockBranch:$lock}){branchProtectionRule{id pattern lockBranch}}}'
          response="$RUNNER_TEMP/apply-lock-response.json"
          set +e
          GH_TOKEN="$branch_lock_token" "$gh_bin" api graphql -f "query=$mutation" -F "ruleId=$EXPECTED_RULE_ID" -F lock=true > "$response"
          status=$?
          set -e
          after="$(GH_TOKEN="$branch_lock_token" "$gh_bin" api graphql -f "query=$query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg id "$EXPECTED_RULE_ID" --arg sha "$CONTROL_SHA" '.data.repository.ref.target.oid == $sha and .data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .id == $id and .lockBranch == true and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$after" > /dev/null
          outcome=ambiguous-reconciled
          if [[ "$status" -eq 0 ]] && "$jq_bin" -e --arg id "$EXPECTED_RULE_ID" '(.errors // []) == [] and .data.updateBranchProtectionRule.branchProtectionRule.id == $id and .data.updateBranchProtectionRule.branchProtectionRule.pattern == "main" and .data.updateBranchProtectionRule.branchProtectionRule.lockBranch == true' "$response" > /dev/null; then
            outcome=applied
          fi
          printf 'outcome=%s\n' "$outcome" >> "$GITHUB_OUTPUT"
          branch_lock_token= github_read_token=

