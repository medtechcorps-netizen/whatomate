  lock:
    name: Acquire exact production apply main lock
    needs: [authority, prelock, intent]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-apply
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      outcome: ${{ steps.acquire.outputs.outcome }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
