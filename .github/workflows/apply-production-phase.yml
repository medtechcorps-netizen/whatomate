name: Apply Production Phase

run-name: Apply one exact production phase from signed evidence

on:
  workflow_dispatch:
    inputs:
      release_evidence_json:
        description: Exact control SHA and immutable production-plan, recovery, rollout, and predecessor evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rereply-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_REPOSITORY: medtechcorps-netizen/whatomate
  WORKFLOW_PATH: .github/workflows/apply-production-phase.yml
  PLAN_WORKFLOW_PATH: .github/workflows/plan-production-rollout.yml
  RECOVERY_WORKFLOW_PATH: .github/workflows/verify-production-recovery-readiness.yml
  CONTROLLER_PATH: release/deployment/apply_production_change.py
  COMMON_PATH: release/deployment/verify_production_release.py
  PRODUCTION_CONTRACT_PATH: release/deployment/production-app-contract.json
  PRODUCTION_PLAN_VERIFIER_PATH: release/deployment/verify_production_plan.py
  POLICY_PATH: release/deployment/production-release-policy.json
  SCHEMA_PATH: release/deployment/production-change.schema.json
  INTENT_SCHEMA_PATH: release/deployment/production-mutation-intent.schema.json
  LOCK_PROOF_SCHEMA_PATH: release/deployment/production-main-lock-proof.schema.json
  RELEASE_AUTHORIZATION_CONTROLLER_PATH: release/deployment/authorize_production_main_lock_release.py
  RELEASE_AUTHORIZATION_SCHEMA_PATH: release/deployment/production-main-lock-release-authorization.schema.json
  PLAN_PREDICATE: https://rereply.app/attestations/observation-only-production-plan/v2
  INTENT_PREDICATE: https://rereply.app/attestations/production-mutation-intent/v2
  LOCK_PROOF_PREDICATE: https://rereply.app/attestations/production-main-lock-proof/v1
  APPLY_PREDICATE: https://rereply.app/attestations/production-phase-apply-receipt/v1
  RELEASE_AUTHORIZATION_PREDICATE: https://rereply.app/attestations/production-main-lock-release-authorization/v1
  PINNED_JQ_VERSION: "1.8.2"
  PINNED_JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
  PINNED_JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
  PINNED_GH_VERSION: "2.98.0"
  PINNED_GH_URL: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
  PINNED_GH_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de

jobs:
  authority:
    name: Authenticate exact production apply authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      control_sha: ${{ steps.guard.outputs.control_sha }}
      plan_run_id: ${{ steps.request.outputs.plan_run_id }}
      plan_name: ${{ steps.request.outputs.plan_name }}
      recovery_run_id: ${{ steps.request.outputs.recovery_run_id }}
      recovery_name: ${{ steps.request.outputs.recovery_name }}
      predecessor_kind: ${{ steps.plan.outputs.predecessor_kind }}
      predecessor_run_id: ${{ steps.plan.outputs.predecessor_run_id }}
      predecessor_name: ${{ steps.plan.outputs.predecessor_name }}
      rollout_run_id: ${{ steps.plan.outputs.rollout_run_id }}
      rollout_name: ${{ steps.plan.outputs.rollout_name }}
    steps:
      - name: Require exact protected-main attempt-one authority
        id: guard
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch && "$REPOSITORY" == "$RELEASE_REPOSITORY" ]]
          [[ "$DISPATCH_REF" == refs/heads/main && "$REF_PROTECTED" == true ]]
          [[ "$RUN_ATTEMPT" == 1 && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$WORKFLOW_REF" == "$RELEASE_REPOSITORY/$WORKFLOW_PATH@refs/heads/main" ]]
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'control_sha=%s\n' "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.guard.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Install pinned production-plan authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          [[ "$("$tools_dir/jq" --version)" == "jq-$PINNED_JQ_VERSION" ]]

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" \
            "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]

      - name: Authenticate requested plan and recovery artifacts
        id: request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CONTROL_SHA: ${{ steps.guard.outputs.control_sha }}
          RAW: ${{ inputs.release_evidence_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const value = JSON.parse(process.env.RAW);
            const expected = ['control_sha','predecessor_state_sha256','production_plan','recovery','rollout_plan_sha256'];
            if (JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(expected) || value.control_sha !== process.env.CONTROL_SHA) throw new Error('apply descriptor differs');
            if (!/^[0-9a-f]{64}$/.test(value.rollout_plan_sha256) || !/^[0-9a-f]{64}$/.test(value.predecessor_state_sha256)) throw new Error('apply hashes differ');
            const {owner,repo} = context.repo;
            const main = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if (main.data.object.sha !== process.env.CONTROL_SHA) throw new Error('main changed');
            async function exact(binding, workflow, prefix, expectedJobs) {
              const keys=['artifact_digest','artifact_id','run_attempt','run_id','sha256'];
              if (JSON.stringify(Object.keys(binding).sort()) !== JSON.stringify(keys) || binding.run_attempt !== 1 || !/^sha256:[0-9a-f]{64}$/.test(binding.artifact_digest) || !/^[0-9a-f]{64}$/.test(binding.sha256)) throw new Error(`${prefix} binding differs`);
              const latest=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(binding.run_id)});
              const attempt=await github.rest.actions.getWorkflowRunAttempt({owner,repo,run_id:Number(binding.run_id),attempt_number:1});
              for (const run of [latest.data,attempt.data]) if (run.run_attempt!==1 || run.head_sha!==process.env.CONTROL_SHA || run.head_branch!=='main' || run.event!=='workflow_dispatch' || run.status!=='completed' || run.conclusion!=='success' || run.path!==workflow) throw new Error(`${prefix} run differs`);
              const jobs=await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',{owner,repo,run_id:Number(binding.run_id),attempt_number:1,per_page:100});
              const actual=jobs.map(job=>job.name).sort();
              if(JSON.stringify(actual)!==JSON.stringify([...expectedJobs].sort()) || jobs.some(job=>job.status!=='completed' || job.conclusion!=='success')) throw new Error(`${prefix} job inventory differs`);
              const artifact=await github.rest.actions.getArtifact({owner,repo,artifact_id:Number(binding.artifact_id)});
              const name=`${prefix}-${binding.run_id}-1`;
              if (artifact.data.name!==name || artifact.data.digest!==binding.artifact_digest || artifact.data.expired || artifact.data.workflow_run.id!==Number(binding.run_id)) throw new Error(`${prefix} artifact differs`);
              return name;
            }
            const planJobs=['Authenticate exact rollout authority','Independently verify and attest the sanitized plan','Observation-only production plan gate','Observe exact production state with read-only capability'];
            const recoveryJobs=['Authenticate exact production recovery authority','Exact production recovery readiness gate','Observe exact production recovery state'];
            const planName=await exact(value.production_plan,process.env.PLAN_WORKFLOW_PATH,'verified-production-plan',planJobs);
            const recoveryName=await exact(value.recovery,process.env.RECOVERY_WORKFLOW_PATH,'production-recovery-readiness',recoveryJobs);
            core.setOutput('plan_run_id',String(value.production_plan.run_id));
            core.setOutput('plan_name',planName);
            core.setOutput('recovery_run_id',String(value.recovery.run_id));
            core.setOutput('recovery_name',recoveryName);

      - name: Download exact production plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.request.outputs.plan_name }}
          path: ${{ runner.temp }}/plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.plan_run_id }}

      - name: Independently verify the exact production-plan attestations and controls
        env:
          CONTROL_SHA: ${{ steps.guard.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ steps.request.outputs.plan_run_id }}
          RAW: ${{ inputs.release_evidence_json }}
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          gh_bin="$tools_dir/gh"
          jq_bin="$tools_dir/jq"
          [[ "$(sha256sum "$gh_bin" | awk '{print $1}')" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "$jq_bin" | awk '{print $1}')" == "$PINNED_JQ_SHA256" ]]
          [[ "$(find "$RUNNER_TEMP/plan" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" == "production-plan.json production-plan.sha256 " ]]
          [[ -z "$(find "$RUNNER_TEMP/plan" -mindepth 1 \( -type l -o -type d \) -print -quit)" ]]

          /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          plan_path = root / "plan" / "production-plan.json"
          sidecar_path = root / "plan" / "production-plan.sha256"
          plan_raw = plan_path.read_bytes()
          plan_sha = hashlib.sha256(plan_raw).hexdigest()
          if sidecar_path.read_bytes() != (plan_sha + "\n").encode("ascii"):
              raise SystemExit("production plan sidecar differs")
          request = json.loads(os.environ["RAW"])
          binding = request["production_plan"]
          if binding["sha256"] != plan_sha or str(binding["run_id"]) != os.environ["PLAN_RUN_ID"]:
              raise SystemExit("production plan request binding differs")
          plan = json.loads(plan_raw)
          control = plan["control"]
          control_root = pathlib.Path("control")
          expected = {
              "workflow_sha": os.environ["CONTROL_SHA"],
              "workflow_path": ".github/workflows/plan-production-rollout.yml",
              "run_id": os.environ["PLAN_RUN_ID"],
              "run_attempt": 1,
              "contract_sha256": hashlib.sha256((control_root / "release/deployment/production-app-contract.json").read_bytes()).hexdigest(),
              "release_policy_sha256": hashlib.sha256((control_root / "release/deployment/production-release-policy.json").read_bytes()).hexdigest(),
              "change_schema_sha256": hashlib.sha256((control_root / "release/deployment/production-change.schema.json").read_bytes()).hexdigest(),
              "verifier_sha256": hashlib.sha256((control_root / "release/deployment/verify_production_plan.py").read_bytes()).hexdigest(),
          }
          for key, value in expected.items():
              if control.get(key) != value:
                  raise SystemExit(f"production plan {key} differs")
          PY

          signer="$RELEASE_REPOSITORY/$PLAN_WORKFLOW_PATH"
          flags=(
            --repo "$RELEASE_REPOSITORY"
            --signer-workflow "$signer"
            --signer-digest "$CONTROL_SHA"
            --source-digest "$CONTROL_SHA"
            --source-ref refs/heads/main
            --deny-self-hosted-runners
            --format json
          )
          "$gh_bin" attestation verify "$RUNNER_TEMP/plan/production-plan.json" "${flags[@]}" \
            --predicate-type https://slsa.dev/provenance/v1 \
            > "$RUNNER_TEMP/plan-provenance.json"
          "$gh_bin" attestation verify "$RUNNER_TEMP/plan/production-plan.json" "${flags[@]}" \
            --predicate-type "$PLAN_PREDICATE" \
            > "$RUNNER_TEMP/plan-policy.json"
          "$jq_bin" -e 'type == "array" and length > 0' "$RUNNER_TEMP/plan-provenance.json" > /dev/null
          "$jq_bin" -e --slurpfile expected "$RUNNER_TEMP/plan/production-plan.json" \
            'type == "array" and length > 0 and any(.[]; .verificationResult.statement.predicate == $expected[0])' \
            "$RUNNER_TEMP/plan-policy.json" > /dev/null

      - name: Extract immutable rollout and predecessor coordinates
        id: plan
        env:
          RAW: ${{ inputs.release_evidence_json }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B -c '
          import json,os,pathlib
          raw=json.loads(os.environ["RAW"]); p=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]+"/plan/production-plan.json").read_text())
          if set(p) != {"schema_version","authority","repository","issued_at","expires_at","control","rollout_authority","predecessor_authority","transition","provider_observation","target","preservation","provider_validation","rollback"}: raise SystemExit("plan keys differ")
          if p["schema_version"] != 2 or p["control"]["workflow_sha"] != raw["control_sha"] or p["rollout_authority"]["rollout_plan_sha256"] != raw["rollout_plan_sha256"] or p["predecessor_authority"]["state_sha256"] != raw["predecessor_state_sha256"]: raise SystemExit("plan authority differs")
          out=pathlib.Path(os.environ["GITHUB_OUTPUT"])
          pred=p["predecessor_authority"]; rollout=p["rollout_authority"]
          lines=[f"predecessor_kind={pred[\"kind\"]}",f"rollout_run_id={rollout[\"run_id\"]}",f"rollout_name=exact-four-phase-rollout-{rollout[\"run_id\"]}-{rollout[\"run_attempt\"]}"]
          if pred["kind"]=="phase-state": lines += [f"predecessor_run_id={pred[\"run_id\"]}",f"predecessor_name=production-phase-state-{pred[\"run_id\"]}-{pred[\"run_attempt\"]}"]
          elif pred["kind"]!="genesis": raise SystemExit("predecessor kind differs")
          out.open("a",encoding="utf-8").write("\n".join(lines)+"\n")'

  prelock:
    name: Prepare exact production apply pre-lock authority
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rereply-production-apply
    permissions:
      actions: read
      contents: read
    outputs:
      root_marker_name: ${{ steps.prepare.outputs.root_marker_name }}
      root_marker_sha256: ${{ steps.prepare.outputs.root_marker_sha256 }}
      rule_id: ${{ steps.prepare.outputs.rule_id }}
      rule_identity_sha256: ${{ steps.prepare.outputs.rule_identity_sha256 }}
      route_contract_sha256: ${{ steps.prepare.outputs.route_contract_sha256 }}
      root_marker_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      root_marker_artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false

      - name: Install pinned pre-lock authority tools
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -m 0700 "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_JQ_URL" -o "$tools_dir/jq"
          echo "$PINNED_JQ_SHA256  $tools_dir/jq" | sha256sum -c -
          chmod 0755 "$tools_dir/jq"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 "$PINNED_GH_URL" -o "$RUNNER_TEMP/gh.tar.gz"
          echo "$PINNED_GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${PINNED_GH_VERSION}_linux_amd64/bin/gh" "$tools_dir/gh"
          [[ "$("$tools_dir/gh" --version | awk 'NR == 1 {print $3}')" == "$PINNED_GH_VERSION" ]]
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"

      - name: Create exact durable apply pre-lock marker
        id: prepare
        env:
          CONTROL_SHA: ${{ needs.authority.outputs.control_sha }}
          GH_PRODUCTION_BRANCH_READ_TOKEN: ${{ secrets.GH_PRODUCTION_BRANCH_READ_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          TARGET_JSON: ${{ secrets.DO_PRODUCTION_TARGET_JSON }}
        run: |
          set -euo pipefail
          branch_read_token="$GH_PRODUCTION_BRANCH_READ_TOKEN"
          github_read_token="$GITHUB_READ_TOKEN"
          target_json="$TARGET_JSON"
          unset GH_PRODUCTION_BRANCH_READ_TOKEN GITHUB_READ_TOKEN TARGET_JSON GH_TOKEN GITHUB_TOKEN
          [[ -n "$branch_read_token" && -n "$github_read_token" && -n "$target_json" ]]
          gh_bin="$RUNNER_TEMP/release-tools/gh"
          jq_bin="$RUNNER_TEMP/release-tools/jq"
          [[ "$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$CONTROL_SHA" ]]
          current="$(GH_TOKEN="$github_read_token" "$gh_bin" api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          "$jq_bin" -e --arg sha "$CONTROL_SHA" '.run_attempt == 1 and .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and (.status == "in_progress" or .status == "queued")' <<< "$current" > /dev/null
          repository_owner="$(cut -d/ -f1 <<< "$GITHUB_REPOSITORY")"
          repository_name="$(cut -d/ -f2- <<< "$GITHUB_REPOSITORY")"
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){branchProtectionRules(first:100){nodes{id pattern lockBranch isAdminEnforced lockAllowsFetchAndMerge} pageInfo{hasNextPage}} ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
          rule_json="$(GH_TOKEN="$branch_read_token" "$gh_bin" api graphql -f "query=$query" -F "owner=$repository_owner" -F "name=$repository_name")"
          "$jq_bin" -e --arg sha "$CONTROL_SHA" '.data.repository.ref.target.oid == $sha and .data.repository.branchProtectionRules.pageInfo.hasNextPage == false and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")] | length) == 1 and ([.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main")][0] | .lockBranch == false and .isAdminEnforced == true and .lockAllowsFetchAndMerge == false)' <<< "$rule_json" > /dev/null
          rule_id="$("$jq_bin" -er '.data.repository.branchProtectionRules.nodes[] | select(.pattern == "main") | .id' <<< "$rule_json")"
          RULE_ID="$rule_id" TARGET_DESCRIPTOR="$target_json" /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,sys
          sys.path.insert(0,'control/release/deployment')
          import verify_production_release as common
          target=common.validate_target_descriptor(common.loads_strict(os.environ.pop('TARGET_DESCRIPTOR')))
          route_hash=common.public_route_contract_sha256(target['default_ingress'])
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'apply-main-lock.json'
          payload={'schema_version':1,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':1,'control_sha':os.environ['CONTROL_SHA'],'rule_id':os.environ['RULE_ID'],'state':'acquire-intent'}
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|getattr(os,'O_NOFOLLOW',0),0o600)
          with os.fdopen(fd,'wb') as stream:
              stream.write(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()+b'\n')
              stream.flush(); os.fsync(stream.fileno())
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as stream:
              stream.write(f"root_marker_name=production-main-lock-apply-{os.environ['GITHUB_RUN_ID']}-1\n")
              stream.write(f"root_marker_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}\n")
              stream.write(f"rule_id={os.environ['RULE_ID']}\n")
              stream.write(f"rule_identity_sha256={hashlib.sha256(os.environ['RULE_ID'].encode()).hexdigest()}\n")
              stream.write(f"route_contract_sha256={route_hash}\n")
          PY
          branch_read_token= github_read_token= target_json=

      - name: Upload durable apply pre-lock marker
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.prepare.outputs.root_marker_name }}
          path: ${{ runner.temp }}/apply-main-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Canonicalize apply pre-lock marker artifact digest
        id: digest
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf 'artifact_digest=sha256:%s\n' "$RAW_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  intent:
    name: Prepare and attest exact production mutation intent
    needs: [authority, prelock]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      intent_name: ${{ steps.prepare.outputs.intent_name }}
      intent_sha256: ${{ steps.prepare.outputs.intent_sha256 }}
      intent_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      intent_artifact_digest: ${{ steps.digest.outputs.artifact_digest }}
    steps:
      - name: Check out exact protected controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authority.outputs.control_sha }}
          fetch-depth: 1
          path: control
          persist-credentials: false
      - name: Download exact plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.plan_name }}
          path: ${{ runner.temp }}/plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.plan_run_id }}
      - name: Download exact recovery readiness
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.recovery_name }}
          path: ${{ runner.temp }}/recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authority.outputs.recovery_run_id }}
      - name: Download exact rollout capsule
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.authority.outputs.rollout_name }}
