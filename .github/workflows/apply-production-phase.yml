          lock={'mode':'planned','strategy':'acquire','branch':'main','rule_id':os.environ['RULE_ID'],'rule_identity_sha256':os.environ['RULE_IDENTITY_SHA256'],'expected_pre_lock':{'lock_branch':False,'is_admin_enforced':True,'lock_allows_fetch_and_merge':False},'expected_post_lock':{'lock_branch':True,'is_admin_enforced':True,'lock_allows_fetch_and_merge':False},'root_acquire_intent':{'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'artifact_id':int(os.environ['LOCK_ARTIFACT_ID']),'artifact_name':os.environ['LOCK_ARTIFACT_NAME'],'artifact_digest':os.environ['LOCK_ARTIFACT_DIGEST'],'sha256':os.environ['LOCK_SHA256']},'owner_operation':'apply','owner_run_id':int(os.environ['GITHUB_RUN_ID']),'owner_run_attempt':1,'owner_control_sha':os.environ['CONTROL_SHA'],'owner_intent_sha256':None}
