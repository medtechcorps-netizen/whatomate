          predicate-path: ${{ runner.temp }}/production-mutation-intent.json

      - name: Upload exact production mutation intent
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
