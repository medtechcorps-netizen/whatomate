# ReReply Configuration
# Copy this to config.toml and update values
#
# For Docker: use "db" and "redis" as hostnames
# For local dev: use "localhost"

[app]
name = "ReReply"
environment = "development"  # development, staging, production
debug = true
encryption_key = ""  # AES-256 key for encrypting secrets at rest (32+ chars, required in production)

[server]
host = "0.0.0.0"
port = 8080
read_timeout = 30
# Managed Messenger provider operations have a 90-second server budget. Keep
# this at 120 seconds or higher before enabling [meta_messenger_onboarding].
write_timeout = 120
base_path = ""  # Set to "/subpath" if behind nginx proxy pass
allowed_origins = ""  # Comma-separated CORS origins (e.g., "https://app.example.com,https://admin.example.com"). Empty = allow all (dev only).

[database]
# Optional connection URL. When set, it takes precedence over the individual
# fields below. On DigitalOcean App Platform, bind this to the managed
# database's DATABASE_PRIVATE_URL to keep production traffic inside the VPC.
url = ""
# Owner connection used only by the `rereply rls-migrate` pre-deploy job.
# Keep this secret out of the web service and worker environments.
migration_url = ""
runtime_role = "rereply_app"
rls_enabled = false
host = "db"  # Use "localhost" for local development
port = 5432
user = "whatomate"
password = "whatomate"
name = "whatomate"
ssl_mode = "disable"
max_open_conns = 25
max_idle_conns = 5
conn_max_lifetime = 300

[redis]
# Optional redis:// or rediss:// connection URL. When set, it takes precedence
# over the individual fields below and can be bound to a private Valkey URL.
url = ""
host = "redis"  # Use "localhost" for local development
port = 6379
username = ""  # Redis ACL username (Redis 6+). Leave empty to use the default user.
password = ""
db = 0
tls = false    # Set to true for TLS connections (e.g. Upstash, Redis Cloud)

[jwt]
secret = "your-super-secret-jwt-key-change-in-production"  # Must be 32+ chars in production
access_expiry_mins = 15
refresh_expiry_days = 1

[storage]
type = "local"  # local, s3
local_path = "./uploads"
s3_bucket = ""
s3_region = ""
s3_key = ""
s3_secret = ""
s3_endpoint = ""       # Optional for S3-compatible providers such as Railway
s3_use_path_style = false

[whatsapp]
webhook_verify_token = "random-string-change-this"
api_version = "v24.0"
base_url = "https://graph.facebook.com"
app_id = ""      # Meta App ID for Embedded Signup
app_secret = ""  # Meta App Secret
config_id = ""  # WhatsApp Config ID for frontend login

# Fail-closed rollout gate for replying from a legacy WhatsApp conversation in
# Omnichannel. Keep disabled until the strict backend is deployed. With enabled
# = true, an empty allowlist releases every organization; a comma-separated
# canonical UUID list releases only those pilot tenants.
# Environment equivalents:
# WHATOMATE_LEGACY_WHATSAPP_REPLY__ENABLED=true
# WHATOMATE_LEGACY_WHATSAPP_REPLY__ALLOWED_ORGANIZATION_IDS=<uuid>,<uuid>
[legacy_whatsapp_reply]
enabled = false
allowed_organization_ids = ""

[ai]
# Alibaba Cloud Model Studio international endpoint. For production workloads,
# replace this with the workspace-specific Singapore endpoint when available:
# https://<workspace-id>.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
qwen_base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"

# Google Search Console uses one deployment-managed OAuth application. Each
# workspace authorizes it separately; client_secret is never entered in the UI.
# redirect_url must exactly match an authorized redirect URI in Google Cloud.
[google_search_console]
client_id = ""
client_secret = ""
redirect_url = "https://app.example.com/api/integrations/google_search_console/callback"
# auth_url = "https://accounts.google.com/o/oauth2/auth"
# token_url = "https://oauth2.googleapis.com/token"
# api_base_url = "https://www.googleapis.com/webmasters/v3"

# Auth cookie settings (tokens are stored in httpOnly cookies)
[cookie]
domain = ""    # Cookie domain (e.g., ".example.com"). Empty = current host only.
secure = false # Set Secure flag on cookies. Auto-set true when environment=production.

# Rate limiting for auth endpoints (uses Redis fixed-window counters)
[rate_limit]
enabled = false                # Set to true to enable rate limiting
login_max_attempts = 10        # Max login attempts per IP per window
register_max_attempts = 10     # Max register attempts per IP per window
refresh_max_attempts = 30      # Max token refresh attempts per IP per window
sso_max_attempts = 10          # Max SSO init/callback attempts per IP per window
window_seconds = 60            # Time window in seconds
trust_proxy = false            # Trust X-Forwarded-For / X-Real-IP headers (set true behind reverse proxy)
api_max_requests = 200         # Max requests per IP per window for all /api/ routes (0 = 200)
api_window_seconds = 60        # Time window for global API rate limit (0 = 60)

# Text-to-Speech for IVR greetings (optional, requires piper + opusenc installed)
# Download piper: https://github.com/rhasspy/piper/releases (standalone binary)
# Download voice models: https://huggingface.co/rhasspy/piper-voices
# Install opusenc: apt install opus-tools (Debian/Ubuntu) / dnf install opus-tools (Fedora)
[tts]
# piper_binary = "/usr/local/bin/piper"
# piper_model = "/opt/piper/models/en_US-lessac-medium.onnx"
# opusenc_binary = "opusenc"  # defaults to finding in PATH

# WhatsApp Calling / WebRTC
[calling]
max_call_duration = 300       # Max call duration in seconds
audio_dir = "./audio"         # Directory for IVR audio files
# hold_music_file = "hold_music.opus"
# ringback_file = "ringback.opus"
transfer_timeout_secs = 120   # How long to wait for agent to accept transfer
recording_enabled = true      # Record calls to S3 (requires [storage] s3 config)
udp_port_min = 10000          # WebRTC UDP port range start
udp_port_max = 10100          # WebRTC UDP port range end
# public_ip = "1.2.3.4"      # Public IP for NAT mapping (required on AWS/cloud)
# relay_only = true           # Force all media through TURN relay (no direct UDP needed)

# ICE servers for WebRTC NAT traversal
# Configure STUN, TURN, or both. Only what you configure is used.
# - STUN only: works when direct UDP is not blocked by firewall
# - TURN only: relays all traffic, works behind any firewall
# - Both: tries direct (STUN) first, falls back to TURN

# Option A: STUN only (simple, no relay server needed)
# [[calling.ice_servers]]
# urls = ["stun:stun.l.google.com:19302"]

# Option B: TURN only (use when firewall blocks direct UDP)
# [[calling.ice_servers]]
# urls = ["turn:your-turn-server.com:3478"]
# username = "user"
# credential = "password"

# Option C: Both (recommended — direct when possible, relay as fallback)
# [[calling.ice_servers]]
# urls = ["stun:stun.l.google.com:19302"]
# [[calling.ice_servers]]
# urls = ["turn:your-turn-server.com:3478"]
# username = "user"
# credential = "password"

# Option D: TURN with a shared secret (coturn "use-auth-secret" / TURN REST API).
# When `secret` is set it takes priority over username/credential: short-lived
# credentials are generated per request (username = expiry timestamp, credential
# = base64(HMAC-SHA1(secret, username))). Match `secret` to coturn's
# `static-auth-secret`. `credential_ttl` (seconds) sets lifetime (default 86400).
# [[calling.ice_servers]]
# urls = ["turn:your-turn-server.com:3478"]
# secret = "your-coturn-static-auth-secret"
# credential_ttl = 86400

# Private Meta relay registry. Keep this disabled until every relay replica is
# running queue reader schema 2 and the separate managed Messenger application
# has been configured and cryptographically verified at both services.
[meta_registry]
enabled = false
lease_seconds = 30
ownership_max_age_mins = 1440
replay_window_seconds = 300
queue_reader_version = 0  # Set to 2 only after the reader-first deployment is complete.
# service_secret = "deployment-managed-secret-at-least-32-bytes"
# relay_edge_secret = "different-edge-secret-at-least-32-bytes"

# Facebook Login for Business managed Messenger lifecycle. This section and
# [meta_registry] are default-off together. During the pilot, configure exactly
# one canonical workspace UUID in allowed_organization_ids. Removing that UUID
# is a runtime kill switch: leases stop and the scheduler quarantines the
# managed account without calling Graph.
[meta_messenger_onboarding]
enabled = false
app_id = ""
config_id = ""
app_secret = ""
graph_api_version = "v25.0"
graph_base_url = "https://graph.facebook.com"
rereply_base_url = ""
relay_base_url = ""
health_approval_max_age_mins = 15
revalidation_lead_mins = 60
scheduler_interval_seconds = 60
allowed_organization_ids = ""  # Pilot: one canonical UUID; never a clinic name.
allow_all_organizations = false # External release only after Live + Advanced Access evidence.
allow_development_user_token = false # Non-production testing only; production requires BISU/SYSTEM_USER.

# Meta App Review recording gate for Threads. Leave this entire gate disabled
# in production; startup rejects any production deployment that configures it.
# Non-production testing must bind one exact workspace, Threads App ID, and
# app-role Threads profile ID. It does not create production approval evidence.
[threads_app_review]
development_testing_enabled = false
development_organization_id = ""
development_app_id = ""
development_profile_id = ""

# Shared, deployment-owned Threads applications. This control plane is
# independent from tenant-owned/BYO Threads apps and remains default-off. The
# compliance organization is a dedicated platform tenant and must not appear in
# allowed_organization_ids; it is also excluded when allow_all is released. Its
# Organization.settings must carry threads_managed_compliance_tenant=true and
# it must belong to the active `platform-direct` reseller before runtime use.
[threads_managed]
enabled = false
allowed_organization_ids = ""
allow_all_organizations = false
compliance_organization_id = ""

# The first deployment uses this env-compatible single-app object. Its key is
# persisted as the shard abstraction; a future release may instead use the
# `platform_apps` array, but startup rejects configuring both shapes. Keep both
# credentials in deployment secret storage, never clinic settings. Environment
# form example: WHATOMATE_THREADS_MANAGED__PLATFORM_APP__APP_SECRET.
[threads_managed.platform_app]
platform_app_key = ""
app_id = ""
app_secret = ""
webhook_verify_token = ""
app_review_status = ""
app_review_evidence_sha256 = ""
app_review_approved_at = ""
configuration_generation = 0

# Managed Instagram Login lifecycle. This uses a different Meta application,
# webhook route, app secret, and verify token from the legacy/static Instagram
# relay configuration. Enable only after the relay reader understands managed
# Instagram registry leases and the app review status is exactly `approved`.
# Active and quarantined workspace UUIDs are deployment-owned, canonical,
# disjoint, and bounded. Multi-workspace mode also requires one separate
# platform compliance organization for no-target/ambiguous deletion receipts.
[meta_instagram_onboarding]
enabled = false
quarantine_only = false # Emergency server-owned kill switch; keeps teardown/callback lifecycle running.
app_id = ""
app_secret = ""
app_review_status = "" # Required when enabled; production intake accepts only `approved`, while quarantine_only permits a server-owned downgrade.
graph_api_version = "v25.0"
authorization_base_url = "https://www.instagram.com"
token_base_url = "https://api.instagram.com"
graph_base_url = "https://graph.instagram.com"
rereply_base_url = "" # Production: exactly https://app.rereply.app
relay_base_url = "" # Production: exactly https://app.rereply.app/meta-relay
health_approval_max_age_mins = 15
revalidation_lead_mins = 60
token_refresh_lead_hours = 168
scheduler_interval_seconds = 60
allowed_organization_id = "" # Deprecated singleton rollout key. Keep only until every reader understands the plural fields.
allowed_organization_ids = "" # Comma-separated active canonical clinic UUIDs; maximum 32 across active + quarantined.
quarantined_organization_ids = "" # Offboarded/kill-switched clinic UUIDs retained for teardown, callbacks, and privacy status only.
data_deletion_compliance_organization_id = "" # Required with plural/quarantine fields; one distinct org owned by the active `platform-direct` reseller and marked `meta_instagram_data_deletion_compliance_tenant=true`, never a clinic.
development_test_profile_id = "" # Nonproduction only; exact IG professional profile ID.
development_test_oauth_subject_id = "" # Nonproduction only; exact app-scoped OAuth subject returned as /me.id.
development_app_role = "" # Nonproduction only: administrator, developer, or tester.

# Default admin credentials (only used during initial setup when no users exist)
[default_admin]
email = "admin@rereply.app"
# Always override this with WHATOMATE_DEFAULT_ADMIN__PASSWORD.
password = "replace-with-a-strong-random-password"
full_name = "ReReply Administrator"
